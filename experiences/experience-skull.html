<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>For the Love of God — Living Art Museum</title>
<meta name="description" content="A platinum skull paved in diamonds, in a dark room. Hold the light and move it — or tilt your phone — and watch the stones flash; look closer through a jeweller's loupe. After Damien Hirst's For the Love of God (2007), from the Living Art Museum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--serif:Fraunces,"Noto Serif KR",Georgia,serif;}
html[lang="ko"]{--serif:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;}
/* ==========================================================================
   FOR THE LOVE OF GOD — after Damien Hirst (2007).
   A skull of platinum paved with diamonds, rendered for real: every stone is a
   cut with a table and facets that throw the light back — and split it into
   colour. You hold the light (move it; in the dark room it is a torch), you
   can turn the skull — or tilt your phone — and a jeweller's loupe lets you
   look into the stones. The skull is modelled here; no photograph is used.
   ========================================================================== */
:root{
  --ink:#f3f2ef; --ink-dim:rgba(243,242,239,.68); --ink-faint:rgba(243,242,239,.42);
  --glass-a:rgba(255,255,255,.11); --glass-b:rgba(255,255,255,.05); --glass-line:rgba(255,255,255,.14);
  --chip-on:rgba(255,255,255,.92); --chip-on-ink:#0b0b0d; --accent:#f2a7c0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#050506;color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}
.glass{background:linear-gradient(180deg,var(--glass-a),var(--glass-b));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-line);box-shadow:0 24px 60px -30px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.1);}
#gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block;}
#gl{touch-action:none;}
#ov{pointer-events:none;}
body.m-rotate #gl{cursor:grab;} body.m-rotate.dragging #gl{cursor:grabbing;}
body.m-light #gl{cursor:none;} body.m-loupe #gl{cursor:none;}

.top{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:20px;z-index:10;display:flex;align-items:center;gap:14px;pointer-events:none;}
.top > *{pointer-events:auto;}
.logo{font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1;white-space:nowrap;text-decoration:none;color:var(--ink);}
.title{margin-left:auto;text-align:right;max-width:46vw;}
.title h1{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25;}
.title p{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
body.embedded .top{display:none;}

#bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:4px;padding:6px;border-radius:20px;max-width:calc(100% - 20px);}
.grp{display:flex;gap:2px;}
.chip{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:14px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;transition:background .2s,color .2s;}
.chip svg{width:18px;height:18px;flex:none;}
.chip:hover{color:var(--ink);background:rgba(255,255,255,.08);}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);}
.chip.ic{padding:9px 10px;}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--glass-line);}
#tilt{display:none;} body.can-tilt #tilt{display:flex;}
#snd[aria-pressed="false"] .on, #snd[aria-pressed="true"] .off{display:none;}
.ico{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
#hint{position:fixed;left:50%;top:var(--hint-y,90px);transform:translate(-50%,-50%);z-index:11;padding:9px 15px;border-radius:999px;font-size:12.5px;color:var(--ink);white-space:nowrap;pointer-events:none;transition:opacity .5s;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;}
#hint.off{opacity:0;}
#about{position:fixed;right:20px;top:calc(76px + env(safe-area-inset-top,0px));width:350px;max-height:calc(100% - 170px);overflow:auto;z-index:20;border-radius:22px;padding:20px 20px 18px;display:none;}
body.about #about{display:block;}
#about .tag{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
#about h2{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25;margin-top:8px;padding-right:24px;}
#about p{font-size:12.5px;line-height:1.65;color:var(--ink-dim);margin-top:9px;}
#about h3{font-size:12px;font-weight:600;margin-top:16px;padding-top:14px;border-top:1px solid var(--glass-line);}
#about ol{margin:8px 0 0 18px;font-size:12.5px;line-height:1.6;color:var(--ink-dim);}
#about .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim);}
#about .x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;}
html[lang="ko"] #about .tag{letter-spacing:.04em;}
#nogl{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;font-size:14px;color:var(--ink-dim);}
@media (max-width:760px){
  #bar{flex-wrap:wrap;justify-content:center;gap:2px;padding:5px;width:calc(100% - 16px);bottom:calc(10px + env(safe-area-inset-bottom,0px));}
  .sep{display:none;}
  .chip{padding:8px 10px;font-size:11.5px;gap:5px;} .chip .lb{display:none;}
  #hint{white-space:normal;text-align:center;border-radius:18px;width:max-content;line-height:1.45;}
  #about{left:10px;right:10px;width:auto;top:calc(64px + env(safe-area-inset-top,0px));}
  .title p{display:none;} .title h1{font-size:13px;}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="nogl"></div>

<header class="top">
  <a class="logo" href="#" onclick="return false">Living Art Museum</a>
  <div class="title"><h1 id="t-h"></h1><p id="t-p"></p></div>
</header>
<div id="hint" class="glass off"></div>

<nav id="bar" class="glass">
  <div class="grp" id="modes" role="group"></div>
  <span class="sep"></span>
  <button class="chip" id="dark" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg><span class="lb"></span></button>
  <button class="chip" id="tilt" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.2" transform="rotate(-18 12 12)"/><path d="M3.5 8.5a9 9 0 000 7M20.5 8.5a9 9 0 010 7"/></svg><span class="lb"></span></button>
  <span class="sep"></span>
  <button class="chip ic" id="snd" aria-pressed="true"><svg class="ico on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg><svg class="ico off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
  <button class="chip ic" id="info"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</nav>

<section id="about" class="glass" aria-labelledby="ab-h">
  <button class="x" id="about-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="tag" id="ab-tag"></div>
  <h2 id="ab-h"></h2>
  <p id="ab-p1"></p>
  <p id="ab-p2"></p>
  <h3 id="ab-h3"></h3>
  <ol id="ab-ol"></ol>
</section>

<script>
"use strict";
/* ==========================================================================
   0. BASICS
   ========================================================================== */
const LANG = (() => {
  let l = (document.documentElement.lang || "en").slice(0, 2);
  try { const q = new URLSearchParams(location.search).get("lang"); if (q) l = q; } catch (_){}
  return l === "ko" ? "ko" : "en";
})();
document.documentElement.lang = LANG;
if (LANG === "ko") document.title = "신의 사랑을 위하여 — Living Art Museum";
const T = (o) => (o && (o[LANG] ?? o.en)) || "";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ==========================================================================
   1. THE SKULL — signed distances, ray-marched. Bone (paved with diamonds),
      the teeth (left bare, as in the work), the pink stone on the brow, and a
      black plinth. Then every stone is cut: a flat table, eight crown facets,
      a girdle — and each colour of light leaves it at a slightly different
      angle, so it flashes white and splits into fire.
   ========================================================================== */
const FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes; uniform mat3 uR, uRi;
uniform vec3 uL, uLc, uBeam, uCam;
uniform float uRoom, uDark, uTime, uZoom;
uniform vec3 uLoupe; uniform vec2 uView;
#define FREQ 30.0
#define PI 3.14159265

float sdE(vec3 p, vec3 r){ float k0 = length(p / r), k1 = length(p / (r * r)); return k0 * (k0 - 1.) / k1; }
float smin(float a, float b, float k){ float h = clamp(.5 + .5 * (b - a) / k, 0., 1.); return mix(b, a, h) - k * h * (1. - h); }
float smax(float a, float b, float k){ return -smin(-a, -b, k); }
float sdCap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0., 1.); return length(pa - ba * h) - r; }
float sdRB(vec3 p, vec3 b, float r){ vec3 q = abs(p) - b; return length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.) - r; }
vec3 hash3(vec3 p){ p = vec3(dot(p, vec3(127.1, 311.7, 74.7)), dot(p, vec3(269.5, 183.3, 246.1)), dot(p, vec3(113.5, 271.9, 124.6))); return fract(sin(p) * 43758.5453); }

float seg2(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0., 1.); return length(pa - ba * h); }
float plate(float d2, float dy, float r){ return length(max(vec2(d2, dy), 0.)) + min(max(d2, dy), 0.) - r; }
float bone(vec3 p){
  vec3 q = vec3(abs(p.x), p.y, p.z);
  /* the vault: long front to back, a little narrower at the brow */
  float d = sdE(p - vec3(0., .14, -.06), vec3(.58, .64, .74));
  d = smin(d, sdE(q - vec3(.28, -.16, -.12), vec3(.3, .28, .36)), .12);           /* the sides, wide down by the ears */
  d = smin(d, sdE(p - vec3(0., .12, .24), vec3(.5, .55, .5)), .16);
  /* the face: a flat-fronted upper jaw, cheekbones either side */
  float face = sdRB(p - vec3(0., -.38, .45), vec3(.17 - (p.y + .38) * .14, .14, .1), .09);
  face = smin(face, sdE(q - vec3(.35, -.26, .45), vec3(.13, .1, .11)), .08);
  d = smin(d, face, .1);
  d = smin(d, sdE(q - vec3(.42, -.36, -.18), vec3(.055, .085, .055)), .08);         /* behind the ears */
  /* the hollow of the temples, then the arch that bridges it */
  d = smax(d, -sdE(q - vec3(.58, -.12, .12), vec3(.1, .15, .18)), .07);
  d = smin(d, sdCap(q, vec3(.42, -.28, .38), vec3(.54, -.26, .04), .038), .04);
  d = smin(d, sdCap(q, vec3(.54, -.26, .04), vec3(.5, -.29, -.1), .034), .05);
  /* brow ridge */
  d = smin(d, sdCap(q, vec3(0., -.0, .69), vec3(.37, -.02, .57), .046), .07);
  /* eye sockets: deep */
  d = smax(d, -sdE(q - vec3(.225, -.14, .64), vec3(.135, .115, .46)), .03);
  /* the nose: a pear-shaped hole, a thin bridge of bone above it */
  vec3 n = p - vec3(0., -.36, .64); float wn = .033 + max(0., -n.y) * .3;
  d = smax(d, -sdE(vec3(n.x * .07 / wn, n.y, n.z), vec3(.07, .11, .3)), .02);
  d = smin(d, sdCap(p, vec3(0., -.07, .69), vec3(0., -.2, .68), .028), .04);
  /* the lower jaw: one horseshoe plate under the teeth … */
  vec2 xz = q.xz;
  float hs = min(min(seg2(xz, vec2(0., .58), vec2(.17, .52)), seg2(xz, vec2(.17, .52), vec2(.33, .33))), seg2(xz, vec2(.33, .33), vec2(.43, .04)));
  float m = plate(hs - .022, abs(p.y + .83) - .07, .032);
  /* … rising at the back, a plate up to the joint by the ear, and the point that tucks under the arch */
  float ra = plate(abs(q.x - .44) - .018, seg2(q.yz, vec2(-.86, .03), vec2(-.38, -.07)) - .075, .015);
  float co = plate(abs(q.x - .43) - .016, seg2(q.yz, vec2(-.78, .1), vec2(-.4, .13)) - .04, .012);
  m = smin(m, smin(ra, co, .06), .06);
  m = smin(m, sdE(p - vec3(0., -.93, .58), vec3(.09, .05, .05)), .04);                /* the chin */
  return smin(d, m, .02);
}
float teeth(vec3 p){
  vec3 c = p - vec3(0., 0., .26);
  float a = atan(c.x, c.z), s = .135, i = clamp(floor(a / s + .5), -5., 5.), th = i * s;
  vec3 q = vec3(c.x * cos(th) - c.z * sin(th), c.y, c.z * cos(th) + c.x * sin(th));
  float R = .355 - abs(i) * .008, h = .042 - abs(i) * .0025, w = .02;
  float up = sdRB(q - vec3(0., -.615, R), vec3(w * .8, h * .85, .016), .014);
  float lo = sdRB(q - vec3(0., -.705, R - .02), vec3(w * .7, h * .7, .015), .013);
  return min(up, lo);
}
vec2 map(vec3 p){
  vec3 l = uRi * (p - vec3(0., -.02, 0.));
  float b = bone(l), t = teeth(l);
  float pl = sdRB(p - vec3(0., -1.62, 0.), vec3(.85, .58, .85), .01);
  vec2 r = vec2(b, 1.);
  if (t < r.x) r = vec2(t, 2.);
  if (pl < r.x) r = vec2(pl, 3.);
  return r;
}
vec3 calcN(vec3 p){ const vec2 e = vec2(.0007, -.0007);
  return normalize(e.xyy * map(p + e.xyy).x + e.yyx * map(p + e.yyx).x + e.yxy * map(p + e.yxy).x + e.xxx * map(p + e.xxx).x); }
float shadow(vec3 ro, vec3 rd, float tmax){ float r = 1., t = .02;
  for (int i = 0; i < 28; i++){ float h = map(ro + rd * t).x; r = min(r, 9. * h / t); t += clamp(h, .01, .12); if (r < .004 || t > tmax) break; }
  return clamp(r, 0., 1.); }
float ao(vec3 p, vec3 n){ float o = 0., s = 1.; for (int i = 1; i <= 5; i++){ float h = .045 * float(i); o += (h - map(p + n * h).x) * s; s *= .72; } return clamp(1. - 2.2 * o, 0., 1.); }

/* the room as the stones see it: dark, two soft lights, the floor */
vec3 env(vec3 r, float rough){
  vec3 c = vec3(.006, .006, .008) + vec3(.012, .011, .010) * max(r.y, 0.);
  float w = 1. + rough * 6.;
  c += uRoom * vec3(1., .96, .9) * 2.6 * smoothstep(.93 - .05 * w, .965, dot(r, normalize(vec3(-.45, .85, .35)))) / w;
  c += uRoom * vec3(.82, .88, 1.) * 1.3 * smoothstep(.95 - .04 * w, .98, dot(r, normalize(vec3(.85, .25, -.4)))) / w;
  c += uRoom * vec3(.9, .9, .95) * .7 * smoothstep(.9 - .05 * w, .97, dot(r, normalize(vec3(.1, .2, 1.)))) / w;
  return c;
}

void main(){
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 uv = (gl_FragCoord.xy - .5 * uRes) / (.5 * min(uRes.x, uRes.y));
  float inL = 0.;
  if (uLoupe.z > 0.){ float dl = distance(px, uLoupe.xy);
    if (dl < uLoupe.z){ vec2 lc = (vec2(uLoupe.x, uRes.y - uLoupe.y) - .5 * uRes) / (.5 * min(uRes.x, uRes.y)); uv = lc + (uv - lc) / uZoom; inL = 1.; } }
  vec3 ro = uCam, rd = normalize(vec3(uv.x, uv.y + uView.y, -uView.x));
  vec3 col;
  float t = 1.5, hit = -1.;
  /* only march where the skull and plinth can be */
  vec3 oc = ro - vec3(0., -.6, 0.); float bb = dot(oc, rd), cc = dot(oc, oc) - 2.1 * 2.1, disc = bb * bb - cc;
  if (disc > 0.){
    t = max(.1, -bb - sqrt(disc)); float tmax = -bb + sqrt(disc);
    for (int i = 0; i < 140; i++){ vec2 h = map(ro + rd * t); if (h.x < .0004 * t){ hit = h.y; break; } t += h.x * .9; if (t > tmax) break; }
  }
  /* the light: in the lit room it comes from where you put it; in the dark room it is a torch held at your eye */
  vec3 bg = vec3(.012, .012, .014) + vec3(.05, .046, .042) * uRoom * smoothstep(1.6, .0, length(uv - vec2(0., .5)));
  if (uDark > .5) bg += uLc * .025 * smoothstep(.96, .995, dot(rd, uBeam));
  if (hit < 0.){ col = bg; }
  else {
    vec3 p = ro + rd * t, N = calcN(p), V = -rd;
    vec3 Lp = uDark > .5 ? ro + vec3(.08, .05, 0.) : uL * 5.;
    vec3 Ld = normalize(Lp - p); float Ldist = length(Lp - p);
    vec3 Li = uLc;
    if (uDark > .5) Li *= smoothstep(.955, .985, dot(normalize(p - ro), uBeam)) * 1.6;
    float sh = shadow(p + N * .003, Ld, Ldist), occ = ao(p, N);
    vec3 K = normalize(vec3(-.3, 1., .45)); float kSh = uRoom > .2 ? shadow(p + N * .003, K, 4.) : 0.;
    if (hit > 2.5){                                                          /* the plinth: black lacquer */
      vec3 R = reflect(rd, N);
      col = vec3(.006) + env(R, .3) * .03 + Li * .02 * max(dot(N, Ld), 0.) * sh + uRoom * .025 * kSh * max(dot(N, K), 0.);
      col *= occ;
    } else if (hit > 1.5){                                                   /* the teeth: old ivory */
      vec3 alb = vec3(.56, .49, .37);
      float dif = max(dot(N, Ld), 0.) * sh, kd = max(dot(N, K), 0.) * kSh;
      vec3 H = normalize(Ld + V);
      col = alb * (Li * dif * .9 + uRoom * (.55 * kd + .05)) + Li * .25 * pow(max(dot(N, H), 0.), 40.) * sh;
      col *= occ * occ;
    } else {
      vec3 pl = uRi * (p - vec3(0., -.02, 0.)), Nl = normalize(uRi * N), Vl = normalize(uRi * V);
      vec3 T = normalize(cross(Nl, abs(Nl.y) < .92 ? vec3(0., 1., 0.) : vec3(1., 0., 0.))), B = cross(Nl, T);
      vec3 Lw = Ld;
      /* the pink diamond: a pear, point up, in the middle of the brow */
      vec2 f = vec2(pl.x, pl.y - .405);
      float pw = f.y > 0. ? .072 * (1. - clamp(f.y / .14, 0., 1.) * .8) : .072;
      float pr = pl.z > .4 ? length(vec2(f.x / pw, f.y / (f.y > 0. ? .14 : .085))) : 9.;
      vec3 c1; float d1 = 9., d2 = 9.; vec3 hid = vec3(0.);
      float metal, rr, sectors; vec3 dv;
      if (pr < 1.06){
        rr = pr; metal = smoothstep(.93, 1., pr); dv = vec3(f, 0.); hid = vec3(.37, .71, .13); sectors = 16.;
        dv = T * dot(vec3(f.x, f.y, 0.), T) + B * dot(vec3(f.x, f.y, 0.), B);
      } else {
        vec3 g = pl * FREQ, ip = floor(g), fp = fract(g);
        for (int k = -1; k <= 1; k++) for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
          vec3 o = vec3(float(i), float(j), float(k)), hh = hash3(ip + o), r = o + .1 + .8 * hh - fp; float dd = dot(r, r);
          if (dd < d1){ d2 = d1; d1 = dd; c1 = ip + o + .1 + .8 * hh; hid = hh; } else if (dd < d2) d2 = dd;
        }
        d1 = sqrt(d1); d2 = sqrt(d2);
        rr = d1 / (.5 * (d1 + d2) + .0001);
        metal = 1. - smoothstep(.03, .07, d2 - d1);
        dv = g - c1; sectors = 8.;
      }
      vec3 tv = dv - Nl * dot(dv, Nl);
      float ang = atan(dot(tv, B), dot(tv, T)) + hid.x * 6.283;
      float sec = floor(ang / (6.283 / sectors)), sa = (sec + .5) * (6.283 / sectors) - hid.x * 6.283;
      vec3 fd = cos(sa) * T + sin(sa) * B;
      float tilt = rr < .4 ? .0 : rr < .62 ? .45 : .75;
