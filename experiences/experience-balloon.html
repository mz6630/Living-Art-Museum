<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Love Is in the Bin — Living Art Museum</title>
<meta name="description" content="A gilt frame on a brick wall at night. Turn the handle and the painting goes down through the shredder in its own frame; the strips hang underneath like real paper — flick them, pull them, tear one off. After Banksy's Girl with Balloon, from the Living Art Museum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--serif:Fraunces,"Noto Serif KR",Georgia,serif;}
html[lang="ko"]{--serif:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;}
/* ==========================================================================
   LOVE IS IN THE BIN — after Banksy's Girl with Balloon (2006 / 2018).
   A clean white wall, a spotlight, a gilt frame with a handle on its side. Turn it and the canvas slides down through the shredder hidden in
   the frame; the strips hang underneath and behave like paper — they swing,
   twist to show their backs, flutter, and tear off if you pull too hard.
   ========================================================================== */
:root{
  --ink:#17171a; --ink-dim:rgba(23,23,26,.64); --ink-faint:rgba(23,23,26,.44);
  --glass-a:rgba(255,255,255,.74); --glass-b:rgba(255,255,255,.52); --glass-line:rgba(0,0,0,.09);
  --chip-on:#17171a; --chip-on-ink:#fff; --accent:#d42a20;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#efeeeb;color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}
.glass{background:linear-gradient(180deg,var(--glass-a),var(--glass-b));backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--glass-line);box-shadow:0 24px 60px -30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.5);}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}

.top{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:20px;z-index:10;display:flex;align-items:center;gap:14px;pointer-events:none;}
.top > *{pointer-events:auto;}
.logo{font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1;white-space:nowrap;text-decoration:none;color:var(--ink);}
.title{margin-left:auto;text-align:right;max-width:46vw;}
.title h1{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25;}
.title p{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
body.embedded .top{display:none;}

#bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:4px;padding:6px;border-radius:20px;max-width:calc(100% - 20px);}
.chip{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:14px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;transition:background .2s,color .2s;}
.chip svg{width:18px;height:18px;flex:none;}
.chip:hover{color:var(--ink);background:rgba(127,127,127,.12);}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);}
.chip.ic{padding:9px 10px;}
.chip:disabled{opacity:.4;cursor:default;}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--glass-line);}
#snd[aria-pressed="false"] .on, #snd[aria-pressed="true"] .off{display:none;}
.ico{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
#hint{position:fixed;left:50%;top:var(--hint-y,90px);transform:translate(-50%,-50%);z-index:11;padding:9px 15px;border-radius:999px;font-size:12.5px;color:var(--ink);white-space:nowrap;pointer-events:none;transition:opacity .5s;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;}
#hint.off{opacity:0;}
#about{position:fixed;right:20px;top:calc(76px + env(safe-area-inset-top,0px));width:350px;max-height:calc(100% - 170px);overflow:auto;z-index:20;border-radius:22px;padding:20px 20px 18px;display:none;}
body.about #about{display:block;}
#about .tag{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
#about h2{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25;margin-top:8px;padding-right:24px;}
#about p{font-size:12.5px;line-height:1.65;color:var(--ink-dim);margin-top:9px;}
#about h3{font-size:12px;font-weight:600;margin-top:16px;padding-top:14px;border-top:1px solid var(--glass-line);}
#about ol{margin:8px 0 0 18px;font-size:12.5px;line-height:1.6;color:var(--ink-dim);}
#about .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim);}
#about .x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;}
html[lang="ko"] #about .tag{letter-spacing:.04em;}

@media (max-width:760px){
  .chip{padding:8px 10px;font-size:11.5px;gap:5px;} .chip .lb{display:none;}
  #hint{white-space:normal;text-align:center;border-radius:18px;width:max-content;line-height:1.45;}
  #about{left:10px;right:10px;width:auto;top:calc(64px + env(safe-area-inset-top,0px));}
  .title p{display:none;} .title h1{font-size:13px;}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>

<header class="top">
  <a class="logo" href="#" onclick="return false">Living Art Museum</a>
  <div class="title"><h1 id="t-h"></h1><p id="t-p"></p></div>
</header>
<div id="hint" class="glass off"></div>

<nav id="bar" class="glass">
  <button class="chip" id="remote"><svg class="ico" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="3"/><circle cx="12" cy="9" r="2.4"/><path d="M10 15h4M10 18h4"/></svg><span class="lb"></span></button>
  <button class="chip" id="reset"><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="1"/><path d="M8.5 15l2.5-3 2 2 2.5-3.5"/><circle cx="9.5" cy="8.5" r="1.2"/></svg><span class="lb"></span></button>
  <span class="sep"></span>
  <button class="chip ic" id="snd" aria-pressed="true"><svg class="ico on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg><svg class="ico off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
  <button class="chip ic" id="info"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</nav>

<section id="about" class="glass" aria-labelledby="ab-h">
  <button class="x" id="about-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="tag" id="ab-tag"></div>
  <h2 id="ab-h"></h2>
  <p id="ab-p1"></p>
  <p id="ab-p2"></p>
  <p id="ab-p3"></p>
  <h3 id="ab-h3"></h3>
  <ol id="ab-ol"></ol>
</section>

const AW = 680, AH = 1000, ART = document.createElement("canvas"); ART.width = AW; ART.height = AH;
function paintStandIn(){
  const q = ART.getContext("2d");

  for (let k = 0; k < 9000; k++){ q.fillStyle = rnd() < .5 ? "rgba(0,0,0,.025)" : "rgba(255,255,255,.05)"; q.fillRect(rnd() * AW, rnd() * AH, 2, 2); }
  const spray = (x0, y0, x1, y1, w, col, drip) => {
    q.strokeStyle = col; q.lineCap = "butt"; q.lineWidth = w; q.beginPath(); q.moveTo(x0, y0); q.lineTo(x1, y1); q.stroke();
    const L = Math.hypot(x1 - x0, y1 - y0), n = L * 1.6; q.fillStyle = col;
    for (let i = 0; i < n; i++){ const t = rnd(), a = rnd() * 6.283, r = w * (.5 + Math.pow(rnd(), 2.2) * 1.4); q.globalAlpha = .12 + rnd() * .25; q.fillRect(x0 + (x1 - x0) * t + Math.cos(a) * r, y0 + (y1 - y0) * t + Math.sin(a) * r, 1.6, 1.6); }
    q.globalAlpha = 1;
    for (let k = 0; k < (drip || 0); k++){ const t = rnd(), x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t + w * .3, len = 18 + rnd() * 70;
      q.lineWidth = 2 + rnd() * 2.2; q.lineCap = "round"; q.beginPath(); q.moveTo(x, y); q.lineTo(x + rnd() - .5, y + len); q.stroke(); q.beginPath(); q.arc(x, y + len, 2.4, 0, 7); q.fill(); }
  };
  const ink = "#121214", red = "#d42a20";
  { const cx = AW * .72, cy = AH * .24, r = AW * .1;
    for (let k = 0; k < 2600; k++){ const a = rnd() * 6.283, d = r * (1 + Math.pow(rnd(), 3) * .25); q.globalAlpha = .1 + rnd() * .2; q.fillStyle = red; q.fillRect(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 1.6, 1.6); }
    q.globalAlpha = 1; q.fillStyle = red; q.beginPath(); q.arc(cx, cy, r, 0, 7); q.fill();
    q.strokeStyle = red; for (let k = 0; k < 3; k++){ const x = cx - r * .5 + rnd() * r, len = 30 + rnd() * 80; q.lineWidth = 2.5; q.lineCap = "round"; q.beginPath(); q.moveTo(x, cy + r * .9); q.lineTo(x, cy + r * .9 + len); q.stroke(); } }

  for (let t = .06; t < 1; t += .11){
    const a = P([r1[0][0] + (r1[1][0] - r1[0][0]) * t, r1[0][1] + (r1[1][1] - r1[0][1]) * t]), b = P([r2[0][0] + (r2[1][0] - r2[0][0]) * t, r2[0][1] + (r2[1][1] - r2[0][1]) * t]);
    spray(a[0], a[1], b[0], b[1], 9, ink, rnd() < .5 ? 1 : 0); }
}
function loadArt(){
  paintStandIn();

   2. THE STREET — drawn once per size: night sky, rooftops far off, the brick
      wall the frame hangs on, a lit window, a drainpipe, a lamp, the pavement
   ========================================================================== */
const cv = $("cv"), g = cv.getContext("2d");

const F = {};
const NS = 28, JAM = .55;

/* a hand-drawn line: a little wobble in the middle */
function wl(q, x0, y0, x1, y1, w){ const mx = (x0 + x1) / 2 + (rnd() - .5) * w * .9, my = (y0 + y1) / 2 + (rnd() - .5) * w * .9; q.moveTo(x0, y0); q.quadraticCurveTo(mx, my, x1, y1); }
function layout(){
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; small = W <= 760;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const embedded = document.body.classList.contains("embedded");
  const top = small ? (embedded ? 120 : 128) : (embedded ? 84 : 96);
  const a = AW / AH;
  let artH = Math.min((H * .6 - top) / 1.3, (W - (small ? 90 : 380)) / (a + .26), (W - 70) / (a + .4));
  artH = Math.max(150, artH);
  const artW = artH * a, fb = artH * .12, fbB = artH * .18;
  Object.assign(F, { artW, artH, fb, fbB });
  F.x0 = Math.round(W / 2 - (artW + 2 * fb) / 2 - (small ? artH * .06 : 0)); F.x1 = Math.round(F.x0 + artW + 2 * fb);
  F.y0 = Math.round(top); F.y1 = Math.round(F.y0 + fb + artH + fbB);
  F.ax0 = F.x0 + fb; F.ay0 = F.y0 + fb; F.ax1 = F.ax0 + artW; F.ay1 = F.ay0 + artH;
  F.slotY = F.y1 - fbB * .35;

  F.floor = H - (small ? 104 : 92);                  /* the foot of the wall, where the pavement starts */

    ratchet(){ if (!ok()) return; const tt = ctx.currentTime; noise(white, tt, .02, 2600, 2.5, .08); noise(brown, tt, .06, 380, 1, .08); },
    rustle(k){ if (!ok()) return; if (performance.now() - rT < 60) return; rT = performance.now(); noise(white, ctx.currentTime, .09 + Math.random() * .08, 2600 + Math.random() * 2400, .8, .03 + .07 * k); },
    /* a flicked strip: two quick slaps of paper on air */
    flap(){ if (!ok()) return; if (performance.now() - fT < 120) return; fT = performance.now(); const tt = ctx.currentTime; noise(white, tt, .05, 1400, .9, .07); noise(white, tt + .07, .04, 1800, .9, .05); },
    tear(){ if (!ok()) return; const tt = ctx.currentTime; for (let i = 0; i < 9; i++) noise(white, tt + i * .018, .035, 2200 + i * 260, 2.2, .07); },
    fall(){ if (!ok()) return; const tt = ctx.currentTime; for (let i = 0; i < 14; i++) noise(white, tt + i * .06 + Math.random() * .04, .2, 2000 + Math.random() * 3000, .9, .06); noise(brown, tt + .5, .6, 400, .6, .1, "lowpass"); },
    hang(){ if (!ok()) return; const tt = ctx.currentTime; tone(tt, 140, 100, .2, .15); noise(white, tt, .04, 1500, 1, .06); },
  };
})();

/* ==========================================================================
   6. RENDER
   ========================================================================== */
const BACK = "#e9e2d0";                                     /* the blank back of the canvas */
function drawStrip(s){
  const sw = AW / NS, ws = F.artW / NS * .94, ns = s.nodes;
  for (let j = 0; j < ns.length - 1; j++){
    const a = ns[j], b = ns[j + 1], dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy); if (len < .2) continue;
    const c = Math.cos((a.tw + b.tw) / 2), w = ws * Math.max(.1, Math.abs(c));
    g.save(); g.translate(a.x, a.y); g.rotate(Math.atan2(dy, dx) - Math.PI / 2);
    if (c >= 0) g.drawImage(ART, s.i * sw, a.ya, sw, b.ya - a.ya, -w / 2, -.4, w, len + .8);
    else { g.fillStyle = BACK; g.fillRect(-w / 2, -.4, w, len + .8); }
    g.fillStyle = `rgba(60,48,30,${(1 - Math.abs(c)) * .5})`; g.fillRect(-w / 2, -.4, w, len + .8);
    g.fillStyle = "rgba(0,0,0,.07)"; g.fillRect(w / 2 - Math.max(.6, w * .08), -.4, Math.max(.6, w * .08), len + .8);
    g.restore();
  }
  const e = ns[ns.length - 1], p = ns[ns.length - 2];               /* the cut end */

}
function drawPlaque(){
  /* a small card on the wall, to the right of the frame: the title, and what it became */
  const w = Math.max(116, F.artH * .46), h = w * .5, x = small ? F.x0 : F.x1 + F.artH * .32, y = small ? F.y1 + F.artH * 1.02 : F.y1 - h - F.fbB * .1;
  if (small) return;
  g.save(); g.shadowColor = "rgba(0,0,0,.14)"; g.shadowBlur = 8; g.shadowOffsetY = 2; g.fillStyle = "#fbfaf7"; g.fillRect(x, y, w, h); g.restore();
  const pad = w * .09; g.textBaseline = "top"; g.fillStyle = "#1c1530";
  g.font = `600 ${Math.round(w * .085)}px ${LANG === "ko" ? '"Noto Sans KR"' : "Fraunces"}, serif`;
  const old = T({ en:"Girl with Balloon", ko:"풍선을 든 소녀" }); g.fillText(old, x + pad, y + pad);
  if (S.jam){ const tw = g.measureText(old).width; g.strokeStyle = "#1c1530"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x + pad, y + pad + w * .05); g.lineTo(x + pad + tw, y + pad + w * .05); g.stroke();
    g.fillStyle = "#d42a20"; g.fillText(T({ en:"Love Is in the Bin", ko:"러브 이즈 인 더 빈" }), x + pad, y + pad + w * .12); }
  g.fillStyle = "rgba(28,21,48,.7)"; g.font = `500 ${Math.round(w * .062)}px ${LANG === "ko" ? '"Noto Sans KR"' : "Inter"}, sans-serif`;
  g.fillText(S.jam ? T({ en:"Banksy · 2006 / 2018", ko:"뱅크시 · 2006 / 2018" }) : T({ en:"Banksy · 2006", ko:"뱅크시 · 2006" }), x + pad, y + h - pad - w * .07);
}
function drawCrank(t){
  const c = F.crank, a = S.crankA, kx = c.x + Math.cos(a) * c.r, ky = c.y + Math.sin(a) * c.r;
  if (!S.started && !S.done){ const pu = .5 + .5 * Math.sin(t * 3.2); g.strokeStyle = `rgba(212,42,32,${.25 + pu * .35})`; g.lineWidth = 2; g.setLineDash([4, 5]);
    g.beginPath(); g.arc(c.x, c.y, c.r, 0, 7); g.stroke(); g.setLineDash([]); }
  /* hub */
  const hg = g.createRadialGradient(c.x - c.knob * .4, c.y - c.knob * .4, 1, c.x, c.y, c.knob * 1.5); hg.addColorStop(0, "#fbe7a6"); hg.addColorStop(.6, "#b8892f"); hg.addColorStop(1, "#5b3d0d");
  g.fillStyle = hg; g.beginPath(); g.arc(c.x, c.y, c.knob * 1.4, 0, 7); g.fill();
  /* arm */
  g.strokeStyle = "#8a6219"; g.lineWidth = c.knob * .7; g.lineCap = "round"; g.beginPath(); g.moveTo(c.x, c.y); g.lineTo(kx, ky); g.stroke();
  g.strokeStyle = "rgba(255,236,170,.6)"; g.lineWidth = c.knob * .2; g.beginPath(); g.moveTo(c.x, c.y - c.knob * .15); g.lineTo(kx, ky - c.knob * .15); g.stroke();
  /* knob: dark turned wood */
  const kg = g.createRadialGradient(kx - c.knob * .35, ky - c.knob * .35, 1, kx, ky, c.knob); kg.addColorStop(0, "#7a4a2a"); kg.addColorStop(1, "#24130a");
  g.fillStyle = kg; g.beginPath(); g.arc(kx, ky, c.knob, 0, 7); g.fill();
  g.fillStyle = "#3a2508"; g.beginPath(); g.arc(c.x, c.y, c.knob * .35, 0, 7); g.fill();
}
function render(t){
  g.setTransform(1, 0, 0, 1, 0, 0); if (BG) g.drawImage(BG, 0, 0);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sx = S.shake > .01 ? (rnd() - .5) * S.shake * 6 : 0, sy = S.shake > .01 ? (rnd() - .5) * S.shake * 3 : 0;
  /* the fallen pieces lie on the pavement, in front of the wall */
  g.save(); g.translate(sx, sy);
  g.fillStyle = "#d6d0c4"; g.fillRect(F.ax0, F.ay0, F.artW, F.artH);                      /* the empty back of the frame */
  g.save(); g.beginPath(); g.rect(F.ax0, F.ay0, F.artW, F.artH); g.clip();
  const off = S.p * F.artH;
  if (S.p < 1){ g.drawImage(ART, 0, 0, AW, AH * (1 - S.p), F.ax0, F.ay0 + off, F.artW, F.artH - off);
    if (off > 1){ const sh = g.createLinearGradient(0, F.ay0 + off - 10, 0, F.ay0 + off); sh.addColorStop(0, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,0,0,.22)"); g.fillStyle = sh; g.fillRect(F.ax0, F.ay0 + off - 10, F.artW, 10); } }
  { const ish = g.createLinearGradient(0, F.ay0, 0, F.ay0 + F.artH * .07); ish.addColorStop(0, "rgba(30,20,8,.32)"); ish.addColorStop(1, "rgba(30,20,8,0)"); g.fillStyle = ish; g.fillRect(F.ax0, F.ay0, F.artW, F.artH * .07); }
  g.restore();
  for (const s of strips) drawStrip(s);
  g.restore();
  g.setTransform(1, 0, 0, 1, sx * DPR, sy * DPR); if (FRAME) g.drawImage(FRAME, 0, 0);
  g.setTransform(DPR, 0, 0, DPR, sx * DPR, sy * DPR);
  drawCrank(t);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawPlaque();
  for (const s of fallen) drawStrip(s);
}

/* ==========================================================================
   7. LOOP
   ========================================================================== */
let last = performance.now(), t = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.04, (now - last) / 1000); last = now; t += dt;
  /* the remote: Banksy's button — runs the blades by itself, until it jams */
  if (S.auto && !S.jam && !S.done){ const da = dt * 6.283 * 1.1; S.crankA += da; ticks(); feed(da / 6.283 * .1); S.crankV = lerp(S.crankV, 1.1, .2); }
  if (ptr.mode !== "crank" && !S.auto) S.crankV *= Math.exp(-dt * 6);
  if (now - S.lastFeed > 140 && !S.auto) S.crankV *= Math.exp(-dt * 8);
  AUD.motor(S.crankV, S.jam);
  S.flash *= Math.exp(-dt * 9); S.shake *= Math.exp(-dt * 5);
  const steps = reduce ? 1 : 2; for (let k = 0; k < steps; k++) physics(dt / steps);
  render(t);
}

/* ==========================================================================
   8. UI
   ========================================================================== */
let hintT = 0, hintAt = 0;
function hint(s, brief){ const h = $("hint"); h.textContent = s; h.classList.remove("off"); hintAt = performance.now(); clearTimeout(hintT); hintT = setTimeout(() => h.classList.add("off"), brief ? 3600 : 6500); }
function hideHint(){ if (performance.now() - hintAt > 1800) $("hint").classList.add("off"); }
function setRemote(){ const b = $("remote"); b.classList.toggle("on", S.auto); b.disabled = S.jam || S.done; }
function siteLight(on){ try { if (window.parent !== window){ const ex = window.parent.document.getElementById("s-exp"); if (ex) ex.classList.toggle("light", on); } } catch (_){} }
function resetWork(){
  Object.assign(S, { p:0, jam:false, done:false, started:false, auto:false, crankV:0 }); strips = []; fallen = [];
  $("reset").classList.remove("on"); setRemote(); AUD.hang();
  hint(T({ en:"A new canvas in the frame. Turn the handle", ko:"액자에 새 그림이 걸렸어요. 손잡이를 돌려 보세요" }));
}
$("remote").querySelector(".lb").textContent = T({ en:"Remote", ko:"리모컨" });
$("remote").title = T({ en:"Press the hidden button, as Banksy did", ko:"뱅크시처럼 숨겨진 버튼을 눌러 보세요" });
$("reset").querySelector(".lb").textContent = T({ en:"Hang a new one", ko:"새 그림 걸기" });
$("remote").onclick = () => { AUD.unlock(); if (S.jam || S.done) return; S.auto = !S.auto; setRemote(); if (S.auto) hint(T({ en:"Somebody pressed a hidden button…", ko:"누군가 숨겨진 버튼을 눌렀어요…" }), true); };
$("reset").onclick = () => { AUD.unlock(); resetWork(); };
$("snd").onclick = () => { AUD.unlock(); AUD.on = !AUD.on; $("snd").setAttribute("aria-pressed", String(AUD.on)); };
$("info").onclick = () => document.body.classList.toggle("about");
$("about-x").onclick = () => document.body.classList.remove("about");
$("snd").setAttribute("aria-label", T({ en:"Sound", ko:"소리" })); $("info").setAttribute("aria-label", T({ en:"About the work", ko:"작품 설명" }));
$("about-x").setAttribute("aria-label", T({ en:"Close", ko:"닫기" }));
$("t-h").textContent = T({ en:"Girl with Balloon → Love Is in the Bin", ko:"풍선을 든 소녀 → 러브 이즈 인 더 빈" });
$("t-p").textContent = T({ en:"Banksy · 2006 / 2018 · the painting that shredded itself", ko:"뱅크시 · 2006 / 2018 · 스스로를 갈아 버린 그림" });
$("ab-tag").textContent = T({ en:"Banksy · 2006 / 2018", ko:"뱅크시 · 2006 / 2018" });
$("ab-h").textContent = T({ en:"The painting that shredded itself", ko:"스스로를 갈아 버린 그림" });
$("ab-p1").textContent = T({ en:"In October 2018, moments after it was sold in London, an alarm sounded inside the frame of Girl with Balloon and the canvas slid down through a shredder Banksy had built into it years before. It stopped halfway, hanging in strips.",
  ko:"2018년 10월 런던, '풍선을 든 소녀'가 팔린 직후 액자 속에서 경보음이 울렸고, 그림은 뱅크시가 몇 년 전 액자에 숨겨 둔 파쇄기를 지나 아래로 미끄러지며 갈렸어요. 파쇄는 절반에서 멈췄고, 그림은 가닥가닥 매달렸어요." });
$("ab-p2").textContent = T({ en:"Half destroyed, it became a new work, Love Is in the Bin. Turn the handle further than 2018 did — and ask what is left.",
  ko:"절반이 부서진 그림은 '러브 이즈 인 더 빈'이라는 새 작품이 되었어요. 2018년보다 더 돌려 끝까지 갈아 보고, 무엇이 남는지 생각해 보세요." });
$("ab-p3").textContent = T({ en:"The strips behave like paper: they cannot stretch, they bend, twist to show their blank backs, flutter — and tear if you pull too hard.",
  ko:"매달린 종이는 실제 종이처럼 늘어나지 않고, 휘고, 뒤집히며 캔버스 뒷면을 보이고, 팔랑거려요. 너무 세게 당기면 찢어져요." });
$("ab-h3").textContent = T({ en:"Try", ko:"해 보기" });
[{ en:"Turn the brass handle on the frame — clockwise. It only turns one way.", ko:"액자 옆 놋쇠 손잡이를 시계 방향으로 돌려요. 한쪽으로만 돌아가요." },
 { en:"Or press Remote, as Banksy did.", ko:"또는 뱅크시처럼 '리모컨'을 눌러 보세요." },
 { en:"Flick the strips; grab one and swing it; pull hard and it tears off.", ko:"종이 가닥을 튕기고, 잡아서 흔들고, 세게 당겨 찢어 보세요." },
 { en:"After the jam it is hard going — keep turning to finish what 2018 didn't.", ko:"멈춘 뒤에는 무거워요. 계속 돌리면 2018년에 못 끝낸 걸 끝낼 수 있어요." }]
 .forEach(s => { const li = document.createElement("li"); li.textContent = T(s); $("ab-ol").appendChild(li); });

/* ==========================================================================
   9. START
   ========================================================================== */
loadArt(); setRemote(); layout(); siteLight(true);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
window.addEventListener("resize", layout);
["pointerdown", "keydown", "touchstart"].forEach(ev => window.addEventListener(ev, () => AUD.unlock(), { capture:true, passive:true }));
window.addEventListener("pagehide", () => AUD.stop());
AUD.unlock(); setTimeout(() => AUD.unlock(), 150);
hint(T({ en:"Turn the handle on the frame", ko:"액자 옆 손잡이를 돌려 보세요" }));
requestAnimationFrame(frame);
window.__bal = { S, F, feed, turn, get strips(){ return strips; }, get fallen(){ return fallen; }, tearOff, step:(n, dt) => { for (let i = 0; i < n; i++) physics(dt || 1 / 60); render(t); }, resetWork };
</script>
