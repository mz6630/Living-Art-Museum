<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shark in Lines — Living Art Museum</title>
<meta name="description" content="A tiger shark drawn only in lines, kept in a three-bay tank with its eyes open. It moves only while you drag — a real scanimation film, vertical line engraving, loose tapered strokes, sonar. Hold your hand in front of its mouth. Leave it, and it rots. An experience from the Living Art Museum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--serif:Fraunces,"Noto Serif KR",Georgia,serif;}
html[lang="ko"]{--serif:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;}
/* ==========================================================================
   SHARK IN LINES — after Hirst's shark (1991).
   No photograph: a tiger shark painted here from scratch, then shown only
   through lines — a vertical line engraving, a real scanimation film you
   slide, loose tapered strokes, sonar rings. It is kept: eyes open, still.
   It moves only while you move it.
   ========================================================================== */
:root{
  --ink:#16171b; --ink-dim:rgba(22,23,27,.66); --ink-faint:rgba(22,23,27,.46);
  --glass-a:rgba(255,255,255,.72); --glass-b:rgba(255,255,255,.5); --glass-line:rgba(0,0,0,.1);
  --chip-on:#16171b; --chip-on-ink:#fff; --accent:#1b9aaa;
}
body.dark{ --ink:#f3f4f6; --ink-dim:rgba(243,244,246,.68); --ink-faint:rgba(243,244,246,.44);
  --glass-a:rgba(255,255,255,.12); --glass-b:rgba(255,255,255,.05); --glass-line:rgba(255,255,255,.15); --chip-on:rgba(255,255,255,.92); --chip-on-ink:#0b0c10; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#eef0ec;color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}
.glass{background:linear-gradient(180deg,var(--glass-a),var(--glass-b));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-line);box-shadow:0 24px 60px -30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);}
#gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block;}
#ov{pointer-events:none;}
#gl{touch-action:none;cursor:grab;}
#gl.dragging{cursor:grabbing;}

.top{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:20px;z-index:10;display:flex;align-items:center;gap:14px;pointer-events:none;}
.top > *{pointer-events:auto;}
.logo{font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1;white-space:nowrap;text-decoration:none;color:var(--ink);}
.title{margin-left:auto;text-align:right;max-width:46vw;}
.title h1{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25;}
.title p{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
body.embedded .top{display:none;}

.mono{position:fixed;z-index:6;font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mono b{color:var(--ink);font-weight:500;}
#clock span{display:inline;} #clock .g::before{content:" · ";}
@media (max-width:760px){ #clock span{display:block;line-height:18px;} #clock .g::before{content:"";} }
#clock{text-align:right;}
html[lang="ko"] .mono{letter-spacing:.03em;}

#bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:4px;padding:6px;border-radius:20px;max-width:calc(100% - 20px);}
.grp{display:flex;gap:2px;align-items:center;}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--glass-line);}
.chip{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:14px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;transition:background .2s,color .2s;}
.chip svg{width:18px;height:18px;flex:none;}
.chip:hover{color:var(--ink);background:rgba(127,127,127,.12);}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);}
.chip.ic{padding:9px 10px;}
.st i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8;}
#snd[aria-pressed="true"]{background:none;color:var(--ink-dim);}
#snd[aria-pressed="false"] .on, #snd[aria-pressed="true"] .off{display:none;}
.dens{display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--ink-dim);}
.dens svg{width:16px;height:16px;flex:none;}
.dens input{-webkit-appearance:none;appearance:none;width:92px;height:22px;background:transparent;cursor:pointer;}
.dens input::-webkit-slider-runnable-track{height:2px;background:var(--ink-faint);border-radius:2px;}
.dens input::-moz-range-track{height:2px;background:var(--ink-faint);border-radius:2px;}
.dens input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--chip-on);margin-top:-7px;border:2px solid var(--glass-a);}
.dens input::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--chip-on);border:2px solid var(--glass-a);}
#hint{position:fixed;left:50%;top:var(--hint-y,90px);transform:translate(-50%,-50%);z-index:11;padding:9px 15px;border-radius:999px;font-size:12.5px;color:var(--ink);white-space:nowrap;pointer-events:none;transition:opacity .5s;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;}
#hint.off{opacity:0;}
#replace{position:fixed;left:50%;top:var(--rep-y,50%);transform:translate(-50%,-50%);z-index:13;padding:12px 18px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink);display:none;align-items:center;gap:8px;}
#replace.on{display:flex;}
#replace b{font-family:"JetBrains Mono",monospace;font-weight:500;color:var(--ink-dim);}
#about{position:fixed;right:20px;top:calc(76px + env(safe-area-inset-top,0px));width:360px;max-height:calc(100% - 170px);overflow:auto;z-index:20;border-radius:22px;padding:20px 20px 18px;display:none;}
body.about #about{display:block;}
#about .tag{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
#about h2{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25;margin-top:8px;padding-right:24px;}
#about p{font-size:12.5px;line-height:1.65;color:var(--ink-dim);margin-top:9px;}
#about h3{font-size:12px;font-weight:600;margin-top:16px;padding-top:14px;border-top:1px solid var(--glass-line);}
#about ol{margin:8px 0 0 18px;font-size:12.5px;line-height:1.6;color:var(--ink-dim);}
#about .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim);}
#about .x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;}
.ico{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
html[lang="ko"] #about .tag{letter-spacing:.04em;}
#nogl{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;font-size:14px;color:var(--ink-dim);}

@media (max-width:760px){
  #bar{flex-wrap:wrap;justify-content:center;gap:2px;padding:5px;width:calc(100% - 16px);bottom:calc(10px + env(safe-area-inset-bottom,0px));}
  .sep{display:none;}
  .chip{padding:8px 9px;font-size:11.5px;gap:5px;} .chip .lb{display:none;} .st .lb{display:inline;}
  .dens{padding:0 4px;} .dens input{width:74px;}
  #about{left:10px;right:10px;width:auto;top:calc(64px + env(safe-area-inset-top,0px));}
  .mono{font-size:9.5px;}
  .title p{display:none;} .title h1{font-size:13px;}
  #hint{white-space:normal;text-align:center;border-radius:18px;width:max-content;line-height:1.45;}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="nogl"></div>

<header class="top">
  <a class="logo" href="#" onclick="return false">Living Art Museum</a>
  <div class="title"><h1 id="t-h"></h1><p id="t-p"></p></div>
</header>
<div id="plaque" class="mono"></div>
<div id="clock" class="mono"></div>
<div id="hint" class="glass off"></div>
<button id="replace" class="glass"></button>

<nav id="bar" class="glass">
  <div class="grp" id="styles" role="group"></div>
  <label class="dens" id="dens-l"><svg class="ico" viewBox="0 0 24 24"><path d="M5 4v16M8 4v16M11 4v16M14 4v16M17 4v16M20 4v16"/></svg><input type="range" id="dens" min="0" max="100" value="10"><svg class="ico" viewBox="0 0 24 24"><path d="M6 4v16M18 4v16"/></svg></label>
  <span class="sep"></span>
  <div class="grp" id="states" role="group"></div>
  <span class="sep"></span>
  <button class="chip ic" id="mir" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M7.5 19c.8-3 2.5-4.5 4.5-4.5s3.7 1.5 4.5 4.5"/></svg></button>
  <button class="chip ic" id="snd" aria-pressed="true"><svg class="ico on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg><svg class="ico off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
  <button class="chip ic" id="info"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</nav>

<section id="about" class="glass" aria-labelledby="ab-h">
  <button class="x" id="about-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="tag" id="ab-tag"></div>
  <h2 id="ab-h"></h2>
  <p id="ab-p1"></p>
  <p id="ab-p2"></p>
  <p id="ab-p3"></p>
  <h3 id="ab-h3"></h3>
  <ol id="ab-ol"></ol>
</section>

<script>
"use strict";
/* ==========================================================================
   0. BASICS
   ========================================================================== */
const LANG = (() => {
  let l = (document.documentElement.lang || "en").slice(0, 2);
  try { const q = new URLSearchParams(location.search).get("lang"); if (q) l = q; } catch (_){}
  return l === "ko" ? "ko" : "en";
})();
document.documentElement.lang = LANG;
if (LANG === "ko") document.title = "선으로 그린 상어 — Living Art Museum";
const T = (o) => (o && (o[LANG] ?? o.en)) || "";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const ease = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ==========================================================================
   1. THE SHARK — a tiger shark painted here from scratch, side on: slate back,
      dark tiger bars, a white belly with a wavy line, grey fins, five gill
      slits, the open eye, a mouth with small teeth. u: tail 0 → nose 1.
   ========================================================================== */
const SHARK = [
  [1.00, .020], [.975, -.030], [.93, -.062], [.86, -.088], [.76, -.108], [.665, -.118],
  [.615, -.205], [.585, -.285], [.565, -.312], [.548, -.300], [.545, -.200], [.53, -.118],
  [.43, -.098], [.335, -.078], [.312, -.112], [.296, -.128], [.285, -.075],
  [.21, -.052], [.145, -.036], [.11, -.058], [.06, -.150], [.025, -.262], [.008, -.300], [.002, -.288], [.03, -.150], [.062, -.020],
  [.055, .040], [.025, .135], [.012, .172], [.03, .168], [.085, .065], [.14, .033],
  [.22, .046], [.255, .052], [.236, .100], [.248, .104], [.29, .062],
  [.38, .075], [.435, .086], [.418, .135], [.43, .140], [.485, .096],
  [.585, .102], [.665, .104], [.62, .190], [.575, .262], [.59, .272], [.64, .232], [.74, .112],
  [.82, .102], [.875, .090], [.94, .072], [.955, .068], [.90, .055], [.985, .040],
];
const MU0 = -.04, MU1 = 1.04, MV = .36, TW = 1024, TH = Math.round(TW * (2 * MV) / (MU1 - MU0)), EXTW = 512;
const EYE = [.905, -.018], MOUTH = [.955, .05];
const PX = (u, v) => [(u - MU0) / (MU1 - MU0) * TW, (v + MV) / (2 * MV) * TH];
const SC = TW / (MU1 - MU0);              /* texture pixels per body length */
let PIC = null, EXT = null;
function bodyPath(q){
  const pts = SHARK.map(([u, v]) => PX(u, v)), n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  q.beginPath(); const m0 = mid(pts[n - 1], pts[0]); q.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++){ const a = pts[i], m = mid(a, pts[(i + 1) % n]); q.quadraticCurveTo(a[0], a[1], m[0], m[1]); }
  q.closePath();
}
function buildPicture(){
  const c = document.createElement("canvas"); c.width = TW; c.height = TH; const q = c.getContext("2d");
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  q.save(); bodyPath(q); q.clip();
  /* countershading: dark slate back to grey flank */
  const y = (v) => PX(0, v)[1];
  const gr = q.createLinearGradient(0, y(-.32), 0, y(.2));
  [[-.32, "#1f2b33"], [-.13, "#2f3e48"], [-.085, "#3b4b56"], [-.035, "#536370"], [.012, "#6f7f8a"], [.03, "#8d99a1"], [.2, "#a9b3b8"]]
    .forEach(([v, col]) => gr.addColorStop(clamp((v + .32) / .52, 0, 1), col));
  q.fillStyle = gr; q.fillRect(0, 0, TW, TH);
  /* a soft light along the upper flank, where the light from above rolls off the body */
  const hl = q.createLinearGradient(0, y(-.1), 0, y(0));
  hl.addColorStop(0, "rgba(255,255,255,0)"); hl.addColorStop(.55, "rgba(220,232,238,.16)"); hl.addColorStop(1, "rgba(255,255,255,0)");
  q.fillStyle = hl; q.fillRect(0, y(-.1), TW, y(0) - y(-.1));
  /* tiger bars: dark, slanted, fading towards the belly; blotches towards the tail */
  for (let u = .2; u < .84; u += .026 + rnd() * .01){
    const w = (.006 + rnd() * .004) * (1.15 - u * .4), sl = .012 + rnd() * .01;
    const g2 = q.createLinearGradient(0, y(-.13), 0, y(.03)); g2.addColorStop(0, "rgba(18,26,32,.62)"); g2.addColorStop(.7, "rgba(18,26,32,.42)"); g2.addColorStop(1, "rgba(18,26,32,0)");
    q.fillStyle = g2; q.beginPath();
    const a = PX(u, -.135), b = PX(u + w, -.135), cc = PX(u + w - sl, .03), d = PX(u - sl, .03);
    q.moveTo(a[0], a[1]); q.lineTo(b[0], b[1]); q.lineTo(cc[0], cc[1]); q.lineTo(d[0], d[1]); q.fill();
  }
  for (let k = 0; k < 26; k++){ const u = .05 + rnd() * .2, v = -.06 + rnd() * .08, [x0, y0] = PX(u, v);
    q.fillStyle = "rgba(18,26,32,.4)"; q.beginPath(); q.ellipse(x0, y0, (.004 + rnd() * .006) * SC, (.003 + rnd() * .004) * SC, rnd() * 3, 0, 7); q.fill(); }
  /* the tail and the dorsal fins a little darker at their tips */
  const tg = q.createLinearGradient(PX(.16, 0)[0], 0, PX(0, 0)[0], 0); tg.addColorStop(0, "rgba(14,20,25,0)"); tg.addColorStop(1, "rgba(14,20,25,.45)");
  q.fillStyle = tg; q.fillRect(0, 0, PX(.16, 0)[0], TH);
  /* the belly: a white underside with a wavy line, as on a real shark */
  q.beginPath(); { const [sx, sy] = PX(-.05, .4); q.moveTo(sx, sy); }
  for (let u = -.05; u <= 1.06; u += .01){
    const v = .03 + .009 * Math.sin(u * 23) + .004 * Math.sin(u * 61) + (u > .8 ? (u - .8) * .045 : 0) - (u < .2 ? (.2 - u) * .02 : 0);
    const [x0, y0] = PX(u, v); q.lineTo(x0, y0); }
  { const [ex, ey] = PX(1.06, .4); q.lineTo(ex, ey); } q.closePath();
  const bg = q.createLinearGradient(0, y(.03), 0, y(.12)); bg.addColorStop(0, "#dfe5e7"); bg.addColorStop(1, "#f6f7f5");
  q.fillStyle = bg; q.fill();
  /* the fins below: grey on top, darker at the leading edge */
  const fin = (pts, col) => { q.fillStyle = col; q.beginPath(); pts.forEach(([u, v], i) => { const [x0, y0] = PX(u, v); i ? q.lineTo(x0, y0) : q.moveTo(x0, y0); }); q.closePath(); q.fill(); };
  fin([[.70, .102], [.665, .106], [.62, .190], [.575, .262], [.59, .272], [.64, .232], [.74, .112]], "rgba(64,79,89,.86)");
  fin([[.46, .093], [.435, .09], [.418, .135], [.43, .140], [.485, .098]], "rgba(84,98,107,.72)");
  fin([[.27, .06], [.255, .056], [.236, .100], [.248, .104], [.29, .064]], "rgba(84,98,107,.72)");
  fin([[.07, .0], [.055, .040], [.025, .135], [.012, .172], [.03, .168], [.085, .065], [.15, .02], [.15, .0]], "rgba(52,64,73,.88)");
  /* gill slits */
  q.strokeStyle = "rgba(20,28,34,.8)"; q.lineCap = "round";
  for (let k = 0; k < 5; k++){ const a = PX(.802 - k * .02, -.048 + k * .003), m = PX(.79 - k * .02, .004), b = PX(.796 - k * .02, .056 - k * .002);
    q.lineWidth = (.0045 - k * .0003) * SC; q.beginPath(); q.moveTo(a[0], a[1]); q.quadraticCurveTo(m[0], m[1], b[0], b[1]); q.stroke(); }
  /* the mouth, a little open, with small teeth */
  q.strokeStyle = "#141b20"; q.lineWidth = .006 * SC; q.beginPath();
  { const a = PX(.988, .036), b = PX(.945, .05), cc = PX(.893, .061); q.moveTo(a[0], a[1]); q.quadraticCurveTo(b[0], b[1], cc[0], cc[1]); q.stroke(); }
  q.fillStyle = "rgba(250,250,245,.9)";
  for (let u = .9; u < .975; u += .009){ const v = .036 + (.988 - u) / .095 * .025, [x0, y0] = PX(u, v); q.beginPath(); q.moveTo(x0 - 2, y0 + 1); q.lineTo(x0 + 2, y0 + 1); q.lineTo(x0, y0 + 5); q.fill(); }
  /* nostril and the open eye */
  { const [nx, ny] = PX(.975, .006); q.fillStyle = "#141b20"; q.beginPath(); q.ellipse(nx, ny, 4, 2, -.2, 0, 7); q.fill(); }
  { const [ex, ey] = PX(EYE[0], EYE[1]); q.fillStyle = "#06090b"; q.beginPath(); q.arc(ex, ey, .0105 * SC, 0, 7); q.fill();
    q.strokeStyle = "rgba(190,205,212,.55)"; q.lineWidth = .0024 * SC; q.beginPath(); q.arc(ex, ey, .0118 * SC, 0, 7); q.stroke(); }
  /* the skin: fine speckle */
  for (let k = 0; k < 2600; k++){ const u = rnd(), v = -.14 + rnd() * .2, [x0, y0] = PX(u, v); q.fillStyle = rnd() < .5 ? "rgba(0,0,0,.08)" : "rgba(255,255,255,.06)"; q.fillRect(x0, y0, 2, 2); }
  q.restore();
  PIC = c;
  /* per column of the body: where it starts and ends (for the drips) */
  const a = q.getImageData(0, 0, TW, TH).data; EXT = new Uint8Array(EXTW * 4);
  for (let i = 0; i < EXTW; i++){
    const x = Math.round(i / (EXTW - 1) * (TW - 1)); let top = -1, bot = -1;
    for (let yy = 0; yy < TH; yy++) if (a[(yy * TW + x) * 4 + 3] > 128){ top = yy; break; }
    for (let yy = TH - 1; yy >= 0; yy--) if (a[(yy * TW + x) * 4 + 3] > 128){ bot = yy; break; }
    const enc = (t, o) => { const hi = Math.floor(t * 255), lo = Math.floor((t * 255 - hi) * 255); EXT[i * 4 + o] = hi; EXT[i * 4 + o + 1] = lo; };
    if (top < 0){ EXT[i * 4] = 255; EXT[i * 4 + 1] = 0; EXT[i * 4 + 2] = 0; EXT[i * 4 + 3] = 0; }
    else { enc(top / (TH - 1), 0); enc(bot / (TH - 1), 2); }
  }
}

/* ==========================================================================
   2. WEBGL — every line is drawn by one shader, so even the densest
