<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shark in Lines — Living Art Museum</title>
<meta name="description" content="A tiger shark drawn only in lines, in a three-bay tank: lines that lift into a body, slits that shimmer, tapered strokes, sonar rings. Run your finger through them; the living shark turns away, the dying one sinks, the kept one does not move. An experience from the Living Art Museum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--serif:Fraunces,"Noto Serif KR",Georgia,serif;}
html[lang="ko"]{--serif:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;}
/* ==========================================================================
   SHARK IN LINES — after Hirst's shark (1991).
   No picture of a shark anywhere: only lines. A field of parallel lines lifts
   where the body is, thickens, breaks into dashes as it dies, turns the green
   of formaldehyde when it is kept. Four ways of drawing it — contour lines,
   barrier slits, tapered strokes, sonar rings — and your finger runs through
   them like through threads. The shark's outline is drawn here from scratch.
   ========================================================================== */
:root{
  --ink:#f3f4f6; --ink-dim:rgba(243,244,246,.68); --ink-faint:rgba(243,244,246,.42);
  --glass-a:rgba(255,255,255,.12); --glass-b:rgba(255,255,255,.05); --glass-line:rgba(255,255,255,.15);
  --chip-on:rgba(255,255,255,.92); --chip-on-ink:#0b0c10; --accent:#2ec4b6;
}
body.paper{ --ink:#16171b; --ink-dim:rgba(22,23,27,.66); --ink-faint:rgba(22,23,27,.45);
  --glass-a:rgba(255,255,255,.72); --glass-b:rgba(255,255,255,.5); --glass-line:rgba(0,0,0,.1); --chip-on:#16171b; --chip-on-ink:#fff; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#07080c;color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}
.glass{background:linear-gradient(180deg,var(--glass-a),var(--glass-b));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-line);box-shadow:0 24px 60px -30px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1);}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;}

.top{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:20px;z-index:10;display:flex;align-items:center;gap:14px;pointer-events:none;}
.top > *{pointer-events:auto;}
.logo{font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1;white-space:nowrap;text-decoration:none;color:var(--ink);}
.title{margin-left:auto;text-align:right;max-width:46vw;}
.title h1{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25;}
.title p{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
body.embedded .top{display:none;}

/* the plaque, above the tank on the left */
#plaque{position:fixed;z-index:6;font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#plaque b{color:var(--ink);font-weight:500;letter-spacing:.1em;}
html[lang="ko"] #plaque{letter-spacing:.04em;}
html[lang="ko"] #plaque b{letter-spacing:.02em;}

#bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:4px;padding:6px;border-radius:20px;max-width:calc(100% - 20px);}
.grp{display:flex;gap:2px;}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--glass-line);}
.chip{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:14px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;transition:background .2s,color .2s;}
.chip svg{width:18px;height:18px;flex:none;}
.chip:hover{color:var(--ink);background:rgba(127,127,127,.12);}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);}
.chip.ic{padding:9px 10px;}
.st i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8;}
#snd[aria-pressed="true"]{background:none;color:var(--ink-dim);}
#snd[aria-pressed="false"] .on, #snd[aria-pressed="true"] .off{display:none;}
#hint{position:fixed;left:50%;top:var(--hint-y,90px);transform:translate(-50%,-50%);z-index:11;padding:9px 15px;border-radius:999px;font-size:12.5px;color:var(--ink);white-space:nowrap;pointer-events:none;transition:opacity .5s;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;}
#hint.off{opacity:0;}
#about{position:fixed;right:20px;top:calc(76px + env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 170px);overflow:auto;z-index:20;border-radius:22px;padding:20px 20px 18px;display:none;}
body.about #about{display:block;}
#about .tag{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
#about h2{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25;margin-top:8px;padding-right:24px;}
#about p{font-size:12.5px;line-height:1.65;color:var(--ink-dim);margin-top:9px;}
#about h3{font-size:12px;font-weight:600;margin-top:16px;padding-top:14px;border-top:1px solid var(--glass-line);}
#about ol{margin:8px 0 0 18px;font-size:12.5px;line-height:1.6;color:var(--ink-dim);}
#about .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim);}
#about .x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;}
.ico{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
html[lang="ko"] #about .tag{letter-spacing:.04em;}

@media (max-width:760px){
  #bar{flex-wrap:wrap;justify-content:center;gap:2px;padding:5px;width:calc(100% - 16px);bottom:calc(10px + env(safe-area-inset-bottom,0px));}
  .sep{display:none;}
  .chip{padding:8px 9px;font-size:11.5px;gap:5px;} .chip .lb{display:none;} .st .lb{display:inline;}
  #about{left:10px;right:10px;width:auto;top:calc(64px + env(safe-area-inset-top,0px));}
  #plaque{font-size:9.5px;max-width:calc(100% - 24px);}
  .title p{display:none;} .title h1{font-size:13px;}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<header class="top">
  <a class="logo" href="#" onclick="return false">Living Art Museum</a>
  <div class="title"><h1 id="t-h"></h1><p id="t-p"></p></div>
</header>
<div id="plaque"></div>
<div id="hint" class="glass off"></div>

<nav id="bar" class="glass">
  <div class="grp" id="styles" role="group"></div>
  <span class="sep"></span>
  <div class="grp" id="states" role="group"></div>
  <span class="sep"></span>
  <button class="chip ic" id="snd" aria-pressed="true"><svg class="ico on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg><svg class="ico off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
  <button class="chip ic" id="info"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</nav>

<section id="about" class="glass" aria-labelledby="ab-h">
  <button class="x" id="about-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="tag" id="ab-tag"></div>
  <h2 id="ab-h"></h2>
  <p id="ab-p1"></p>
  <p id="ab-p2"></p>
  <h3 id="ab-h3"></h3>
  <ol id="ab-ol"></ol>
</section>

<script>
"use strict";
/* ==========================================================================
   0. BASICS
   ========================================================================== */
const LANG = (() => {
  let l = (document.documentElement.lang || "en").slice(0, 2);
  try { const q = new URLSearchParams(location.search).get("lang"); if (q) l = q; } catch (_){}
  return l === "ko" ? "ko" : "en";
})();
document.documentElement.lang = LANG;
const T = (o) => (o && (o[LANG] ?? o.en)) || "";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const hex = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a ?? 1})`;
if (LANG === "ko") document.title = "선으로 그린 상어 — Living Art Museum";

/* ==========================================================================
   1. THE SHARK — an outline drawn here (a tiger shark, side on, mouth a
      little open), turned once into a soft "depth" field the lines read from
   ========================================================================== */
/* u runs tail (0) to nose (1); v is down (+) / up (−), in body lengths */
const SHARK = [
  [1.00, .020], [.975, -.030], [.93, -.062], [.86, -.088], [.76, -.108], [.665, -.118],
  [.615, -.205], [.585, -.285], [.565, -.312], [.548, -.300], [.545, -.200], [.53, -.118],
  [.43, -.098], [.335, -.078], [.312, -.112], [.296, -.128], [.285, -.075],
  [.21, -.052], [.145, -.036], [.11, -.058], [.06, -.150], [.025, -.262], [.008, -.300], [.002, -.288], [.03, -.150], [.062, -.020],
  [.055, .040], [.025, .135], [.012, .172], [.03, .168], [.085, .065], [.14, .033],
  [.22, .046], [.255, .052], [.236, .100], [.248, .104], [.29, .062],
  [.38, .075], [.435, .086], [.418, .135], [.43, .140], [.485, .096],
  [.585, .102], [.665, .104], [.62, .190], [.575, .262], [.59, .272], [.64, .232], [.74, .112],
  [.82, .102], [.875, .090], [.94, .072], [.955, .068], [.90, .055], [.985, .040],
];
const MU0 = -.04, MU1 = 1.04, MV = .36, MW = 540, MH = 360;
let DEPTH = null, SOFT = null;
function buildShark(){
  const c = document.createElement("canvas"); c.width = MW; c.height = MH; const q = c.getContext("2d");
  const P = (u, v) => [(u - MU0) / (MU1 - MU0) * MW, (v + MV) / (2 * MV) * MH];
  q.fillStyle = "#fff"; q.beginPath();
  /* smooth the outline: quadratic curves through the midpoints */
  const pts = SHARK.map(([u, v]) => P(u, v)), n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const m0 = mid(pts[n - 1], pts[0]); q.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++){ const a = pts[i], m = mid(a, pts[(i + 1) % n]); q.quadraticCurveTo(a[0], a[1], m[0], m[1]); }
  q.closePath(); q.fill();
  q.globalCompositeOperation = "destination-out";
  const [ex, ey] = P(.905, -.018); q.beginPath(); q.arc(ex, ey, 4.2, 0, 7); q.fill();
  q.lineWidth = 2.2; q.lineCap = "round";
  for (let k = 0; k < 5; k++){ const [x0, y0] = P(.80 - k * .022, -.05 + k * .002), [x1, y1] = P(.79 - k * .022, .06); q.beginPath(); q.moveTo(x0, y0); q.lineTo(x1, y1); q.stroke(); }
  const [m0x, m0y] = P(.985, .041), [m1x, m1y] = P(.905, .056); q.lineWidth = 3; q.beginPath(); q.moveTo(m0x, m0y); q.lineTo(m1x, m1y); q.stroke();
  const a = q.getImageData(0, 0, MW, MH).data, hard = new Float32Array(MW * MH);
  for (let i = 0; i < MW * MH; i++) hard[i] = a[i * 4 + 3] / 255;
  /* a rounded body: blur the outline a few times (box blurs, no ctx.filter) and keep it inside */
  const blur = (src, r, passes) => { const A = src.slice(), B = new Float32Array(src.length);
    for (let p = 0; p < passes; p++){
      for (let y = 0; y < MH; y++){ let s = 0; for (let x = -r; x <= r; x++) s += A[y * MW + clamp(x, 0, MW - 1)];
        for (let x = 0; x < MW; x++){ B[y * MW + x] = s / (2 * r + 1); s += A[y * MW + clamp(x + r + 1, 0, MW - 1)] - A[y * MW + clamp(x - r, 0, MW - 1)]; } }
      for (let x = 0; x < MW; x++){ let s = 0; for (let y = -r; y <= r; y++) s += B[clamp(y, 0, MH - 1) * MW + x];
        for (let y = 0; y < MH; y++){ A[y * MW + x] = s / (2 * r + 1); s += B[clamp(y + r + 1, 0, MH - 1) * MW + x] - B[clamp(y - r, 0, MH - 1) * MW + x]; } } }
    return A; };
  const b1 = blur(hard, 9, 3), b2 = blur(hard, 2, 2), b3 = blur(hard, 16, 3);
  DEPTH = new Float32Array(MW * MH);
  SOFT = new Float32Array(MW * MH);       /* a rounder, wider hill, for lines that lift without cliffs */
  for (let i = 0; i < MW * MH; i++){
    DEPTH[i] = clamp(Math.pow(clamp(b1[i] * 1.6 - .05, 0, 1), .8) * .75 + b2[i] * .25, 0, 1) * smooth(.15, .6, b2[i]);
    SOFT[i] = smooth(0, 1, clamp(b3[i] * 1.5, 0, 1)) * .7 + DEPTH[i] * .3; }
}
function sampleD(u, v, F){
  F = F || DEPTH;
  const fx = (u - MU0) / (MU1 - MU0) * (MW - 1), fy = (v + MV) / (2 * MV) * (MH - 1);
  if (fx < 0 || fy < 0 || fx >= MW - 1 || fy >= MH - 1) return 0;
  const x = fx | 0, y = fy | 0, tx = fx - x, ty = fy - y, i = y * MW + x;
  return lerp(lerp(F[i], F[i + 1], tx), lerp(F[i + MW], F[i + MW + 1], tx), ty);
}

/* ==========================================================================
   2. STATE — the tank, the shark, and the three states of the work
   ========================================================================== */
const cv = $("cv"), g = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, small = false;
const tank = { x:0, y:0, w:0, h:0 };
const SH = { x:0, y:0, len:100, ang:0, sx:1, dir:1, turning:false, phase:0, A:.05, tilt:0, vy:0, flee:0 };
const STYLES = ["lines", "slits", "taper", "rings"];
let style = "lines", state = "alive";
const MIXS = { alive:1, sink:0, kept:0 };       /* eased weights of the three states */
let decay = 0;                                   /* how far the dying has gone, 0..1 */
let t = 0;
const ptr = { x:-999, y:-999, in:false, down:false, energy:0, sonar:null };
const vib = new Map();                            /* line index -> { a: how hard it still rings, x: where it was struck } */

function layout(){
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; small = W <= 760;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const embedded = document.body.classList.contains("embedded");
  const barTop = $("bar").getBoundingClientRect().top || (H - 72);
  const topM = small ? (embedded ? 84 : 92) : (embedded ? 92 : 96), botM = (H - barTop) + (small ? 62 : 58);
  const availW = W - (small ? 24 : 80), availH = H - topM - botM;
  const asp = clamp(availW / availH, small ? .85 : 1.6, 2.6);
  let w = availW, h = w / asp; if (h > availH){ h = availH; w = h * asp; }
  tank.w = Math.round(w); tank.h = Math.round(h); tank.x = Math.round((W - w) / 2); tank.y = Math.round(topM + (availH - h) / 2);
  SH.len = Math.min(tank.w * (small ? .8 : .58), tank.h * 2.1);
  if (!SH.x){ SH.x = tank.x + tank.w * .45; SH.y = tank.y + tank.h * .48; }
  SH.x = clamp(SH.x, tank.x, tank.x + tank.w); SH.y = clamp(SH.y, tank.y, tank.y + tank.h);
  const pl = $("plaque"); pl.style.left = tank.x + "px"; pl.style.top = (tank.y - 26) + "px";
  document.documentElement.style.setProperty("--hint-y", (barTop - 28) + "px");
}

/* the shark's depth at a point on the screen; remembers where on the body it was (for the stripes) */
let lastU = 0, lastV = 0, lastSoft = 0;
function sway(u){ return SH.A * Math.sin(SH.phase - (1 - u) * 5.2) * Math.pow(1 - u, 1.7) + SH.A * .15 * Math.sin(SH.phase * .5 + 1.3) * (u - .5); }
function depthAt(px, py, soft){
  lastSoft = 0;
  if (Math.abs(SH.sx) < .04) return 0;
  const dx = px - SH.x, dy = py - SH.y, c = Math.cos(-SH.tilt), s = Math.sin(-SH.tilt), rx = dx * c - dy * s, ry = dx * s + dy * c;
  const u = .5 + rx / (SH.len * SH.sx), v0 = ry / SH.len;
  if (u < MU0 || u > MU1 || v0 < -MV || v0 > MV) return 0;
  const v = v0 - sway(u); lastU = u; lastV = v; lastSoft = soft ? sampleD(u, v, SOFT) : 0;
  return sampleD(u, v);
}
/* tiger stripes across the back — gaps in the lines, not paint */
const stripe = () => (lastV < .015 && lastU > .2 && lastU < .86 && Math.sin(lastU * 74 + Math.sin(lastV * 30) * 1.4) > .62) ? 1 : 0;

/* ==========================================================================
   3. COLOUR — vivid when alive, ash when dying, formaldehyde green when kept
   ========================================================================== */
const PAL_DARK = ["#ff4d6d", "#ffd23f", "#3a86ff", "#06d6a0", "#ffffff", "#ff8c42", "#b388ff"].map(hex);
const KEPT_DARK = ["#2ec4b6", "#7fded3", "#1b9aaa", "#c9f2ec", "#5ad8c6"].map(hex);
const ASH = hex("#7c818b");
const BG = { lines:hex("#07080c"), rings:hex("#050607"), slits:hex("#ecebe6"), taper:hex("#f3eee4") };
const INKP = { slits:hex("#14151a"), taper:hex("#14151a") };
const KEPT_PAPER = hex("#0d5c57");
const isPaper = () => style === "slits" || style === "taper";
function lineCol(i){
  const d = MIXS.sink, k = MIXS.kept;
  if (isPaper()){ const base = INKP[style]; return mix(mix(base, mix(base, ASH, .55), d), KEPT_PAPER, k); }
  const live = PAL_DARK[((i % 7) + 7) % 7], kept = KEPT_DARK[((i % 5) + 5) % 5];
  return mix(mix(live, mix(live, ASH, .75 * (.4 + .6 * decay)), d), kept, k);
}
function bgCol(){ const b = BG[style]; return isPaper() ? mix(b, hex("#dcefeb"), MIXS.kept * .8) : mix(b, hex("#021b1a"), MIXS.kept); }

/* ==========================================================================
   4. DRAWING — four ways to make a shark out of lines
   ========================================================================== */
function touch(x, y){            /* how far a line here is pushed away by the finger */
  if (!ptr.in || ptr.energy < .02) return 0;
  const dx = x - ptr.x, dy = y - ptr.y, R = Math.max(34, tank.h * .11);
  return Math.exp(-(dx * dx + dy * dy) / (R * R)) * ptr.energy;
}
const water = () => (1 - MIXS.kept) * (1 - .6 * MIXS.sink);
const dashFor = (w) => { const k = decay * MIXS.sink; if (k < .05) return []; return [Math.max(1.5, 9 - k * 7), 1 + k * 9 * (w || 1)]; };
const ring = (i, along, spread) => { const v = vib.get(i); if (!v) return 0; return v.a * Math.exp(-Math.pow((along - v.x) / spread, 2)); };

/* (1) contour lines, lifted into a body — each line hides the ones behind it */
const linesN = () => Math.max(26, Math.round(tank.h / (small ? 7 : 8.5)));
function drawLines(){
  const N = linesN(), gap = tank.h / N, relief = gap * 3.4, step = small ? 4 : 3.5, wv = water(), bg = bgCol();
  for (let i = 0; i <= N; i++){
    const y0 = tank.y + (i + .2) * gap, col = lineCol(i), pts = [], thick = [];
    for (let x = tank.x; x <= tank.x + tank.w + .1; x += step){
      const yw = y0 + Math.sin(x * .011 + t * .9 + i * .37) * 1.6 * wv;
      const d = depthAt(x, yw, true), st = d > .25 ? stripe() : 0;
      const yy = yw - lastSoft * relief + (yw < ptr.y ? -1 : 1) * touch(x, yw) * gap * 2.2 + ring(i, x, tank.w * .3) * Math.sin(x * .09 - t * 38) * 5;
      pts.push(x, yy); thick.push(d > .04 ? (st ? -1 : d) : 0);
    }
    /* hide what is behind: fill under the line with the water */
    g.fillStyle = rgba(bg); g.beginPath(); g.moveTo(pts[0], pts[1]);
    for (let k = 2; k < pts.length; k += 2) g.lineTo(pts[k], pts[k + 1]);
    g.lineTo(tank.x + tank.w, tank.y + tank.h + 2); g.lineTo(tank.x, tank.y + tank.h + 2); g.closePath(); g.fill();
    g.strokeStyle = rgba(col, .55 + .45 * (1 - MIXS.sink * decay * .6)); g.lineWidth = 1; g.setLineDash(dashFor(1));

/* ==========================================================================
   5. MOTION — alive it swims and turns away from you; dying it slows, rolls
      and sinks; kept it hangs in the middle and never moves again
   ========================================================================== */
function turnStep(dt, speed, toDir){

  if (state === "sink") decay = Math.min(1, decay + dt / 9); else if (state === "alive") decay = Math.max(0, decay - dt * .6);
  ptr.energy *= Math.exp(-dt * 2.2);

  const L = tank, cx = L.x + L.w / 2, cy = L.y + L.h / 2;

    SH.A = lerp(SH.A, .055 + SH.flee * .03, dt * 2);
    const spd = (L.w * (small ? .04 : .07)) * (1 + SH.flee * 1.6);

function render(){

function frame(now){ requestAnimationFrame(frame); const dt = Math.min(.05, (now - last) / 1000); last = now; step(reduce ? dt * .5 : dt); render(); }

/* ==========================================================================
   6. HANDS — run a finger through the lines: they part, and ring
   ========================================================================== */
const SCALE = [0, 2, 4, 7, 9];
function lineIndexAt(x, y){
  if (style === "lines") return Math.round((y - tank.y) / (tank.h / linesN()) - .2);
  if (style === "slits") return Math.round((x - tank.x - 2) / slitGap());
  if (style === "taper") return Math.round((x - tank.x - taperGap() / 2) / taperGap());

}

}

  const a = lineIndexAt(ax, ay), b = lineIndexAt(bx, by); if (a === b) return;

    const o = ctx.createOscillator(); o.frequency.value = 55; const og = ctx.createGain(); og.gain.value = 0; o.connect(og); og.connect(master);
    const lfo = ctx.createOscillator(); lfo.frequency.value = .13; const lg = ctx.createGain(); lg.gain.value = 120; lfo.connect(lg); lg.connect(f.frequency);

    amb.f.frequency.setTargetAtTime(state === "alive" ? 420 : state === "sink" ? 230 : 160, tt, .8);

    /* a line plucked: a soft string, pitched by which line, dulled as the shark dies */
    pluck(i){ if (!ok()) return; const now = performance.now(); if (now - plT > 1000){ plT = now; plucks = 0; } if (++plucks > 26) return;
      const tt = ctx.currentTime, deg = SCALE[((i % 5) + 5) % 5], oct = Math.floor((((i % 15) + 15) % 15) / 5), base = state === "kept" ? 220 : state === "sink" ? 185 : 262;

    sink(){ if (!ok()) return; const tt = ctx.currentTime; noise(tt, 1.8, 260, .6, .07, "lowpass"); const o = ctx.createOscillator(); o.frequency.setValueAtTime(140, tt); o.frequency.exponentialRampToValueAtTime(45, tt + 2);

/* the museum's logo is white on dark water and dark on paper */
function siteLight(on){ try { if (window.parent !== window){ const ex = window.parent.document.getElementById("s-exp"); if (ex) ex.classList.toggle("light", on); } } catch (_){} }
function plaque(){ $("plaque").innerHTML = `<b>${T({ en:"Tiger shark, glass, steel, formaldehyde", ko:"뱀상어 · 유리 · 강철 · 포름알데히드" })}</b> · ${T(STATE_UI[state])}`; }
let hintT = 0, hintAt = 0;
function hint(s, brief){ const h = $("hint"); h.textContent = s; h.classList.remove("off"); hintAt = performance.now(); clearTimeout(hintT); hintT = setTimeout(() => h.classList.add("off"), brief ? 3400 : 6500); }
function hideHint(){ if (performance.now() - hintAt > 1800) $("hint").classList.add("off"); }
function buildUI(){
  STYLES.forEach(s => { const b = document.createElement("button"); b.className = "chip"; b.dataset.s = s; b.setAttribute("aria-pressed", String(s === style));
    b.innerHTML = `<svg class="ico" viewBox="0 0 24 24">${STYLE_UI[s].ic}</svg><span class="lb">${T(STYLE_UI[s])}</span>`; b.title = T(STYLE_UI[s]); b.setAttribute("aria-label", T(STYLE_UI[s]));
    b.onclick = () => { AUD.unlock(); setStyle(s); }; $("styles").appendChild(b); });
  ["alive", "sink", "kept"].forEach(s => { const b = document.createElement("button"); b.className = "chip st"; b.dataset.s = s; b.setAttribute("aria-pressed", String(s === state));
    b.innerHTML = `<i></i><span class="lb">${T(STATE_UI[s])}</span>`; b.onclick = () => { AUD.unlock(); setState(s); }; $("states").appendChild(b); });
  $("styles").setAttribute("aria-label", T({ en:"How it is drawn", ko:"그리는 방식" }));
  $("states").setAttribute("aria-label", T({ en:"State of the shark", ko:"상어의 상태" }));
}
$("snd").onclick = () => { AUD.unlock(); AUD.on = !AUD.on; $("snd").setAttribute("aria-pressed", String(AUD.on)); };
$("info").onclick = () => document.body.classList.toggle("about");
$("about-x").onclick = () => document.body.classList.remove("about");
$("snd").setAttribute("aria-label", T({ en:"Sound", ko:"소리" })); $("info").setAttribute("aria-label", T({ en:"About the work", ko:"작품 설명" }));
$("about-x").setAttribute("aria-label", T({ en:"Close", ko:"닫기" }));
$("t-h").textContent = T({ en:"The Physical Impossibility of Death in the Mind of Someone Living", ko:"살아 있는 자의 마음속에 있는 죽음의 물리적 불가능성" });
$("t-p").textContent = T({ en:"Damien Hirst · 1991 · drawn only in lines", ko:"데미안 허스트 · 1991 · 선으로만 그린 상어" });
$("ab-tag").textContent = T({ en:"Damien Hirst · 1991", ko:"데미안 허스트 · 1991" });
$("ab-h").textContent = T({ en:"A shark you can't quite see die", ko:"죽는 모습을 끝내 볼 수 없는 상어" });
$("ab-p1").textContent = T({ en:"Hirst hung a 4.3-metre tiger shark in a three-part tank of formaldehyde — close enough to feel it could still bite. It began to rot, and in 2006 it was replaced with another shark. Is the work the idea, or the animal?",
  ko:"허스트는 4.3m 뱀상어를 세 칸짜리 포름알데히드 수조에 띄웠어요. 아직도 물 것처럼 가까이. 상어는 썩기 시작했고 2006년 다른 상어로 교체됐어요. 작품은 생각일까요, 그 동물일까요?" });
$("ab-p2").textContent = T({ en:"Here there is no shark at all — only lines that lift, thicken and break where a body would be. The outline is drawn from scratch; no photograph of the work is used in the tank.",
  ko:"여기엔 상어가 없어요. 몸이 있을 자리에서 선이 솟고, 굵어지고, 끊어질 뿐이에요. 윤곽은 새로 그렸고, 수조 안에 작품 사진은 쓰지 않았어요." });
$("ab-h3").textContent = T({ en:"Try", ko:"해 보기" });
[{ en:"Run your finger through the lines — they part, and ring like strings.", ko:"선 사이로 손가락을 지나가 보세요. 선이 갈라지며 현처럼 울려요." },
 { en:"Four ways to draw it: lines, slits (scanimation), tapered strokes, sonar.", ko:"네 가지 방식: 선, 슬릿(스캐니메이션), 테이퍼, 소나." },
 { en:"Alive, it turns away from you; dying, it greys and sinks; kept, it never moves again.", ko:"살아 있으면 당신을 피하고, 죽어 가면 잿빛으로 가라앉고, 박제되면 다시는 움직이지 않아요." }]
 .forEach(s => { const li = document.createElement("li"); li.textContent = T(s); $("ab-ol").appendChild(li); });

/* ==========================================================================
   9. START
   ========================================================================== */
buildShark(); buildUI(); layout(); plaque(); siteLight(false);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
window.addEventListener("resize", layout);
["pointerdown", "keydown", "touchstart"].forEach(ev => window.addEventListener(ev, () => AUD.unlock(), { capture:true, passive:true }));
window.addEventListener("pagehide", () => AUD.stop());
window.addEventListener("keydown", e => { const k = e.key; if (k >= "1" && k <= "4") setStyle(STYLES[+k - 1]);
  if (k === "a") setState("alive"); if (k === "s") setState("sink"); if (k === "k") setState("kept"); if (k === "Escape") document.body.classList.remove("about"); });
AUD.unlock(); setTimeout(() => AUD.unlock(), 150);
hint(T({ en:"Run your finger through the lines", ko:"선 사이로 손가락을 지나가 보세요" }));
requestAnimationFrame(frame);
window.__shark = { setStyle, setState, SH, tank, ptr, vib, get style(){ return style; }, get state(){ return state; },
  step:(n, dt) => { for (let i = 0; i < n; i++) step(dt || 1 / 60); render(); } };
</script>
</body>
</html>
