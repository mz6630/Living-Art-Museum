<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Notebook — Living Art Museum</title>
<meta name="description" content="A pixel desk after Jean-Michel Basquiat: open the composition notebook, peel stickers of crowns and skulls, cut up a magazine, glue, write and rub out. Every page is kept for the next visitor. An experience from the Living Art Museum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--serif:Fraunces,"Noto Serif KR",Georgia,serif;}
html[lang="ko"]{--serif:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;}
/* ==========================================================================
   NOTEBOOK — after Jean-Michel Basquiat (1960–1988), in dots.
   A desk you are allowed to make a mess of: a composition notebook that
   opens like a real one, a binder of stickers (crowns, skulls, ©, teeth,
   signs), a magazine to cut up, glue, an oilstick and an eraser.
   Every page of the notebook is shared: what anyone sticks or writes on a
   page stays there for the next visitor, like a guestbook.
   All the pictures here — stickers, magazine, desk — are drawn from
   scratch, dot by dot. None of Basquiat's works are reproduced.
   ========================================================================== */
:root{
  --bg:#24170f; --ink:#f4efe4; --ink-dim:rgba(244,239,228,.7); --ink-faint:rgba(244,239,228,.44);
  --yel:#f1bf2e; --red:#d6392b; --blue:#2d62b4;
  --ease:cubic-bezier(.22,.68,.24,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
:focus-visible{outline:2px solid var(--yel);outline-offset:3px;border-radius:8px;}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05));
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.15);box-shadow:0 24px 60px -30px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.1);}
#cv{position:fixed;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}
body.fine #cv{cursor:none;}

/* ---------- top bar (the site draws its own when this is embedded) ---------- */
.top{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:20px;z-index:10;display:flex;align-items:center;gap:14px;pointer-events:none;}
.top > *{pointer-events:auto;}
.logo{font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1;white-space:nowrap;text-decoration:none;color:var(--ink);}
.title{margin-left:auto;text-align:right;max-width:44vw;}
.title h1{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25;}
.title p{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
body.embedded .top{display:none;}

/* ---------- the tool bar ---------- */
#bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:4px;padding:6px;border-radius:20px;max-width:calc(100% - 20px);}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:rgba(255,255,255,.14);}
.tool{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;color:var(--ink-dim);}
.tool img{width:32px;height:32px;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none;}
.tool:hover{background:rgba(255,255,255,.09);}
.tool[aria-pressed="true"]{background:rgba(255,255,255,.88);}
.tool .k{position:absolute;right:3px;bottom:2px;font-family:"JetBrains Mono",monospace;font-size:8.5px;color:rgba(0,0,0,.4);display:none;}
body.fine .tool[aria-pressed="true"] .k{display:block;}
#inks{display:none;align-items:center;gap:4px;padding:0 4px;}
body.t-crayon #inks{display:flex;}
.ink{width:22px;height:22px;border-radius:7px;border:2px solid rgba(255,255,255,.18);}
.ink[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);}
.sz{height:30px;min-width:30px;padding:0 7px;border-radius:9px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-dim);}
.sz[aria-pressed="true"]{background:rgba(255,255,255,.16);color:var(--ink);}
#nav{display:flex;align-items:center;gap:2px;}
#nav button{width:34px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-dim);}
#nav button:hover{background:rgba(255,255,255,.09);color:var(--ink);}
#nav button:disabled{opacity:.3;cursor:default;background:none;}
#nav svg,.chip svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
#pg{min-width:66px;text-align:center;font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:11.5px;color:var(--ink);line-height:1.2;}
#pg small{display:block;font-size:9.5px;color:var(--ink-faint);letter-spacing:.06em;}
.chip{display:grid;place-items:center;width:38px;height:40px;border-radius:12px;color:var(--ink-dim);}
.chip:hover{background:rgba(255,255,255,.09);color:var(--ink);}
#snd[aria-pressed="false"] .on, #snd[aria-pressed="true"] .off{display:none;}

/* ---------- hint, toast, about ---------- */
#hint{position:fixed;left:50%;top:var(--hint-y,90px);transform:translate(-50%,-50%);z-index:11;padding:9px 15px;border-radius:999px;font-size:12.5px;color:var(--ink);white-space:nowrap;pointer-events:none;transition:opacity .4s;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;}
#hint.off{opacity:0;}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:13;padding:9px 15px;border-radius:14px;font-size:12.5px;line-height:1.4;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .3s, transform .3s var(--ease);max-width:calc(100% - 24px);text-align:center;}
#toast.on{opacity:1;transform:translate(-50%,0);}
#about{position:fixed;right:20px;top:calc(76px + env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 170px);overflow:auto;z-index:20;border-radius:22px;padding:20px 20px 18px;display:none;}
body.about #about{display:block;}
#about .tag{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
#about h2{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25;margin-top:8px;padding-right:24px;}
#about p{font-size:12.5px;line-height:1.65;color:var(--ink-dim);margin-top:9px;}
#about h3{font-size:12px;font-weight:600;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);}
#about ol{margin:8px 0 0 18px;font-size:12.5px;line-height:1.6;color:var(--ink-dim);}
#about .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim);}
#about .x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;}
#about .store{margin-top:12px;font-size:11.5px;color:var(--ink-faint);}

/* the keyboard's way in: an invisible text box that sits on the caret */
#ime{position:fixed;left:0;top:0;width:2px;height:20px;opacity:0;font-size:16px;border:0;padding:0;resize:none;background:transparent;color:transparent;caret-color:transparent;z-index:1;}

@media (max-width:760px){
  #bar{gap:1px;padding:5px;border-radius:18px;bottom:calc(10px + env(safe-area-inset-bottom,0px));flex-wrap:wrap;justify-content:center;width:calc(100% - 16px);}
  .tool{width:40px;height:40px;} .tool img{width:28px;height:28px;}
  .sep{display:none;}
  #inks{order:5;width:100%;justify-content:center;padding:2px 0 0;}
  #about{left:10px;right:10px;width:auto;top:calc(64px + env(safe-area-inset-top,0px));}
  #toast{bottom:calc(120px + env(safe-area-inset-bottom,0px));}
}
html[lang="ko"] #about .tag{letter-spacing:.04em;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important;} }
</style>
</head>
<body>
<canvas id="cv" aria-label=""></canvas>

<header class="top">
  <a class="logo" href="#" onclick="return false">Living Art Museum</a>
  <div class="title"><h1 id="t-h"></h1><p id="t-p"></p></div>
</header>

<div id="hint" class="glass off"></div>
<div id="toast" class="glass" role="status" aria-live="polite"></div>
<textarea id="ime" maxlength="240" autocomplete="off" autocapitalize="off" spellcheck="false" aria-hidden="true" tabindex="-1"></textarea>

<nav id="bar" class="glass">
  <div id="tools" style="display:flex;gap:2px"></div>
  <div id="inks"></div>
  <span class="sep"></span>
  <div id="nav">
    <button id="pv" aria-label=""><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="pg"></div>
    <button id="nx" aria-label=""><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <span class="sep"></span>
  <button class="chip" id="snd" aria-pressed="true" aria-label=""><svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg><svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
  <button class="chip" id="info" aria-label=""><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</nav>

<section id="about" class="glass" aria-labelledby="ab-h">
  <button class="x" id="about-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="tag" id="ab-tag"></div>
  <h2 id="ab-h"></h2>
  <p id="ab-p1"></p>
  <p id="ab-p2"></p>
  <h3 id="ab-h3"></h3>
  <ol id="ab-ol"></ol>
  <p class="store" id="ab-store"></p>
</section>

<script>
"use strict";
/* ==========================================================================
   0. BASICS
   ========================================================================== */
const LANG = (document.documentElement.lang || "en").toLowerCase().startsWith("ko") ? "ko" : "en";
const T = (o) => (o && (o[LANG] ?? o.en)) || "";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hstr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
/* a colour as one 32-bit pixel (little-endian RGBA) */
const C = (hex, al) => { const n = parseInt(hex.slice(1), 16); return ((Math.round((al ?? 1) * 255) << 24) | ((n & 255) << 16) | (((n >> 8) & 255) << 8) | ((n >> 16) & 255)) >>> 0; };
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
/* smooth value noise, for wood, marble and paper */
function vh(x, y, s){ let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 2147483647); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y, s){ const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return lerp(lerp(vh(i, j, s), vh(i + 1, j, s), u), lerp(vh(i, j + 1, s), vh(i + 1, j + 1, s), u), v); }
function fbm(x, y, s){ return vnoise(x, y, s) * .55 + vnoise(x * 2.1, y * 2.1, s + 7) * .3 + vnoise(x * 4.3, y * 4.3, s + 13) * .15; }

/* the palette: the desk, the paper, and the colours he reached for */
const P = {
  k:C("#17130f"), k2:C("#3a332c"), w:C("#f7f3ea"), cr:C("#efe7d2"), lg:C("#d6d0c3"), gr:C("#9b958a"), dg:C("#5d5850"),
  y:C("#f1bf2e"), y2:C("#c48e1a"), r:C("#d6392b"), r2:C("#93271d"), b:C("#2d62b4"), b2:C("#1d3f7a"), sky:C("#8fb8e0"),
  g:C("#3f8a4a"), g2:C("#2a5e33"), o:C("#ec7a2a"), pk:C("#ec9aa6"), n:C("#7a5134"), n2:C("#4e3220"), sk:C("#c98b5e"),
};

/* ==========================================================================
   1. A TINY PIXEL CANVAS — everything here is drawn a dot at a time
   ========================================================================== */
class PX {
  constructor(w, h){ this.w = w; this.h = h; this.a = new Uint32Array(w * h); }
  clear(){ this.a.fill(0); return this; }
  set(x, y, c){ x = Math.floor(x); y = Math.floor(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; this.a[y * this.w + x] = c; }
  get(x, y){ x = Math.floor(x); y = Math.floor(y); return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? 0 : this.a[y * this.w + x]; }
  rect(x, y, w, h, c){ for (let j = Math.floor(y); j < y + h; j++) for (let i = Math.floor(x); i < x + w; i++) this.set(i, j, c); return this; }
  box(x, y, w, h, c){ this.rect(x, y, w, 1, c); this.rect(x, y + h - 1, w, 1, c); this.rect(x, y, 1, h, c); this.rect(x + w - 1, y, 1, h, c); return this; }
  dot(x, y, c, th){ if (!th || th <= 1){ this.set(x, y, c); return; } const o = Math.floor((th - 1) / 2); for (let j = 0; j < th; j++) for (let i = 0; i < th; i++) this.set(x - o + i, y - o + j, c); }
  line(x0, y0, x1, y1, c, th){ x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1; let e = dx + dy;
    for (let n = 0; n < 5000; n++){ this.dot(x0, y0, c, th); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy){ e += dy; x0 += sx; } if (e2 <= dx){ e += dx; y0 += sy; } }
    return this; }
  /* a line drawn by hand: it wanders a little */
  wline(x0, y0, x1, y1, c, th, R, j){ j = j ?? .6; const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / 4)); let px = x0, py = y0;
    for (let k = 1; k <= n; k++){ const t = k / n, x = x0 + (x1 - x0) * t + (k < n ? (R() - .5) * 2 * j : 0), y = y0 + (y1 - y0) * t + (k < n ? (R() - .5) * 2 * j : 0); this.line(px, py, x, y, c, th); px = x; py = y; }
    return this; }
  path(pts, c, th, R, j, close){ for (let i = 0; i < pts.length - (close ? 0 : 1); i++){ const a = pts[i], b = pts[(i + 1) % pts.length]; if (R) this.wline(a[0], a[1], b[0], b[1], c, th, R, j); else this.line(a[0], a[1], b[0], b[1], c, th); } return this; }
  poly(pts, c){ let y0 = Infinity, y1 = -Infinity; for (const p of pts){ y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    for (let y = Math.floor(y0); y <= Math.ceil(y1); y++){ const yc = y + .5, xs = [];
      for (let i = 0; i < pts.length; i++){ const a = pts[i], b = pts[(i + 1) % pts.length]; if ((a[1] <= yc) !== (b[1] <= yc)) xs.push(a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0])); }
      xs.sort((p, q) => p - q);
      for (let k = 0; k + 1 < xs.length; k += 2) for (let x = Math.ceil(xs[k] - .5); x + .5 < xs[k + 1]; x++) this.set(x, y, c); }
    return this; }
  ell(cx, cy, rx, ry, c){ for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++){ const u = (x + .5 - cx) / rx, v = (y + .5 - cy) / ry; if (u * u + v * v <= 1) this.set(x, y, c); } return this; }
  disc(cx, cy, r, c){ return this.ell(cx, cy, r, r, c); }
  ring(cx, cy, rx, ry, th, c){ for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++){
      const u = (x + .5 - cx), v = (y + .5 - cy), o = (u / rx) ** 2 + (v / ry) ** 2, i = (u / Math.max(.1, rx - th)) ** 2 + (v / Math.max(.1, ry - th)) ** 2;
      if (o <= 1 && i > 1) this.set(x, y, c); } return this; }
  flood(x, y, c){ const t = this.get(x, y); if (t === c) return this; const st = [x, y];
    while (st.length){ const j = st.pop(), i = st.pop(); if (i < 0 || j < 0 || i >= this.w || j >= this.h || this.a[j * this.w + i] !== t) continue; this.a[j * this.w + i] = c; st.push(i + 1, j, i - 1, j, i, j + 1, i, j - 1); }
    return this; }
  /* ordered dither: density f (0..1, or a function of x, y) of colour c */
  dith(x, y, w, h, c, f){ for (let j = Math.floor(y); j < y + h; j++) for (let i = Math.floor(x); i < x + w; i++){ const d = typeof f === "function" ? f(i, j) : f; if (d * 16 > BAY[(j & 3) * 4 + (i & 3)] + .5) this.set(i, j, c); } return this; }
  /* a ring of colour round everything already drawn (8-way) */
  outline(c, n){ for (let k = 0; k < (n || 1); k++){ const b = this.a.slice(), W = this.w;
      for (let y = 0; y < this.h; y++) for (let x = 0; x < W; x++){ if (b[y * W + x]) continue;
        let hit = false; for (let dy = -1; dy <= 1 && !hit; dy++) for (let dx = -1; dx <= 1; dx++){ const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < W && Y < this.h && b[Y * W + X]){ hit = true; break; } }
        if (hit) this.a[y * W + x] = c; } }
    return this; }
  /* swap one colour for another (to recolour a template) */
  swap(from, to){ for (let i = 0; i < this.a.length; i++) if (this.a[i] === from) this.a[i] = to; return this; }
  text(s, x, y, c, z){ return drawStr(this, s, x, y, c, z || 1, null); }
  canvas(cv){ cv = cv || document.createElement("canvas"); if (cv.width !== this.w || cv.height !== this.h){ cv.width = this.w; cv.height = this.h; }
    const g = cv.getContext("2d"), id = g.createImageData(this.w, this.h); new Uint32Array(id.data.buffer).set(this.a); g.putImageData(id, 0, 0); return cv; }
}

/* ==========================================================================
   2. LETTERS — his capitals, five dots wide; Hangul is rasterised and
      snapped to dots so it sits in the same hand
   ========================================================================== */
const F5 = {
  A:[14,17,17,31,17,17,17], B:[30,17,17,30,17,17,30], C:[14,17,16,16,16,17,14], D:[30,17,17,17,17,17,30], E:[31,16,16,30,16,16,31],
  F:[31,16,16,30,16,16,16], G:[14,17,16,23,17,17,15], H:[17,17,17,31,17,17,17], I:[14,4,4,4,4,4,14], J:[7,2,2,2,2,18,12],
  K:[17,18,20,24,20,18,17], L:[16,16,16,16,16,16,31], M:[17,27,21,21,17,17,17], N:[17,17,25,21,19,17,17], O:[14,17,17,17,17,17,14],
  P:[30,17,17,30,16,16,16], Q:[14,17,17,17,21,18,13], R:[30,17,17,30,20,18,17], S:[15,16,16,14,1,1,30], T:[31,4,4,4,4,4,4],
  U:[17,17,17,17,17,17,14], V:[17,17,17,17,17,10,4], W:[17,17,17,21,21,21,10], X:[17,17,10,4,10,17,17], Y:[17,17,17,10,4,4,4], Z:[31,1,2,4,8,16,31],

/* ==========================================================================

/* ==========================================================================
