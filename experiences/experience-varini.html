<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Point of View — Living Art Museum</title>
<meta name="description" content="Three little spaces on a turntable, painted with broken fragments of colour. Turn them all the way round: from one angle only, the fragments join into a perfect flat shape. After Felice Varini's anamorphic paintings, from the Living Art Museum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--serif:Fraunces,"Noto Serif KR",Georgia,serif;}
html[lang="ko"]{--serif:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;}
/* ==========================================================================
   POINT OF VIEW — after Felice Varini's paintings on architecture.
   Each space sits on a small base, like a model on a turntable. Its walls,
   floor, columns and stairs carry pieces of paint. Turn it — all the way
   round, higher, lower — until, from one angle, the pieces close into a
   single flat shape.
   ========================================================================== */
:root{
  --ink:#141414; --ink-dim:rgba(20,20,20,.64); --ink-faint:rgba(20,20,20,.42);
  --glass-a:rgba(255,255,255,.78); --glass-b:rgba(255,255,255,.58); --glass-line:rgba(0,0,0,.08);
  --chip-on:#141414; --chip-on-ink:#fff; --accent:#e2231a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#a9b6b2;color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}
.glass{background:linear-gradient(180deg,var(--glass-a),var(--glass-b));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-line);box-shadow:0 18px 50px -24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.7);}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
body.turning #gl{cursor:grabbing;}

.top{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:20px;z-index:10;display:flex;align-items:center;gap:14px;pointer-events:none;}
.top > *{pointer-events:auto;}
.logo{font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1;white-space:nowrap;text-decoration:none;color:var(--ink);}
.title{margin-left:auto;text-align:right;max-width:46vw;}
.title h1{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25;}
.title p{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
body.embedded .top{display:none;}

/* how close you are */
#meter{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:11;display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;font-size:12.5px;white-space:nowrap;}
body.embedded #meter{top:calc(70px + env(safe-area-inset-top,0px));}
#meter .bar{width:110px;height:6px;border-radius:3px;background:rgba(0,0,0,.08);overflow:hidden;}
#meter .fill{height:100%;width:0;border-radius:3px;background:var(--accent);transition:width .25s;}
#meter .pct{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-dim);min-width:34px;text-align:right;}
#meter .word{color:var(--ink-dim);}
#meter .dir{display:none;font-weight:600;color:var(--ink);}
body.clue #meter .dir{display:inline;}

#bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:4px;padding:6px;border-radius:20px;max-width:calc(100% - 20px);}
.chip{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:14px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;transition:background .2s,color .2s;}
.chip svg{width:18px;height:18px;flex:none;}
.chip:hover{color:var(--ink);background:rgba(0,0,0,.05);}
.chip[aria-pressed="true"],.chip.hot{background:var(--chip-on);color:var(--chip-on-ink);}
.chip.ic{padding:9px 10px;}
.chip .sw{width:12px;height:12px;border-radius:50%;flex:none;}
.chip.done::after{content:"✓";font-size:11px;margin-left:-2px;}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--glass-line);}
#snd[aria-pressed="false"] .on, #snd[aria-pressed="true"] .off{display:none;}
.ico{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
#hint{position:fixed;left:50%;top:var(--hint-y,90px);transform:translate(-50%,-50%);z-index:11;padding:9px 15px;border-radius:999px;font-size:12.5px;color:var(--ink);white-space:nowrap;pointer-events:none;transition:opacity .5s;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;}
#hint.off{opacity:0;}

/* found it */
#win{position:fixed;left:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;width:min(360px,calc(100% - 24px));border-radius:22px;padding:18px 18px 14px;display:none;}
body.won #win{display:block;animation:rise .45s ease-out;}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
#win .k{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);}
#win h2{font-family:var(--serif);font-size:20px;font-weight:600;margin-top:6px;}
#win p{font-size:12.5px;line-height:1.6;color:var(--ink-dim);margin-top:6px;}
#win .row{display:flex;gap:6px;margin-top:12px;}
#win .row .chip{flex:1;justify-content:center;border:1px solid var(--glass-line);}
html[lang="ko"] #win .k{letter-spacing:.04em;}

#about{position:fixed;right:20px;top:calc(76px + env(safe-area-inset-top,0px));width:350px;max-height:calc(100% - 170px);overflow:auto;z-index:21;border-radius:22px;padding:20px 20px 18px;display:none;}
body.about #about{display:block;}
#about .tag{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
#about h2{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25;margin-top:8px;padding-right:24px;}
#about p{font-size:12.5px;line-height:1.65;color:var(--ink-dim);margin-top:9px;}
#about h3{font-size:12px;font-weight:600;margin-top:16px;padding-top:14px;border-top:1px solid var(--glass-line);}
#about ol{margin:8px 0 0 18px;font-size:12.5px;line-height:1.6;color:var(--ink-dim);}
#about .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim);}
#about .x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;}
html[lang="ko"] #about .tag{letter-spacing:.04em;}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 80% 70% at 50% 46%, rgba(255,255,255,.14), rgba(255,255,255,0) 55%, rgba(30,40,38,.22) 100%);}
#nogl{position:fixed;inset:0;display:none;place-items:center;padding:30px;text-align:center;font-size:14px;color:var(--ink-dim);}
@media (max-width:760px){
  .chip{padding:8px 10px;font-size:11.5px;gap:5px;} #bar .chip .lb{display:none;}
  #hint{white-space:normal;text-align:center;border-radius:18px;width:max-content;line-height:1.45;}
  #about{left:10px;right:10px;width:auto;top:calc(64px + env(safe-area-inset-top,0px));}
  #win{left:12px;right:12px;width:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));}
  .title p{display:none;} .title h1{font-size:13px;} .title{max-width:38vw;}
  #meter{top:calc(58px + env(safe-area-inset-top,0px));} #meter .bar{width:64px;} #meter .word{display:none;}
  body.embedded #meter{top:calc(64px + env(safe-area-inset-top,0px));}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important;} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="nogl"></div>

<header class="top">
  <a class="logo" href="#" onclick="return false">Living Art Museum</a>
  <div class="title"><h1 id="t-h"></h1><p id="t-p"></p></div>
</header>
<div id="meter" class="glass"><span class="word" id="m-w"></span><span class="bar"><span class="fill" id="m-f"></span></span><span class="pct" id="m-p">0%</span><span class="dir" id="m-d"></span></div>
<div id="hint" class="glass off"></div>

<nav id="bar" class="glass">
  <button class="chip" data-s="0"><span class="sw" style="background:#e2231a"></span><span class="lb"></span></button>
  <button class="chip" data-s="1"><span class="sw" style="background:#f5c400"></span><span class="lb"></span></button>
  <button class="chip" data-s="2"><span class="sw" style="background:#ff6a13"></span><span class="lb"></span></button>
  <span class="sep"></span>
  <button class="chip ic" id="clue" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></button>
  <button class="chip ic" id="snd" aria-pressed="true"><svg class="ico on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg><svg class="ico off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
  <button class="chip ic" id="info"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</nav>

<section id="win" class="glass" aria-live="polite">
  <div class="k" id="w-k"></div>
  <h2 id="w-h"></h2>
  <p id="w-p"></p>
  <div class="row"><button class="chip" id="w-stay"></button><button class="chip hot" id="w-next"></button></div>
</section>

<section id="about" class="glass" aria-labelledby="ab-h">
  <button class="x" id="about-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="tag" id="ab-tag"></div>
  <h2 id="ab-h"></h2>
  <p id="ab-p1"></p>
  <p id="ab-p2"></p>
  <h3 id="ab-h3"></h3>
  <ol id="ab-ol"></ol>
</section>

<script>
"use strict";
/* ==========================================================================
   0. BASICS
   ========================================================================== */
const LANG = (() => {
  let l = (document.documentElement.lang || "en").slice(0, 2);
  try { const q = new URLSearchParams(location.search).get("lang"); if (q) l = q; } catch (_){}
  return l === "ko" ? "ko" : "en";
})();
document.documentElement.lang = LANG;
if (LANG === "ko") document.title = "착시 회화 연작 — Living Art Museum";
const T = (o) => (o && (o[LANG] ?? o.en)) || "";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = (a) => Math.hypot(a[0], a[1], a[2]), norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));

/* ==========================================================================
   1. THREE MODELS — each on its own base, with its own works and visitors.
      Every wall or building on the edge belongs to a side (n, s, e, w); a
      side facing you is cut away, as in a doll's house, so you can always
      see in. The point of view is a direction to look from: turn the model
      until you are there. Works in the room take the paint like the walls;
      the visitors do not — they walk through it, and get in the way.
   ========================================================================== */
/* materials: 0 plaster, 1 floor, 3 glass, 4 timber, 5 paving, 6 base, 7 shadow, 8 wood floor,
   9 coloured matte, 10 canvas, 11 a visitor (never painted), 12 bronze or lacquer, 13 foliage, 14 dark trim */
const SIDE = { n:[0, -1], s:[0, 1], w:[-1, 0], e:[1, 0] };
const wallsAround = (x0, x1, z0, z1, h, t) => [
  [x0 - t, 0, z0 - t, x1 + t, h, z0, 0, "n"], [x0 - t, 0, z1, x1 + t, h, z1 + t, 0, "s"],
  [x0 - t, 0, z0, x0, h, z1, 0, "w"], [x1, 0, z0, x1 + t, h, z1, 0, "e"],
  /* dark skirting along the inside */
  [x0, 0, z0, x1, .12, z0 + .04, 14, "n"], [x0, 0, z1 - .04, x1, .12, z1, 14, "s"], [x0, 0, z0, x0 + .04, .12, z1, 14, "w"], [x1 - .04, 0, z0, x1, .12, z1, 14, "e"] ];
const base = (x0, x1, z0, z1, top) => [[x0, -1.1, z0, x1, 0, z1, 6, null, top]];
const PAL = [[.86, .2, .16], [.12, .26, .62], [.95, .76, .14], [.1, .1, .12], [.2, .5, .38], [.93, .9, .82], [.85, .45, .55], [.4, .62, .78]];
/* a picture on any wall plane: p = point on the wall surface, n = its normal into the room */
function picture(A, p, n, w, h, seed, side){
  const c = PAL[seed % PAL.length], f = .06, d = .06;
  const ax = Math.abs(n[0]) > .5 ? 2 : 0;                               /* the wall runs along z (ax 2) or x (ax 0) */
  const lo = p.slice(), hi = p.slice();
  lo[ax] -= w / 2 + f; hi[ax] += w / 2 + f; lo[1] -= h / 2 + f; hi[1] += h / 2 + f;
  const nn = Math.abs(n[0]) > .5 ? 0 : 2, s = Math.sign(n[nn]);
  lo[nn] = p[nn]; hi[nn] = p[nn] + s * d; if (s < 0){ const t = lo[nn]; lo[nn] = hi[nn]; hi[nn] = t; }
  A.box(lo[0], lo[1], lo[2], hi[0], hi[1], hi[2], 14, side, null, [0, 0, 0]);
  const lo2 = lo.slice(), hi2 = hi.slice(); lo2[ax] += f; hi2[ax] -= f; lo2[1] += f; hi2[1] -= f;
  if (s > 0) hi2[nn] += .012; else lo2[nn] -= .012;
  A.box(lo2[0], lo2[1], lo2[2], hi2[0], hi2[1], hi2[2], 10, side, null, [c[0], c[1], c[2] + seed * .0001]);
}
const plinth = (A, x, z, w, d, h) => A.box(x - w / 2, 0, z - d / 2, x + w / 2, h, z + d / 2, 0, null, null, [0, 0, 0]);
const bench = (A, x0, z0, x1, z1) => { A.box(x0, .38, z0, x1, .46, z1, 4); const lx = Math.abs(x1 - x0) > Math.abs(z1 - z0);
  for (const t of [.08, .92]){ const x = lx ? lerp(x0, x1, t) : (x0 + x1) / 2, z = lx ? (z0 + z1) / 2 : lerp(z0, z1, t); A.box(x - .04 - (lx ? 0 : Math.abs(x1 - x0) / 2 - .06), 0, z - .04 - (lx ? Math.abs(z1 - z0) / 2 - .06 : 0), x + .04 + (lx ? 0 : Math.abs(x1 - x0) / 2 - .06), .38, z + .04 + (lx ? Math.abs(z1 - z0) / 2 - .06 : 0), 14); } };
function pot(A, x, z, s){ A.tube([x, 0, z], [x, .5 * s, z], .26 * s, .3 * s, 9, [.82, .8, .76], 14);
  A.ell([x, .82 * s, z], .42 * s, .4 * s, .42 * s, 13, [.3, .5, .28]); A.ell([x + .18 * s, 1.05 * s, z - .1 * s], .26 * s, .26 * s, .26 * s, 13, [.36, .56, .3]); }
function tree(A, x, z, s){ A.tube([x, 0, z], [x, 2.2 * s, z], .16 * s, .11 * s, 9, [.42, .32, .24], 10);
  A.ell([x, 3.0 * s, z], 1.2 * s, 1.1 * s, 1.2 * s, 13, [.33, .52, .3]); A.ell([x + .6 * s, 3.7 * s, z + .3 * s], .9 * s, .85 * s, .9 * s, 13, [.4, .6, .34]); A.ell([x - .5 * s, 3.5 * s, z - .4 * s], .8 * s, .8 * s, .8 * s, 13, [.3, .48, .28]); }
function lamp(A, x, z){ A.tube([x, 0, z], [x, 3.8, z], .07, .05, 14, [0, 0, 0], 8); A.tube([x, 3.8, z], [x + .5, 3.9, z], .04, .04, 14, [0, 0, 0], 6); A.ell([x + .55, 3.8, z], .16, .1, .16, 9, [.95, .92, .8]); }
function rope(A, pts, h){ pts.forEach((p, i) => { A.tube([p[0], 0, p[1]], [p[0], h, p[1]], .035, .035, 12, [.72, .62, .32], 8); A.ell([p[0], h + .03, p[1]], .05, .05, .05, 12, [.72, .62, .32]);
  if (i) { const q = pts[i - 1]; A.tube([q[0], h - .08, q[1]], [p[0], h - .08, p[1]], .025, .025, 9, [.6, .12, .12], 6); } }); }

const SCENES = [
  { name:{ en:"Three circles", ko:"세 개의 원" }, place:{ en:"A gallery of columns", ko:"기둥이 늘어선 전시실" },
    color:[.886, .137, .102], shape:0, fov:31, C:[0, 1.6, 0], R:34, yaw:.72, pitch:.5, startYaw:-2.1, startPitch:.62,
    boxes:[ ...base(-6.6, 6.6, -8.6, 8.6, 8), ...wallsAround(-6, 6, -8, 8, 4.6, .3),
      [-6, 0, -2.15, -1.1, 4.6, -1.85, 0], [1.1, 0, -2.15, 6, 4.6, -1.85, 0], [-1.1, 3.0, -2.15, 1.1, 4.6, -1.85, 0],
      [-2.9, 0, 4.2, -2.3, 4.6, 4.8, 0], [2.3, 0, 4.2, 2.9, 4.6, 4.8, 0], [-2.9, 0, .4, -2.3, 4.6, 1.0, 0], [2.3, 0, .4, 2.9, 4.6, 1.0, 0],
      [-2.9, 0, -5.8, -2.3, 4.6, -5.2, 0], [2.3, 0, -5.8, 2.9, 4.6, -5.2, 0],
      [3.1, 0, -7.2, 4.3, .9, -6.0, 0], [-5.2, 0, -7.4, -3.6, 2.2, -7.0, 0] ],
    extra(A){
      picture(A, [-4.4, 1.9, -8], [0, 0, 1], 2.0, 1.4, 1, "n"); picture(A, [-.6, 2.1, -8], [0, 0, 1], 1.2, 1.6, 2, "n"); picture(A, [4.3, 2.0, -8], [0, 0, 1], 1.6, 1.1, 6, "n");
      picture(A, [-6, 1.9, 5.6], [1, 0, 0], 2.2, 1.5, 0, "w"); picture(A, [-6, 1.9, -4.6], [1, 0, 0], 1.3, 1.3, 3, "w");
      picture(A, [-3.6, 1.9, -1.85], [0, 0, 1], 2.0, 1.3, 4, null); picture(A, [3.8, 1.9, -1.85], [0, 0, 1], 1.4, 1.8, 7, null);
      picture(A, [3.8, 1.9, -2.15], [0, 0, -1], 1.8, 1.2, 5, null);
      plinth(A, 4.2, 2.4, .8, .8, 1.0); A.ell([4.2, 1.48, 2.4], .45, .45, .45, 12, [.82, .1, .08]);            /* a lacquered red ball */
      plinth(A, -.2, 6.0, .7, .7, .9); A.box(-.45, .9, 5.78, .05, 1.4, 6.28, 12, null, null, [.55, .4, .22]); A.box(-.3, 1.4, 5.85, .15, 1.8, 6.3, 12, null, null, [.55, .4, .22]); A.box(-.4, 1.8, 5.8, -.05, 2.15, 6.15, 12, null, null, [.55, .4, .22]);
      plinth(A, -1.0, -5.0, .6, .6, .8); A.tube([-1.0, .8, -5.0], [-1.0, 2.6, -5.0], .14, .05, 12, [.38, .3, .2], 12); A.ell([-1.0, 2.68, -5.0], .1, .12, .1, 12, [.38, .3, .2]);
      bench(A, -3.9, 2.2, -2.1, 2.7); bench(A, 3.6, 6.7, 5.4, 7.15);
      rope(A, [[-5.5, -6.3], [-3.3, -6.3]], .9);
      pot(A, 5.3, -1.0, .9); pot(A, -5.3, 7.3, .9);

  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, shTex); gl.uniform1i(u.uSh, 1); gl.uniform1f(u.uShN, 1 / SS);
  gl.uniform3fv(u.uV, Vpos); gl.uniform3fv(u.uCam, eye); gl.uniform3fv(u.uCutEye, eye); gl.uniform3fv(u.uC, S.C); gl.uniform3fv(u.uCol, S.color); gl.uniform3fv(u.uSun, SUN);
  gl.uniform1f(u.uShape, S.shape); gl.uniform1f(u.uWin, won ? .5 + .5 * Math.sin(t * 3) : 0); gl.uniform1f(u.uClue, clueOn); gl.uniform1f(u.uT, t); gl.uniform1f(u.uVyaw, S.yaw);
  gl.uniformMatrix4fv(u.uM, false, I4); bindMesh(mesh); gl.drawArrays(gl.TRIANGLES, 0, mesh.n);
  drawPeople(P.main);
}
let last = performance.now(), t = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  stepPeople(dt);
  if (idle) view.ty += dt * .18;                                            /* it turns slowly by itself until you take hold */
  if (keys.arrowleft || keys.a) view.ty += dt * 1.4; if (keys.arrowright || keys.d) view.ty -= dt * 1.4;
  if (keys.arrowup || keys.w) view.tp = clamp(view.tp + dt * .9, PMIN, PMAX); if (keys.arrowdown || keys.s) view.tp = clamp(view.tp - dt * .9, PMIN, PMAX);
  if (!dragging && !won){ view.ty += view.vy * dt; view.tp = clamp(view.tp + view.vp * dt, PMIN, PMAX); const f = Math.exp(-dt * 3.2); view.vy *= f; view.vp *= f; }
  const k = Math.min(1, dt * 14); view.yaw += (view.ty - view.yaw) * k; view.pitch += (view.tp - view.pitch) * k; view.fov += (view.tf - view.fov) * Math.min(1, dt * 8);
  if (!idle) check(dt); else { $("m-f").style.width = "0%"; $("m-p").textContent = "0%"; $("m-w").textContent = T({ en:"Take hold and turn it", ko:"잡고 돌려 보세요" }); }
  clueOn = lerp(clueOn, $("clue").getAttribute("aria-pressed") === "true" ? 1 : 0, Math.min(1, dt * 4));
  render(t);
}

let hintT = 0, hintAt = 0;

function hideHint(){ if (performance.now() - hintAt > 2500) $("hint").classList.add("off"); }
function siteLight(on){ try { if (window.parent !== window){ const ex = window.parent.document.getElementById("s-exp"); if (ex) ex.classList.toggle("light", on); } } catch (_){} }
function updateChips(){ document.querySelectorAll("#bar [data-s]").forEach(b => { const i = +b.dataset.s; b.setAttribute("aria-pressed", String(i === si)); b.classList.toggle("done", solved[i]); }); }
document.querySelectorAll("#bar [data-s]").forEach(b => { const i = +b.dataset.s; b.querySelector(".lb").textContent = T(SCENES[i].name);
  b.onclick = () => { AUD.unlock(); AUD.click(); if (i !== si){ loadScene(i); sceneHint(); } }; });
function sceneHint(){ hint(T({ en:`${T(SCENES[si].place)} — drag to turn it until the ${si === 0 ? "red" : si === 1 ? "yellow" : "orange"} pieces join into one shape`, ko:`${T(SCENES[si].place)} — 드래그로 돌려서 ${si === 0 ? "빨간" : si === 1 ? "노란" : "주황"} 조각이 하나의 도형이 되는 각도를 찾아보세요` })); }
$("w-next").onclick = () => { AUD.click(); loadScene((si + 1) % 3); sceneHint(); };
$("w-stay").onclick = () => { AUD.click(); leaveWin(); view.vy = 1.6; idle = false; };
$("clue").onclick = () => { AUD.unlock(); AUD.click(); const on = $("clue").getAttribute("aria-pressed") !== "true"; $("clue").setAttribute("aria-pressed", String(on)); document.body.classList.toggle("clue", on);
  if (on) hint(T({ en:"The mark on the base shows the side to look from; the meter says which way to turn", ko:"받침대의 표시가 바라볼 방향이에요. 미터가 돌릴 방향을 알려 줘요" }), true); };
$("snd").onclick = () => { AUD.unlock(); AUD.on = !AUD.on; $("snd").setAttribute("aria-pressed", String(AUD.on)); };

$("about-x").onclick = () => document.body.classList.remove("about");
$("clue").setAttribute("aria-label", T({ en:"Which way to look from", ko:"바라볼 방향 힌트" })); $("snd").setAttribute("aria-label", T({ en:"Sound", ko:"소리" })); $("info").setAttribute("aria-label", T({ en:"About the work", ko:"작품 설명" }));
$("t-h").textContent = T({ en:"Point of View — after Felice Varini", ko:"착시 회화 연작" });
$("t-p").textContent = T({ en:"Felice Varini · 1979– · paint on architecture", ko:"펠리체 바리니 · 1979– · 건축 위에 칠한 페인트" });
$("ab-tag").textContent = T({ en:"Felice Varini · since 1979", ko:"펠리체 바리니 · 1979–" });
$("ab-h").textContent = T({ en:"One point of view", ko:"단 하나의 시점" });
$("ab-p1").textContent = T({ en:"The Swiss painter Felice Varini paints on buildings, rooms and whole streets. He chooses one point of view — usually at his own eye height, somewhere people pass — and projects a simple shape from it across everything in sight: walls, floors, columns, roofs. Then he paints only what the projection covers.",
  ko:"스위스 화가 펠리체 바리니는 건물과 방, 거리 전체에 그림을 그려요. 사람들이 지나다니는 곳에서 자기 눈높이쯤의 시점 하나를 고르고, 그 자리에서 단순한 도형을 벽과 바닥, 기둥, 지붕 위로 비춘 다음, 비친 부분만 칠해요." });
$("ab-p2").textContent = T({ en:"From that one spot the painting is a perfect circle, square or ellipse floating flat in front of you. From anywhere else it falls apart into bent, scattered pieces — and those pieces are the painting too. Here each space is a small model you can turn in your hands.",
  ko:"그 한 자리에서는 완벽한 원, 사각형, 타원이 눈앞에 평평하게 떠 있어요. 다른 곳에서 보면 휘어지고 흩어진 조각이 되죠. 그 조각들 또한 작품이에요. 여기서는 공간을 손에 든 작은 모형처럼 돌려 볼 수 있어요." });
$("ab-h3").textContent = T({ en:"Try", ko:"해 보기" });
[{ en:"Drag to turn the model all the way round, and up and down to look from higher or lower. Scroll or pinch to look closer.", ko:"드래그해 모형을 360도 돌리고, 위아래로 끌어 높이를 바꿔 보세요. 스크롤이나 두 손가락으로 확대할 수 있어요." },
 { en:"The walls on your side are cut away. Other works take the paint too and break it up; visitors wander through and get in the way — wait for them to move on.", ko:"내 쪽 벽은 잘려 나가요. 다른 작품들도 함께 칠해져 조각을 더 흩뜨리고, 돌아다니는 관람객은 시야를 가려요 — 비켜 줄 때까지 기다려 보세요." },

 .forEach(s => { const li = document.createElement("li"); li.textContent = T(s); $("ab-ol").appendChild(li); });
