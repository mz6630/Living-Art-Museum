<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Swimming Pool — Living Art Museum</title>
<meta name="description" content="After Leandro Erlich's Swimming Pool (1999): make a little character, pick a server and meet other visitors around the pool — or take the stairs down and look up at them through the water.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--serif:Fraunces,"Noto Serif KR",Georgia,serif;}
html[lang="ko"]{--serif:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;}
/* ==========================================================================
   SWIMMING POOL — after Leandro Erlich (1999).
   From above it is a pool full of water; in fact a sheet of glass carries a
   few centimetres of water, and under it is an empty sky-blue room you can
   walk into. The people above and the people below become each other's
   picture. Here it is a shared space: each visitor is a small character,
   two servers of up to twenty people each.
   ========================================================================== */
:root{
  --ink:#16222b; --ink-dim:rgba(22,34,43,.62); --ink-faint:rgba(22,34,43,.42);
  --glass-a:rgba(255,255,255,.84); --glass-b:rgba(255,255,255,.64); --glass-line:rgba(0,0,0,.08);
  --on:#16222b; --on-ink:#fff; --accent:#1f9db3;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#cfe4ec;color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none;}
html[lang="ko"] body{word-break:keep-all;}
button,input{font:inherit;color:inherit;background:none;border:0;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}
.glass{background:linear-gradient(180deg,var(--glass-a),var(--glass-b));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-line);box-shadow:0 18px 50px -24px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.75);}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
body.drag #gl{cursor:grabbing;}

.top{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:20px;z-index:10;display:flex;align-items:center;gap:14px;pointer-events:none;}
.top > *{pointer-events:auto;}
.logo{font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1;white-space:nowrap;text-decoration:none;color:var(--ink);}
.title{margin-left:auto;text-align:right;max-width:46vw;}
.title h1{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25;}
.title p{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
body.embedded .top{display:none;}

/* ---- name tags and speech, laid over the 3D ---- */
#tags{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden;}
.av{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;transform-origin:50% 100%;will-change:transform;}
.av.dim{opacity:.5;}
.tg{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.9);font-size:12px;font-weight:600;color:#25313a;white-space:nowrap;
  box-shadow:0 6px 16px -8px rgba(0,0,0,.4);}
.tg .me{display:none;width:19px;height:19px;margin-left:-6px;border-radius:50%;background:#33434e;color:#fff;font-size:10px;font-weight:600;place-items:center;}
.av.mine .tg .me{display:grid;}
.bb{max-width:210px;padding:8px 12px;border-radius:14px;background:#fff;color:#1d2328;font-size:12.5px;font-weight:500;line-height:1.4;text-align:center;white-space:normal;
  box-shadow:0 10px 24px -12px rgba(0,0,0,.45);position:relative;opacity:0;transform:translateY(6px) scale(.96);transition:opacity .25s, transform .25s;}
.bb.on{opacity:1;transform:none;}
.bb::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0;}
.emo{position:absolute;bottom:100%;font-size:24px;opacity:0;}
.emo.go{animation:emo 1.8s ease-out forwards;}
@keyframes emo{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}
.wl{position:absolute;left:0;top:0;padding:5px 10px;border-radius:9px;background:rgba(22,34,43,.82);color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;letter-spacing:.01em;}

#pill{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:11;display:none;align-items:center;gap:9px;padding:8px 15px;border-radius:999px;font-size:12px;white-space:nowrap;}
body.in #pill{display:flex;}
body.embedded #pill{top:calc(70px + env(safe-area-inset-top,0px));}
#pill .dot{width:7px;height:7px;border-radius:50%;background:#3cc28a;box-shadow:0 0 0 3px rgba(60,194,138,.18);}
#pill.solo .dot{background:#c9a24a;box-shadow:0 0 0 3px rgba(201,162,74,.2);}
#pill .k{color:var(--ink-dim);}

#hint{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;padding:10px 16px;border-radius:14px;font-size:12.5px;line-height:1.5;
  max-width:min(520px,calc(100% - 28px));text-align:center;transition:opacity .4s;}
#hint.off{opacity:0;pointer-events:none;}
body.making #hint{display:none;}

#log{position:fixed;left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:min(320px,60vw);}
#log div{padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.72);font-size:11.5px;color:var(--ink);transition:opacity .8s;}
#log div b{font-weight:600;margin-right:5px;}
#log div.old{opacity:0;}
body:not(.in) #log{display:none;}

/* ---- the bar: emotes, speech, settings ---- */
#bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:3px;padding:6px;border-radius:20px;max-width:calc(100% - 20px);}
body.in:not(.making) #bar, body.in:not(.making) #emos{display:flex;}
#emos{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:12;display:none;align-items:center;gap:2px;padding:6px;border-radius:20px;}
#emos .chip .t{display:none;}
@media (min-width:1560px){ #emos .chip .t{display:inline;} }
.chip{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 11px;border-radius:13px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;transition:background .2s,color .2s;}
.chip:hover{color:var(--ink);background:rgba(0,0,0,.05);}
.chip[aria-pressed="true"]{background:var(--on);color:var(--on-ink);}
.chip .e{font-size:16px;line-height:1;}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.sep{width:1px;align-self:stretch;margin:6px 3px;background:var(--glass-line);}
#say{display:flex;align-items:center;gap:4px;padding:3px 3px 3px 12px;border-radius:13px;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.06);}
#say input{width:190px;font-size:12.5px;padding:5px 0;outline:none;color:var(--ink);}
#say input::placeholder{color:var(--ink-faint);}
#say button{padding:6px 10px;border-radius:10px;background:var(--on);color:#fff;font-size:12px;font-weight:600;}
#snd[aria-pressed="false"] .on, #snd[aria-pressed="true"] .off{display:none;}

/* ---- the joystick (touch) ---- */
#joy{position:fixed;left:18px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;z-index:9;display:none;touch-action:none;
  background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 6px 16px -8px rgba(0,0,0,.4);}
#jump{position:fixed;right:18px;bottom:calc(110px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;z-index:9;display:none;font-size:12px;font-weight:600;}
@media (pointer:coarse){ body.in:not(.making) #joy{display:block;} body.in:not(.making) #jump{display:grid;place-items:center;} }
@media (max-width:760px){ #jump{right:12px;bottom:calc(100px + env(safe-area-inset-bottom,0px));width:52px;height:52px;} #joy{bottom:calc(84px + env(safe-area-inset-bottom,0px));} }

/* ---- making your character, and choosing a server ---- */
#make{position:fixed;right:16px;top:calc(18px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:350px;z-index:20;border-radius:24px;
  display:none;flex-direction:column;overflow:hidden;}
body.making #make{display:flex;}
body.embedded #make{top:calc(70px + env(safe-area-inset-top,0px));}
#make .sc{flex:1;overflow-y:auto;padding:20px 20px 8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;}
#make .tag{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;}
html[lang="ko"] #make .tag{letter-spacing:.06em;}
#make h2{font-family:var(--serif);font-size:22px;font-weight:600;margin-top:6px;line-height:1.25;}
#make .lead{font-size:12.5px;line-height:1.6;color:var(--ink-dim);margin-top:6px;}
.row{margin-top:16px;}
.row h4{font-size:11px;font-weight:600;color:var(--ink-faint);margin-bottom:8px;letter-spacing:.04em;}
.name{display:flex;gap:6px;}
.name input{flex:1;padding:10px 13px;border-radius:12px;background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.08);font-size:14px;font-weight:600;outline:none;color:var(--ink);user-select:text;-webkit-user-select:text;}
.name button{padding:0 12px;border-radius:12px;background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.08);font-size:16px;}
.opts{display:flex;flex-wrap:wrap;gap:6px;}
.op{padding:7px 11px;border-radius:11px;font-size:12.5px;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.07);color:var(--ink-dim);}
.op[aria-pressed="true"]{background:var(--on);color:#fff;border-color:var(--on);}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(0,0,0,.12);}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--on);}
.servers{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.srv{text-align:left;padding:12px 13px;border-radius:15px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.08);}
.srv b{display:block;font-size:13.5px;}
.srv span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);margin-top:4px;}
.srv span i{width:7px;height:7px;border-radius:50%;background:#3cc28a;}
.srv.full span i{background:#d9675b;}
.srv[aria-pressed="true"]{border-color:var(--on);box-shadow:0 0 0 1px var(--on);}
.srv:disabled{opacity:.5;cursor:default;}
#net{font-size:11.5px;color:var(--ink-faint);margin-top:9px;line-height:1.5;}
#make .ft{padding:12px 20px 18px;border-top:1px solid rgba(0,0,0,.06);display:flex;gap:8px;}
#go{flex:1;padding:13px;border-radius:14px;background:var(--on);color:#fff;font-size:14px;font-weight:600;}
#go:disabled{opacity:.4;cursor:default;}
#rnd{padding:0 14px;border-radius:14px;background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.08);font-size:12.5px;}

#about{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);width:min(460px,calc(100% - 28px));max-height:calc(100% - 120px);overflow:auto;z-index:40;padding:24px 26px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;}
#about.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%);}
#about .x{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;}
#about .x svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;}
#about .tag{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;}
#about h2{font-family:var(--serif);font-size:24px;margin-top:6px;}
#about p{font-size:13px;line-height:1.7;color:var(--ink-dim);margin-top:10px;}
#about h3{font-size:12px;margin-top:16px;}
#about ol{margin:8px 0 0 18px;font-size:12.5px;line-height:1.7;color:var(--ink-dim);}

@media (min-width:761px) and (max-width:1180px){ #bar{left:auto;right:16px;transform:none;} }
@media (max-width:760px){
  #make{left:10px;right:10px;width:auto;top:auto;height:min(58%,520px);bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px;}
  body.embedded #make{top:auto;}
  #make .sc{padding:16px 16px 6px;}
  #make h2{font-size:19px;}
  #make .lead{display:none;}
  .row{margin-top:12px;}
  #bar{gap:1px;padding:5px;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;right:10px;transform:none;max-width:none;}
  #say{flex:1;min-width:0;}
  #say input{width:auto;flex:1;min-width:0;}
  .chip{padding:7px 8px;font-size:11.5px;}
  #emos{left:auto;right:12px;bottom:calc(178px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:1px;padding:4px;border-radius:18px;}
  #emos .chip{padding:8px 9px;}
  #say{padding-left:9px;}
  #pill{font-size:11px;padding:7px 12px;}
  #hint{bottom:calc(76px + env(safe-area-inset-bottom,0px));font-size:11.5px;}
  #log{display:none;}
  .tg{font-size:11px;}
  .bb{font-size:11.5px;max-width:170px;}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important;} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="tags"></div>

<header class="top">
  <a class="logo" href="#" onclick="return false">Living Art Museum</a>
  <div class="title"><h1 id="t-h"></h1><p id="t-p"></p></div>
</header>

<div id="pill" class="glass"><i class="dot"></i><span id="p-a"></span><span class="k" id="p-b"></span></div>
<div id="hint" class="glass off"></div>
<div id="log"></div>

<section id="make" class="glass" aria-labelledby="mk-h">
  <div class="sc">
    <div class="tag" id="mk-tag"></div>
    <h2 id="mk-h"></h2>
    <p class="lead" id="mk-lead"></p>
    <div class="row"><h4 id="lb-name"></h4><div class="name"><input id="nm" maxlength="12" autocomplete="off" spellcheck="false"><button id="nm-r" aria-label="Random name">🎲</button></div></div>
    <div id="looks"></div>
    <div class="row"><h4 id="lb-srv"></h4><div class="servers" id="srvs"></div><p id="net"></p></div>
  </div>
  <div class="ft"><button id="rnd"></button><button id="go"></button></div>
</section>

<nav id="emos" class="glass">
  <button class="chip" data-e="wave"><span class="e">👋</span><span class="t"></span></button>
  <button class="chip" data-e="bow"><span class="e">🙇</span><span class="t"></span></button>
  <button class="chip" data-e="jump"><span class="e">⤴️</span><span class="t"></span></button>
  <button class="chip" data-e="dance"><span class="e">💃</span><span class="t"></span></button>
  <button class="chip" data-e="sit"><span class="e">🪑</span><span class="t"></span></button>
  <button class="chip" data-e="heart"><span class="e">❤️</span></button>
</nav>
<nav id="bar" class="glass">
  <form id="say" autocomplete="off"><input id="say-i" maxlength="40" enterkeyhint="send"><button type="submit" id="say-b"></button></form>
  <span class="sep"></span>
  <button class="chip" id="edit"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-7 8-7s7 2.5 8 7"/></svg></button>
  <button class="chip" id="snd" aria-pressed="true"><svg class="ico on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg><svg class="ico off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
  <button class="chip" id="info"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</nav>
<div id="joy"><i></i></div>
<button id="jump" class="glass"></button>

<section id="about" class="glass" aria-labelledby="ab-h">
  <button class="x" id="about-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="tag" id="ab-tag"></div>
  <h2 id="ab-h"></h2>
  <p id="ab-p1"></p>
  <p id="ab-p2"></p>
  <h3 id="ab-h3"></h3>
  <ol id="ab-ol"></ol>
</section>

<script>
"use strict";
/* ==========================================================================
   0. BASICS
   ========================================================================== */
const LANG = (() => {
  let l = (document.documentElement.lang || "en").slice(0, 2);
  try { const q = new URLSearchParams(location.search).get("lang"); if (q) l = q; } catch (_){}
  return l === "ko" ? "ko" : "en";
})();
document.documentElement.lang = LANG;
if (LANG === "ko") document.title = "수영장 — Living Art Museum";
const T = (o) => (o && (o[LANG] ?? o.en)) || "";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const rand = (a, b) => a + Math.random() * (b - a), pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const PHONE = () => matchMedia("(max-width:760px)").matches;
const TOUCH = matchMedia("(pointer:coarse)").matches;

/* ==========================================================================
   1. THE PLACE — a courtyard, the pool in the middle, stairs down to the room
      under the water (metres; y up; the water is at y = 0)
   ========================================================================== */
const FLOOR = -2.8, CXW = 14, CZW = 12;               /* the room's floor, the courtyard's half-size */
const PX = 5, PZ = 3.5;                               /* the pool's half-size */
const HOLE = { x0:6.6, x1:8.0, z0:-3.0, z1:3.0 };     /* the stairwell, east of the pool */
const SZ0 = -1.5, RUN = 4.5, NSTEP = 16;              /* sixteen steps from the landing up to the deck */
const RAD = .27;                                      /* how close a body may come to a wall */
const stairY = (z) => clamp(-2.8 + (z - SZ0) / RUN * 2.8 + .085, -2.8, 0);
const inR = (x, z, x0, x1, z0, z1) => x > x0 && x < x1 && z > z0 && z < z1;
const onStairs = (x, z) => inR(x, z, HOLE.x0 + RAD, HOLE.x1 - RAD, SZ0, HOLE.z1);
const inPoolRoom = (x, z) => inR(x, z, -PX, PX, -PZ, PZ);
/* where a body at (x, z), now at height y, would stand — or null where it cannot go */
function floorAt(x, z, y){
  if (onStairs(x, z)){ const f = stairY(z); return Math.abs(f - y) < .62 ? f : null; }
  const low = Math.abs(y - FLOOR) < .62;
  if (low && inR(x, z, HOLE.x0 + RAD, HOLE.x1 - RAD, HOLE.z0 + RAD, SZ0 + .01)) return FLOOR;                /* the landing */
  if (low && inR(x, z, PX - .45, HOLE.x0 + RAD + .02, HOLE.z0 + RAD, SZ0 - RAD)) return FLOOR;               /* the corridor, through the door */
  if (low && inR(x, z, -PX + RAD, PX - RAD, -PZ + RAD, PZ - RAD)) return FLOOR;                               /* the room under the water */
  if (Math.abs(y) < .62 && inR(x, z, -CXW + RAD, CXW - RAD, -CZW + RAD, CZW - RAD)

  /* what lies on the far side of the water */
  gl.bindFramebuffer(gl.FRAMEBUFFER, rf.fb); gl.viewport(0, 0, rf.w, rf.h); gl.clearColor(.55, .8, .84, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  drawSky(VP, below ? 2 : 1, t); drawScene(VP, below ? 2 : 1, below, t, now);
  /* the picture */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.clearColor(.8, .88, .93, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

function frame(now){
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; const t = now / 1000;

  if (me.emote && now - me.et0 > 4200) me.emote = "";
  render(t, now); updateTags(now); maybeSend();
  const z = zoneOf(me.x, me.y, me.z);
  if (inWorld && z !== lastZone){ lastZone = z; renderPill();
    if (z === "below" && !zoneHint.below){ zoneHint.below = true; hint(T(HINTS.down)); }
    if (z === "above" && zoneHint.below && !zoneHint.up){ zoneHint.up = true; hint(T(HINTS.up)); } }
  AUD.update(t, me.y < -1.4 || camPos[1] < -.05 ? 1 : (z === "stairs" ? clamp(-me.y / 2.8, 0, 1) : 0));
  if (now > pruneAt){ pruneAt = now + 15000; pruneMeshes(); }

}
