<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Swimming Pool — Living Art Museum</title>
<meta name="description" content="After Leandro Erlich's Swimming Pool (1999): make a little character, pick a server and meet other visitors around the pool — or take the stairs down and look up at them through the water.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--serif:Fraunces,"Noto Serif KR",Georgia,serif;}
html[lang="ko"]{--serif:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;}
/* ==========================================================================
   SWIMMING POOL — after Leandro Erlich (1999).
   From above it is a pool full of water; in fact a sheet of glass carries a
   few centimetres of water, and under it is an empty sky-blue room you can
   walk into. The people above and the people below become each other's
   picture. Here it is a shared space: each visitor is a small character,
   two servers of up to twenty people each.
   ========================================================================== */
:root{
  --ink:#16150f; --ink-dim:rgba(22,21,15,.62); --ink-faint:rgba(22,21,15,.4);
  --glass-a:rgba(255,255,255,.8); --glass-b:rgba(255,255,255,.6); --glass-line:rgba(0,0,0,.08);
  --chip-on:#16150f; --chip-on-ink:#fff; --accent:#1f9db3;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{background:#cfe4ec;color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none;}
html[lang="ko"] body{word-break:keep-all;}
button,input{font:inherit;color:inherit;background:none;border:0;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}
.glass{background:linear-gradient(180deg,var(--glass-a),var(--glass-b));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-line);box-shadow:0 18px 50px -24px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.7);}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
body.drag #gl{cursor:grabbing;}

.top{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:20px;z-index:10;display:flex;align-items:center;gap:14px;pointer-events:none;}
.top > *{pointer-events:auto;}
.logo{font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1;white-space:nowrap;text-decoration:none;color:var(--ink);}
.title{margin-left:auto;text-align:right;max-width:46vw;}
.title h1{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25;}
.title p{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
body.embedded .top{display:none;}

/* ---- the count, like every room's ---- */
#count{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:11;display:none;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-dim);white-space:nowrap;}
body.in:not(.making) #count{display:flex;}
body.embedded #count{top:calc(70px + env(safe-area-inset-top,0px));}
#count b{color:var(--ink);font-weight:500;}
#count i{width:6px;height:6px;border-radius:50%;background:#2fb47c;flex:none;}
#count.solo i{background:#c9a24a;}
#hint{position:fixed;left:50%;top:var(--hint-y,64px);transform:translate(-50%,0);z-index:11;padding:9px 15px;border-radius:999px;font-size:12.5px;color:var(--ink);white-space:nowrap;
  pointer-events:none;transition:opacity .5s;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;}
body.embedded #hint{--hint-y:116px;}
#hint.off{opacity:0;}
body.making #hint{display:none;}

/* ---- name tags and speech, laid over the 3D ---- */
#tags{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden;}
.av{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;transform-origin:50% 100%;will-change:transform;}
.av.dim{opacity:.5;}
.tg{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.9);font-size:12px;font-weight:600;color:#25231c;white-space:nowrap;
  box-shadow:0 6px 16px -8px rgba(0,0,0,.4);}
.tg .me{display:none;width:19px;height:19px;margin-left:-6px;border-radius:50%;background:var(--chip-on);color:#fff;font-size:10px;font-weight:600;place-items:center;}
.av.mine .tg .me{display:grid;}
.bb{max-width:210px;padding:8px 12px;border-radius:14px;background:#fff;color:#1d1c17;font-size:12.5px;font-weight:500;line-height:1.4;text-align:center;white-space:normal;
  box-shadow:0 10px 24px -12px rgba(0,0,0,.45);position:relative;opacity:0;transform:translateY(6px) scale(.96);transition:opacity .25s, transform .25s;}
.bb.on{opacity:1;transform:none;}
.bb::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0;}
.emo{position:absolute;bottom:100%;font-size:24px;opacity:0;}
.emo.go{animation:emo 1.8s ease-out forwards;}
@keyframes emo{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}
.wl{position:absolute;left:0;top:0;padding:5px 10px;border-radius:9px;background:rgba(22,21,15,.82);color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;}

#log{position:fixed;left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none;max-width:min(320px,60vw);}
#log div{padding:6px 11px;border-radius:12px;font-size:11.5px;color:var(--ink);transition:opacity .8s;}
#log div b{font-weight:600;margin-right:5px;}
#log div.q{color:var(--ink-dim);}
#log div.old{opacity:0;}
body:not(.in) #log, body.making #log{display:none;}

/* ---- the bar, like every room's ---- */
#bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:4px;padding:6px;border-radius:20px;max-width:calc(100% - 20px);}
body.in:not(.making) #bar{display:flex;}
.chip{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:14px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;transition:background .2s,color .2s;}
.chip svg{width:18px;height:18px;flex:none;}
.chip:hover{color:var(--ink);background:rgba(0,0,0,.05);}
.chip[aria-pressed="true"],.chip.hot{background:var(--chip-on);color:var(--chip-on-ink);}
.chip.ic{padding:9px 10px;}
.chip:disabled{opacity:.4;cursor:default;}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--glass-line);}
.ico{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
#snd[aria-pressed="false"] .on, #snd[aria-pressed="true"] .off{display:none;}
.pop{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:14;border-radius:18px;padding:8px;display:none;max-width:calc(100% - 20px);}
.pop.on{display:block;animation:rise .2s ease-out;}
@keyframes rise{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
#pop-emo .grid{display:grid;grid-template-columns:repeat(3,auto);gap:4px;}
#pop-srv .row2{display:flex;gap:6px;}
#pop-srv .chip{border:1px solid var(--glass-line);flex-direction:column;align-items:flex-start;gap:3px;padding:10px 14px;min-width:132px;}
#pop-srv .chip small{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10.5px;letter-spacing:.04em;opacity:.75;}
#pop-srv .note{font-size:11px;color:var(--ink-faint);margin:8px 4px 2px;max-width:280px;line-height:1.5;white-space:normal;}
.field{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;border-radius:14px;border:1px solid var(--glass-line);background:rgba(255,255,255,.55);}
.field span{font-size:12px;color:var(--ink-dim);white-space:nowrap;}
.field input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;outline:0;padding:8px 4px;-webkit-user-select:text;user-select:text;}
.field input::placeholder{color:var(--ink-faint);}
.field:focus-within{border-color:rgba(31,157,179,.55);}
#pop-say{width:min(420px,calc(100% - 20px));}
#pop-say .field{background:rgba(255,255,255,.7);}

/* ---- the joystick (touch) ---- */
#joy{position:fixed;left:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;z-index:9;display:none;touch-action:none;}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--chip-on);opacity:.85;}
#jump{position:fixed;right:16px;bottom:calc(98px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;z-index:9;display:none;place-items:center;color:var(--ink);}
#jump svg{width:22px;height:22px;}
@media (pointer:coarse){ body.in:not(.making) #joy{display:block;} body.in:not(.making) #jump{display:grid;} }
body.popped #joy, body.popped #jump{display:none !important;}

/* ---- making your character, in the same panel as "about" ---- */
#make{position:fixed;right:20px;top:calc(18px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:350px;z-index:20;border-radius:22px;
  display:none;flex-direction:column;overflow:hidden;}
body.making #make{display:flex;}
body.embedded #make{top:calc(70px + env(safe-area-inset-top,0px));}
#make .sc{flex:1;overflow-y:auto;padding:20px 20px 10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;}
.tag{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
html[lang="ko"] .tag{letter-spacing:.04em;}
#make h2,#about h2{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25;margin-top:8px;padding-right:24px;}
#make p.lead{font-size:12.5px;line-height:1.65;color:var(--ink-dim);margin-top:9px;}
#make h3,#about h3{font-size:12px;font-weight:600;margin-top:14px;padding-top:12px;border-top:1px solid var(--glass-line);}
#make .field{margin-top:12px;}
#make .field button{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;color:var(--ink-dim);}
#make .field button:hover{background:rgba(0,0,0,.05);color:var(--ink);}
#make .field button svg{width:18px;height:18px;}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.opts .chip{padding:7px 11px;font-size:12px;border:1px solid var(--glass-line);}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(0,0,0,.12);transition:box-shadow .2s;}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--chip-on);}
#make .srvs{display:flex;gap:6px;margin-top:9px;}
#make .srvs .chip{flex:1;border:1px solid var(--glass-line);flex-direction:column;align-items:flex-start;gap:3px;padding:10px 13px;}
#make .srvs .chip small{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10.5px;letter-spacing:.04em;opacity:.75;}
#make .note{font-size:11px;color:var(--ink-faint);margin-top:8px;line-height:1.5;}
#make .ft{display:flex;gap:6px;padding:12px 16px 14px;border-top:1px solid var(--glass-line);}
#make .ft .chip{justify-content:center;border:1px solid var(--glass-line);}
#make .ft .hot{flex:1;border-color:transparent;font-weight:600;}

#about{position:fixed;right:20px;top:calc(76px + env(safe-area-inset-top,0px));width:350px;max-height:calc(100% - 170px);overflow:auto;z-index:21;border-radius:22px;padding:20px 20px 18px;display:none;}
body.about #about{display:block;}
#about p{font-size:12.5px;line-height:1.65;color:var(--ink-dim);margin-top:9px;}
#about ol{margin:8px 0 0 18px;font-size:12.5px;line-height:1.6;color:var(--ink-dim);}
#about .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim);}
#about .x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;}

@media (max-width:760px){
  .chip{padding:8px 10px;font-size:11.5px;gap:5px;} #bar .chip .lb{display:none;}
  #hint{white-space:normal;text-align:center;border-radius:18px;width:max-content;line-height:1.45;}
  #about{left:10px;right:10px;width:auto;top:calc(64px + env(safe-area-inset-top,0px));}
  .title p{display:none;} .title h1{font-size:13px;}
  #count{top:calc(58px + env(safe-area-inset-top,0px));}
  body.embedded #count{top:calc(64px + env(safe-area-inset-top,0px));}
  #hint{--hint-y:100px;} body.embedded #hint{--hint-y:104px;}
  #make{left:10px;right:10px;width:auto;top:auto;height:min(56%,520px);bottom:calc(10px + env(safe-area-inset-bottom,0px));}
  body.embedded #make{top:auto;}
  #make .sc{padding:16px 16px 8px;}
  #make p.lead{display:none;}
  #pop-emo .grid{grid-template-columns:repeat(3,1fr);}
  #pop-srv .chip{min-width:0;flex:1;}
  #log{display:none;}
  .tg{font-size:11px;} .bb{font-size:11.5px;max-width:170px;}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important;} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="tags"></div>

<header class="top">
  <a class="logo" href="#" onclick="return false">Living Art Museum</a>
  <div class="title"><h1 id="t-h"></h1><p id="t-p"></p></div>
</header>

<div id="count" class="glass"><i></i><span id="c-t"></span></div>
<div id="hint" class="glass off"></div>
<div id="log"></div>

<section id="make" class="glass" aria-labelledby="mk-h">
  <div class="sc">
    <div class="tag" id="mk-tag"></div>
    <h2 id="mk-h"></h2>
    <p class="lead" id="mk-lead"></p>
    <label class="field"><span id="lb-name"></span><input id="nm" maxlength="12" autocomplete="off" spellcheck="false"><button type="button" id="nm-r"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M8.5 8.5h.01M15.5 15.5h.01M12 12h.01M15.5 8.5h.01M8.5 15.5h.01"/></svg></button></label>
    <div id="looks"></div>
    <h3 id="lb-srv"></h3>
    <div class="srvs" id="srvs"></div>
    <p class="note" id="net"></p>
  </div>
  <div class="ft"><button class="chip" id="rnd"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h3l10 10h3M4 17h3l3-3M14 10l3-3h3M17 4l3 3-3 3M17 14l3 3-3 3"/></svg><span class="lb"></span></button><button class="chip hot" id="go"></button></div>
</section>

<div id="pop-say" class="pop glass"><form id="say" class="field" autocomplete="off"><input id="say-i" maxlength="40" enterkeyhint="send"><button type="submit" class="chip hot ic" id="say-b"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button></form></div>
<div id="pop-emo" class="pop glass"><div class="grid">
  <button class="chip" data-e="wave"><svg class="ico" viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 013 0V11M11 10.5V5a1.5 1.5 0 013 0v6M14 10.5V6.5a1.5 1.5 0 013 0V14a6 6 0 01-6 6h-.5a6 6 0 01-5-2.7l-2-3.1a1.5 1.5 0 012.4-1.7L8 14"/></svg><span class="lb"></span></button>
  <button class="chip" data-e="bow"><svg class="ico" viewBox="0 0 24 24"><circle cx="15.5" cy="6.5" r="2.5"/><path d="M13.5 9.5L8 12.5l2 2.5M8 12.5V20M11 15.5l1.5 4.5"/></svg><span class="lb"></span></button>
  <button class="chip" data-e="jump"><svg class="ico" viewBox="0 0 24 24"><path d="M12 17V5M7 10l5-5 5 5M5 20h14"/></svg><span class="lb"></span></button>
  <button class="chip" data-e="dance"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/></svg><span class="lb"></span></button>
  <button class="chip" data-e="sit"><svg class="ico" viewBox="0 0 24 24"><path d="M7 4v9h10M7 13v7M17 13v7M7 9h9"/></svg><span class="lb"></span></button>
  <button class="chip" data-e="heart"><svg class="ico" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg><span class="lb"></span></button>
</div></div>
<div id="pop-srv" class="pop glass"><div class="row2" id="psrvs"></div><p class="note" id="pnet"></p></div>

<nav id="bar" class="glass">
  <button class="chip hot" id="b-say"><svg class="ico" viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 012 2v8a2 2 0 01-2 2h-7l-5 4v-4H5a2 2 0 01-2-2V7a2 2 0 012-2z"/></svg><span class="lb"></span></button>
  <button class="chip" id="b-emo"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 007 0M9 9.5v.5M15 9.5v.5"/></svg><span class="lb"></span></button>
  <span class="sep"></span>
  <button class="chip" id="b-me"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-7 8-7s7 2.5 8 7"/></svg><span class="lb"></span></button>
  <button class="chip" id="b-srv"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/><path d="M8 7h.01M8 17h.01"/></svg><span class="lb"></span></button>
  <span class="sep"></span>
  <button class="chip ic" id="snd" aria-pressed="true"><svg class="ico on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg><svg class="ico off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
  <button class="chip ic" id="info"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</nav>
<div id="joy" class="glass"><i></i></div>
<button id="jump" class="glass" aria-label="Jump"><svg class="ico" viewBox="0 0 24 24"><path d="M12 17V5M7 10l5-5 5 5M5 20h14"/></svg></button>

<section id="about" class="glass" aria-labelledby="ab-h">
  <button class="x" id="about-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="tag" id="ab-tag"></div>
  <h2 id="ab-h"></h2>
  <p id="ab-p1"></p>
  <p id="ab-p2"></p>
  <h3 id="ab-h3"></h3>
  <ol id="ab-ol"></ol>
</section>

<script>
"use strict";
/* ==========================================================================
   0. BASICS
   ========================================================================== */
const LANG = (() => {
  let l = (document.documentElement.lang || "en").slice(0, 2);
  try { const q = new URLSearchParams(location.search).get("lang"); if (q) l = q; } catch (_){}
  return l === "ko" ? "ko" : "en";
})();
document.documentElement.lang = LANG;
if (LANG === "ko") document.title = "수영장 — Living Art Museum";
const T = (o) => (o && (o[LANG] ?? o.en)) || "";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));

/* ==========================================================================
   9. SOUND — above, the pool laps and drips; below, a soft rush of water and
      bubbles rising. Everything stays bright: nothing below ~250 Hz
   ========================================================================== */
const AUD = (() => {

    try { const host = window.parent !== window && window.parent.__lamAudio && window.parent.__lamAudio(); if (host && host.state === "running"){ ctx = host; borrowed = true; } } catch (_){}
    if (!ctx){ try { ctx = new AC(); } catch (_){ return null; } }

    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 250; master.connect(hp); hp.connect(ctx.destination);
    const n = ctx.sampleRate * 2; white = ctx.createBuffer(1, n, ctx.sampleRate); const w = white.getChannelData(0); for (let i = 0; i < n; i++) w[i] = Math.random() * 2 - 1;

    const a = ctx.createGain(); a.gain.setValueAtTime(.0001, tt); a.gain.exponentialRampToValueAtTime(g, tt + Math.min(.012, dur * .25)); a.gain.exponentialRampToValueAtTime(.0001, tt + dur);
    s.connect(fl); fl.connect(a); a.connect(master); s.start(tt, Math.random()); s.stop(tt + dur + .03); }
  function tone(tt, f, dur, g, f2, type){ const o = ctx.createOscillator(); o.type = type || "sine"; o.frequency.setValueAtTime(f, tt); if (f2) o.frequency.exponentialRampToValueAtTime(f2, tt + dur);
    const a = ctx.createGain(); a.gain.setValueAtTime(.0001, tt); a.gain.exponentialRampToValueAtTime(g, tt + .006); a.gain.exponentialRampToValueAtTime(.0001, tt + dur); o.connect(a); a.connect(master); o.start(tt); o.stop(tt + dur + .02); }
  function loop(f, q){ const s = ctx.createBufferSource(); s.buffer = white; s.loop = true; const fl = ctx.createBiquadFilter(); fl.type = "bandpass"; fl.frequency.value = f; fl.Q.value = q;
    const g = ctx.createGain(); g.gain.value = 0; s.connect(fl); fl.connect(g); g.connect(master); s.start(); return { fl, g }; }
  return {
    unlock(){ if (ensure() && ctx.state !== "running") ctx.resume().catch(() => {}); },
    start(){ if (amb || !ok()) return; amb = { lap:loop(1300, .6), hiss:loop(3600, 1.6), deep:loop(560, 1.2), rush:loop(1050, 2.2) }; },
    get on(){ return on; }, set on(v){ on = v; if (master) master.gain.setTargetAtTime(v ? .9 : 0, ctx.currentTime, .05); },
    stop(){ if (!ctx) return; try { master.disconnect(); } catch (_){} if (!borrowed) try { ctx.close(); } catch (_){} },
    /* every frame: crossfade above and below, with slow swells */
    update(t, depth){ if (!amb || !ok()) return; below = lerp(below, depth, .05); const tt = ctx.currentTime, up = 1 - below;
      const sw = .62 + .25 * Math.sin(t * 1.7) + .13 * Math.sin(t * 3.9 + 1);
      amb.lap.g.gain.setTargetAtTime(.022 * sw * up, tt, .12); amb.lap.fl.frequency.setTargetAtTime(1100 + 450 * Math.sin(t * .9), tt, .3);
      amb.hiss.g.gain.setTargetAtTime(.0045 * up, tt, .2);
      amb.deep.g.gain.setTargetAtTime(.03 * (.7 + .3 * Math.sin(t * .33)) * below, tt, .25);
      amb.rush.g.gain.setTargetAtTime(.009 * (.6 + .4 * Math.sin(t * .52 + 2)) * below, tt, .3);
      if (t > nextPlip && up > .3){ nextPlip = t + rand(1.2, 3.6); const f = rand(1500, 2300); tone(tt, f, .07, .016 * up, f * 1.5); }
      if (t > nextBub && below > .3){ nextBub = t + rand(1.4, 4.2); const n = 2 + Math.floor(Math.random() * 4); for (let i = 0; i < n; i++){ const f = rand(420, 700); tone(tt + i * rand(.06, .14), f, .11, .02 * below, f * 2.2); } } },
    step(low){ if (!ok()) return; burst(ctx.currentTime, .045, low ? 1700 : 2600, 4, .014); },
    click(){ if (!ok()) return; tone(ctx.currentTime, 1760, .05, .028, null, "triangle"); },
    chat(){ if (!ok()) return; const tt = ctx.currentTime; tone(tt, 1568, .08, .03); tone(tt + .07, 2093, .1, .025); },
    joined(){ if (!ok()) return; const tt = ctx.currentTime; tone(tt, 1175, .12, .022); tone(tt + .1, 1568, .16, .02); },
    emote(e){ if (!ok()) return; const tt = ctx.currentTime;

      else if (e === "bow"){ tone(tt, 1568, .14, .025); tone(tt + .12, 1175, .2, .022); }
      else if (e === "jump") tone(tt, 700, .2, .035, 1500, "triangle");
      else if (e === "dance") [1047, 1319, 1568, 2093, 1568, 1319].forEach((f, i) => tone(tt + i * .11, f, .1, .022, null, "triangle"));
      else if (e === "heart"){ tone(tt, 1760, .1, .025); tone(tt + .1, 2349, .18, .02); }

const ptrs = new Map(); let pinch0 = 0, d0 = 0;

  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY }); try { cv.setPointerCapture(e.pointerId); } catch (_){}
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); d0 = view.td; } document.body.classList.add("drag"); });
cv.addEventListener("pointermove", e => { const p = ptrs.get(e.pointerId); if (!p) return;
  if (ptrs.size === 2){ const o = [...ptrs.entries()].find(([id]) => id !== e.pointerId)[1]; const d = Math.hypot(e.clientX - o.x, e.clientY - o.y); if (pinch0) view.td = clamp(d0 * pinch0 / d, 1.8, 10); p.x = e.clientX; p.y = e.clientY; return; }
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (making){ me.r -= dx * .012; return; }
  view.ty -= dx * .0065; view.tp = clamp(view.tp + dy * .005, -.6, 1.2); });
const endPtr = (e) => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; if (!ptrs.size) document.body.classList.remove("drag"); };
cv.addEventListener("pointerup", endPtr); cv.addEventListener("pointercancel", endPtr);
cv.addEventListener("wheel", e => { e.preventDefault(); if (!making) view.td = clamp(view.td * Math.exp(e.deltaY * .0012), 1.8, 10); }, { passive:false });
window.addEventListener("keydown", e => {
  if (e.target === $("say-i")){ if (e.key === "Escape"){ e.target.blur(); closePops(); } return; }
  if (e.target === $("nm")) return;
  if (e.key === "Escape"){ closePops(); document.body.classList.remove("about"); return; }
  keys[e.code] = true;
  if (e.code === "Space"){ e.preventDefault(); jump(); }
  if (e.code === "Enter" && inWorld && !making){ e.preventDefault(); openSay(); }
  if (/^Arrow/.test(e.code)) e.preventDefault();
});
window.addEventListener("keyup", e => { keys[e.code] = false; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
/* the joystick */
const jEl = $("joy"), knob = jEl.querySelector("i");
jEl.addEventListener("pointerdown", e => { joy.on = true; joy.id = e.pointerId; try { jEl.setPointerCapture(e.pointerId); } catch (_){} moveJoy(e); AUD.unlock(); closePops(); });

const endJoy = () => { joy.on = false; joy.x = joy.y = 0; knob.style.transform = ""; };
jEl.addEventListener("pointerup", endJoy); jEl.addEventListener("pointercancel", endJoy);
function moveJoy(e){ const r = jEl.getBoundingClientRect(), R = r.width / 2; let x = (e.clientX - r.left - R) / (R * .72), y = (e.clientY - r.top - R) / (R * .72); const l = Math.hypot(x, y); if (l > 1){ x /= l; y /= l; } joy.x = x; joy.y = y; knob.style.transform = `translate(${x * R * .6}px, ${y * R * .6}px)`; }

/* ==========================================================================
   11. EVERY FRAME
   ========================================================================== */
let W = 0, H = 0, DPR = 1;
function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, PHONE() || TOUCH ? 1.5 : 1.75);
  W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR);
  if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }
  const rw = Math.max(64, Math.round(W / 2)), rh = Math.max(64, Math.round(H / 2));
  if (gl && (rf.w !== rw || rf.h !== rh)){ dropTarget(rf); dropTarget(rl); rf = target(rw, rh, true); rl = target(rw, rh, true); }
}
window.addEventListener("resize", layout);
function useProg(p, VP, clip, below, t){
  gl.useProgram(p.p); const u = p.u;
  if (u.uVP) gl.uniformMatrix4fv(u.uVP, false, VP);
  if (u.uM) gl.uniformMatrix4fv(u.uM, false, I4);
  if (u.uCam) gl.uniform3fv(u.uCam, camPos); if (u.uSun) gl.uniform3fv(u.uSun, SUN);
  if (u.uT) gl.uniform1f(u.uT, t); if (u.uClip) gl.uniform1f(u.uClip, clip); if (u.uBelow) gl.uniform1f(u.uBelow, below);
  if (u.uSV) gl.uniformMatrix4fv(u.uSV, false, SV); if (u.uShTex) gl.uniform1f(u.uShTex, 1 / SS); if (u.uAvY) gl.uniform1f(u.uAvY, -99);
  if (u.uSh){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, shTex); gl.uniform1i(u.uSh, 0); }
}
const tooClose = () => !making && Math.hypot(camPos[0] - me.x, camPos[1] - me.y - 1, camPos[2] - me.z) < 1.15;   /* the camera is in your own head: look through it */
function drawPeople(p, now){
  const hideMe = tooClose();
  for (const a of AVATARS()){
    if (!a.mesh || (a === me && hideMe) || (making && a.npc && Math.hypot(a.x - me.x, a.z - me.z) < 2.4 && Math.abs(a.y - me.y) < 1)) continue;
    if (p.u.uAvY) gl.uniform1f(p.u.uAvY, a.y);
    for (const [M, part] of partMats(a, now)){ gl.uniformMatrix4fv(p.u.uM, false, M); bindMesh(part); gl.drawArrays(gl.TRIANGLES, 0, part.n); } }
  if (p.u.uAvY) gl.uniform1f(p.u.uAvY, -99);
}
function drawSky(VP, clip, t){ gl.depthMask(false); useProg(P.sky, VP, clip, 0, t); gl.uniformMatrix4fv(P.sky.u.uM, false, Tm(camPos[0], camPos[1], camPos[2])); bindMesh(SKY); gl.drawArrays(gl.TRIANGLES, 0, SKY.n); gl.depthMask(true); }
function drawScene(VP, clip, below, t, now){ useProg(P.main, VP, clip, below, t); bindMesh(WORLD); gl.drawArrays(gl.TRIANGLES, 0, WORLD.n); drawPeople(P.main, now); }
function render(t, now){
  const VP = mm4(persp(PHONE() ? 1.02 : .9, W / H, .06, 600), lookAt(camPos, camTgt)); VPm = VP;
  const below = camPos[1] < 0 ? 1 : 0;
  /* the sun's view, for shadows */
  updateSV();
  gl.bindFramebuffer(gl.FRAMEBUFFER, shFB); gl.viewport(0, 0, SS, SS); gl.clearColor(1, 1, 1, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  useProg(P.sh, SV, 0, 0, t); bindMesh(WORLD); gl.drawArrays(gl.TRIANGLES, 0, WORLD.n); drawPeople(P.sh, now);
  /* what lies on the far side of the water */
  gl.bindFramebuffer(gl.FRAMEBUFFER, rf.fb); gl.viewport(0, 0, rf.w, rf.h); gl.clearColor(.55, .8, .84, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  drawSky(VP, below ? 2 : 1, t); drawScene(VP, below ? 2 : 1, below, t, now);
  /* what stands round it, mirrored in the surface (from above only) */
  if (!below){ gl.bindFramebuffer(gl.FRAMEBUFFER, rl.fb); gl.viewport(0, 0, rl.w, rl.h); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    drawScene(mm4(VP, MIRROR), 2, 0, t, now); }
  /* the picture */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.clearColor(.8, .88, .93, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  drawSky(VP, 0, t); drawScene(VP, 0, below, t, now);
  gl.useProgram(P.water.p); const u = P.water.u;
  gl.uniformMatrix4fv(u.uVP, false, VP); gl.uniformMatrix4fv(u.uM, false, I4); gl.uniform3fv(u.uCam, camPos); gl.uniform3fv(u.uSun, SUN); gl.uniform1f(u.uT, t); gl.uniform1f(u.uBelow, below);
  gl.uniform2f(u.uRes, W, H); gl.uniform1f(u.uHasRefl, below ? 0 : 1);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, rf.tex); gl.uniform1i(u.uRef, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, rl.tex); gl.uniform1i(u.uRefl, 2);
  bindMesh(WATER); gl.drawArrays(gl.TRIANGLES, 0, WATER.n);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, null); gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, null); gl.activeTexture(gl.TEXTURE0);
}
let lastT = performance.now(), pruneAt = 0, zoneHint = { below:false, up:false };
function frame(now){
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; const t = now / 1000;
  moveMe(dt); stepPeers(dt); stepNpcs(dt); placeCamera(dt);
  if (me.emote && now - me.et0 > 4200) me.emote = "";
  render(t, now); updateTags(now); maybeSend();
  const z = zoneOf(me.x, me.y, me.z);
  if (inWorld && z !== lastZone){ lastZone = z; renderPill();
    if (z === "below" && !zoneHint.below){ zoneHint.below = true; hint(T(HINTS.down)); }
    if (z === "above" && zoneHint.below && !zoneHint.up){ zoneHint.up = true; hint(T(HINTS.up)); } }
  AUD.update(t, me.y < -1.4 || camPos[1] < -.05 ? 1 : (z === "stairs" ? clamp(-me.y / 2.8, 0, 1) : 0));
  if (now > pruneAt){ pruneAt = now + 15000; pruneMeshes(); }
  requestAnimationFrame(frame);
}
