<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Swimming Pool — Living Art Museum</title>
<meta name="description" content="After Leandro Erlich's Swimming Pool (1999): make a little character, pick a server and meet other visitors around the pool — or take the stairs down and look up at them through the water.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--serif:Fraunces,"Noto Serif KR",Georgia,serif;}
html[lang="ko"]{--serif:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;}
/* ==========================================================================
   SWIMMING POOL — after Leandro Erlich (1999).
   From above it is a pool full of water; in fact a sheet of glass carries a
   few centimetres of water, and under it is an empty sky-blue room you can
   walk into. The people above and the people below become each other's
   picture. Here it is a shared space: each visitor is a small character,
   two servers of up to twenty people each.
   ========================================================================== */
:root{
  --ink:#16150f; --ink-dim:rgba(22,21,15,.62); --ink-faint:rgba(22,21,15,.4);
  --glass-a:rgba(255,255,255,.8); --glass-b:rgba(255,255,255,.6); --glass-line:rgba(0,0,0,.08);
  --chip-on:#16150f; --chip-on-ink:#fff; --accent:#1f9db3;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{background:#f1ede4;color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none;}
html[lang="ko"] body{word-break:keep-all;}
button,input{font:inherit;color:inherit;background:none;border:0;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}
.glass{background:linear-gradient(180deg,var(--glass-a),var(--glass-b));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-line);box-shadow:0 18px 50px -24px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.7);}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
body.drag #gl{cursor:grabbing;}

.top{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:20px;z-index:10;display:flex;align-items:center;gap:14px;pointer-events:none;}
.top > *{pointer-events:auto;}
.logo{font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1;white-space:nowrap;text-decoration:none;color:var(--ink);}
.title{margin-left:auto;text-align:right;max-width:46vw;}
.title h1{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25;}
.title p{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
body.embedded .top{display:none;}
body.night .logo, body.night .title h1{color:#f4f1ea;} body.night .title p{color:rgba(244,241,234,.66);}

/* ---- the count, like every room's ---- */
#count{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:11;display:none;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-dim);white-space:nowrap;}
body.in:not(.making) #count{display:flex;}
body.embedded #count{top:calc(70px + env(safe-area-inset-top,0px));}
#count b{color:var(--ink);font-weight:500;}
#c-dn{padding-left:9px;border-left:1px solid var(--glass-line);font-variant-numeric:tabular-nums;color:var(--ink-dim);}
#count i{width:6px;height:6px;border-radius:50%;background:#2fb47c;flex:none;}
#count.solo i{background:#c9a24a;}
#goal{position:fixed;left:0;top:0;width:46px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.95);box-shadow:0 0 14px rgba(255,255,255,.55);pointer-events:none;z-index:5;opacity:0;transition:opacity .25s;}
#goal.on{opacity:1;}
#goal::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(255,255,255,.8);opacity:0;}
#goal.go::after{animation:goal .6s ease-out;}
@keyframes goal{from{opacity:1;transform:scale(.4);}to{opacity:0;transform:scale(1.7);}}
#hint{position:fixed;left:50%;top:var(--hint-y,64px);transform:translate(-50%,0);z-index:11;padding:9px 15px;border-radius:999px;font-size:12.5px;color:var(--ink);white-space:nowrap;
  pointer-events:none;transition:opacity .5s;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;}
body.embedded #hint{--hint-y:116px;}
/* the round button that throws (phones) */
#throwb{position:fixed;right:12px;bottom:calc(166px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;z-index:9;display:none;padding:0;border:0;
  color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .16s cubic-bezier(.3,1.5,.5,1);}
#throwb.on{display:block;}
#throwb .orb{position:absolute;left:50%;top:9px;width:38px;height:38px;margin-left:-19px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.85) 0 9%, transparent 10%), radial-gradient(circle at 50% 45%, var(--bc,#f9708f), color-mix(in srgb, var(--bc,#f9708f) 70%, #000));
  box-shadow:0 4px 10px -3px color-mix(in srgb, var(--bc,#f9708f) 70%, transparent), inset 0 -3px 6px rgba(0,0,0,.12);transition:background .25s, transform .3s cubic-bezier(.3,1.5,.5,1);}
#throwb.ball .orb{background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.7) 0 8%, transparent 9%), conic-gradient(#ee434d 0 60deg,#fbf8f0 0 120deg,#3f7fe8 0 180deg,#fbf8f0 0 240deg,#fcc534 0 300deg,#fbf8f0 0);box-shadow:0 4px 10px -3px rgba(0,0,0,.35);}
#throwb .tl{position:absolute;left:0;right:0;bottom:11px;text-align:center;font:700 10.5px/1 inherit;font-family:inherit;letter-spacing:.02em;}
#throwb::after{content:"";position:absolute;inset:-3px;border-radius:50%;pointer-events:none;opacity:0;
  background:conic-gradient(var(--accent) var(--cd,0%), transparent 0);-webkit-mask:radial-gradient(circle, transparent 36px, #000 37px);mask:radial-gradient(circle, transparent 36px, #000 37px);}
#throwb.cool::after{opacity:1;animation:thCool .45s linear forwards;}
@keyframes thCool{from{--cd:0%;}to{--cd:100%;}}
@property --cd{syntax:"<percentage>";inherits:false;initial-value:0%;}
#throwb:active{transform:scale(.92);}
#throwb:active .orb{transform:translateY(-3px) scale(1.06);}
#throwb.go .orb{animation:thGo .38s cubic-bezier(.2,.9,.3,1);}
@keyframes thGo{0%{transform:none;}35%{transform:translate(10px,-16px) scale(.6);opacity:0;}36%{transform:translateY(8px) scale(.6);opacity:0;}100%{transform:none;opacity:1;}}
#throwx{position:fixed;right:76px;bottom:calc(222px + env(safe-area-inset-bottom,0px));width:30px;height:30px;border-radius:50%;z-index:9;display:none;place-items:center;padding:0;border:0;color:var(--ink-dim);
  -webkit-tap-highlight-color:transparent;}
#throwx svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;}
#throwx.on{display:grid;}
body.popped #throwb, body.popped #throwx{display:none !important;}

#b-bal[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);}
body.aimon canvas{cursor:crosshair;}
#hint.off{opacity:0;}
body.making #hint{display:none;}

/* ---- name tags and speech, laid over the 3D ---- */
#tags{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden;}
.av{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;transform-origin:50% 100%;will-change:transform;}
.av.dim{opacity:.5;}
.tg{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.9);font-size:12px;font-weight:600;color:#25231c;white-space:nowrap;
  box-shadow:0 6px 16px -8px rgba(0,0,0,.4);}
.tg .me{display:none;width:19px;height:19px;margin-left:-6px;border-radius:50%;background:var(--chip-on);color:#fff;font-size:10px;font-weight:600;place-items:center;}
.av.mine .tg .me{display:grid;}
.bb{max-width:210px;padding:8px 12px;border-radius:14px;background:#fff;color:#1d1c17;font-size:12.5px;font-weight:500;line-height:1.4;text-align:center;white-space:normal;
  box-shadow:0 10px 24px -12px rgba(0,0,0,.45);position:relative;opacity:0;transform:translateY(6px) scale(.96);transition:opacity .25s, transform .25s;}
.bb.on{opacity:1;transform:none;}
.bb::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0;}
.emo{position:absolute;bottom:100%;font-size:24px;opacity:0;}
.emo.go{animation:emo 1.8s ease-out forwards;}
@keyframes emo{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}
.seat{position:absolute;left:0;top:0;width:52px;height:30px;padding:0;border:0;background:none;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;will-change:transform;}
.seat::before{content:"";position:absolute;left:9px;top:8px;width:30px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.96);background:rgba(255,255,255,.3);
  box-shadow:0 0 12px rgba(255,255,255,.75);animation:seatP 1.7s ease-in-out infinite;}
.seat:hover::before{background:rgba(255,255,255,.6);}
@keyframes seatP{50%{transform:scale(1.14);opacity:.7;}}
#sitb{position:absolute;left:0;top:0;display:none;align-items:center;gap:7px;padding:8px 14px 8px 12px;border:0;border-radius:999px;background:rgba(255,255,255,.94);color:#25231c;
  font:600 12.5px/1 inherit;font-family:inherit;white-space:nowrap;box-shadow:0 8px 20px -8px rgba(0,0,0,.45);pointer-events:auto;cursor:pointer;will-change:transform;}
#sitb.on{display:flex;}
#vendb{position:absolute;left:0;top:0;display:none;align-items:center;gap:7px;padding:8px 14px 8px 11px;border:0;border-radius:999px;background:rgba(255,255,255,.94);color:#25231c;
  font:600 12.5px/1 inherit;font-family:inherit;white-space:nowrap;box-shadow:0 8px 20px -8px rgba(0,0,0,.45);pointer-events:auto;cursor:pointer;will-change:transform;}
#vendb.on{display:flex;} #vendb:hover{background:#fff;} #vendb .vi{font-size:14px;line-height:1;}
#vendb kbd{font:600 10px/1 "JetBrains Mono",monospace;padding:3px 5px;border-radius:5px;background:rgba(37,35,28,.09);color:#5a5648;}
@media (hover:none){ #vendb kbd{display:none;} }
.av.ghost .tg{opacity:.42;}
/* the beer: a warm blush round the picture's edge (opacity set from the script, only while it lasts) */
#tipsy{position:fixed;inset:0;z-index:3;pointer-events:none;display:none;opacity:0;background:radial-gradient(ellipse 72% 68% at 50% 48%, transparent 48%, rgba(255,160,118,.5) 100%);}
/* the drink you are on: top right, a ring that runs down, × to stop */
#drinkfx{position:fixed;right:20px;top:calc(62px + env(safe-area-inset-top,0px));z-index:9;display:none;align-items:center;gap:10px;padding:6px 6px 6px 7px;border-radius:999px;max-width:min(300px,calc(100% - 20px));}
body.in:not(.making) #drinkfx.on{display:flex;animation:dfxIn .35s cubic-bezier(.2,.9,.3,1.25);}
@keyframes dfxIn{from{opacity:0;transform:translateY(-6px) scale(.94);}to{opacity:1;transform:none;}}
#drinkfx .dc{position:relative;width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--dc,#ffd34d);font-style:normal;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
#drinkfx .dc b{font-size:17px;line-height:1;}
#drinkfx .dc svg{position:absolute;left:-3px;top:-3px;width:42px;height:42px;transform:rotate(-90deg);fill:none;stroke:#16150f;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:103.7;stroke-dashoffset:0;opacity:0;}
#drinkfx.run .dc svg{opacity:.7;animation:dfxT var(--dur,15s) linear forwards;}
@keyframes dfxT{to{stroke-dashoffset:103.7;}}
#drinkfx .dt{display:flex;flex-direction:column;gap:2px;min-width:0;}
#drinkfx .dt b{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;}
#drinkfx .dt small{font-size:11px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
#dfx-x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(22,21,15,.07);transition:background .2s;}
#dfx-x:hover{background:rgba(22,21,15,.14);}
#dfx-x svg, #vend-x svg{width:14px;height:14px;fill:none;stroke:var(--ink-dim);stroke-width:2;stroke-linecap:round;}
@media (max-width:760px){ #drinkfx{right:10px;top:calc(100px + env(safe-area-inset-top,0px));gap:6px;} #drinkfx .dt{display:none;} }
body.embedded #drinkfx{top:calc(66px + env(safe-area-inset-top,0px));}
@media (max-width:760px){ body.embedded #drinkfx{top:calc(108px + env(safe-area-inset-top,0px));} }
/* the machine's menu */
#pop-vend{width:min(360px,calc(100% - 20px));padding:12px 10px 10px;}
#pop-vend .vh{display:flex;align-items:center;gap:8px;margin:0 4px 3px;}
#pop-vend .vh i{width:10px;height:10px;border-radius:3px;background:var(--vc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);}
#pop-vend .vh b{font:600 14.5px/1.3 var(--serif);color:var(--ink);}
#vend-x{margin-left:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(22,21,15,.06);}
#pop-vend .vs{margin:0 4px 8px;font-size:11.5px;line-height:1.45;color:var(--ink-dim);}
#vend-l{display:flex;flex-direction:column;gap:3px;}
.dk{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px 8px 9px;border-radius:14px;text-align:left;transition:background .15s,transform .15s;-webkit-tap-highlight-color:transparent;}
.dk:hover{background:rgba(255,255,255,.75);} .dk:active{transform:scale(.98);}
.dk .can{position:relative;width:28px;height:40px;flex:none;margin-top:3px;border-radius:8px 8px 7px 7px;font-style:normal;display:grid;place-items:center;
  background:linear-gradient(90deg,rgba(0,0,0,.1),rgba(255,255,255,.4) 36%,rgba(0,0,0,.05) 70%,rgba(0,0,0,.12)),var(--c1);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 6px 12px -8px rgba(0,0,0,.45);}
.dk .can::before{content:"";position:absolute;left:0;right:0;top:12px;height:15px;background:var(--c2);opacity:.92;}
.dk .can::after{content:"";position:absolute;left:4px;right:4px;top:-3px;height:5px;border-radius:3px;background:linear-gradient(#eef0f2,#b7bcc2);}
.dk.bottle .can{width:22px;border-radius:9px 9px 6px 6px;margin-left:3px;margin-right:3px;}
.dk.bottle .can::after{left:6px;right:6px;top:-5px;height:6px;background:#3f80ea;}
.dk.carton .can{border-radius:3px 3px 4px 4px;margin-top:8px;height:36px;} .dk.carton .can::after{left:2px;right:2px;top:-8px;height:9px;border-radius:0;background:var(--c1);clip-path:polygon(50% 0,100% 100%,0 100%);}
.dk.juice .can{width:24px;height:34px;border-radius:3px;margin:6px 2px 0;} .dk.juice .can::after{left:auto;right:5px;width:2px;top:-9px;height:10px;border-radius:1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.1);}
.dk.cup .can{border-radius:4px 4px 11px 11px;width:26px;height:34px;margin:8px 1px 0;} .dk.cup .can::after{left:0;right:0;top:-9px;height:11px;border-radius:13px 13px 0 0;background:rgba(240,246,255,.95);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
.av.sour .bb{background:#fff4a6;} .av.sour .bb::after{border-top-color:#fff4a6;}
#pop-vend{max-height:calc(100vh - 110px - env(safe-area-inset-bottom,0px));overflow:auto;}
.dk .can span{position:relative;font-size:13px;line-height:1;}
.dk .dt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.dk .dt b{font-size:13px;font-weight:600;color:var(--ink);}
.dk .dt small{font-size:11.5px;line-height:1.35;color:var(--ink-dim);}
.dk em{flex:none;font:500 10.5px/1 "JetBrains Mono","Noto Sans KR",monospace;font-style:normal;color:var(--ink-dim);padding:5px 7px;border-radius:999px;background:rgba(22,21,15,.06);}
.dk.cur em{background:var(--chip-on);color:var(--chip-on-ink);}
#pop-vend .note{font-size:11px;color:var(--ink-faint);margin:8px 6px 0;line-height:1.5;}
#ballb{position:absolute;left:0;top:0;display:none;align-items:center;gap:7px;padding:8px 14px 8px 12px;border:0;border-radius:999px;background:rgba(255,255,255,.94);color:#25231c;
  font:600 12.5px/1 inherit;font-family:inherit;white-space:nowrap;box-shadow:0 8px 20px -8px rgba(0,0,0,.45);pointer-events:auto;cursor:pointer;will-change:transform;}
#ballb.on{display:flex;}
#ballb.fix{position:fixed;left:50%;top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) !important;}
#ballb kbd{font:600 10px/1 "JetBrains Mono",monospace;padding:3px 5px;border-radius:5px;background:rgba(37,35,28,.09);color:#5a5648;}
#ballb .bd{width:14px;height:14px;border-radius:50%;background:conic-gradient(#ee434d 0 60deg,#fbf8f0 0 120deg,#3f7fe8 0 180deg,#fbf8f0 0 240deg,#fcc534 0 300deg,#fbf8f0 0);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
@media (hover:none){ #ballb kbd{display:none;} }
#sitb.fix{position:fixed;left:50%;top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) !important;}
#sitb:hover{background:#fff;}
#sitb kbd{font:600 10px/1 "JetBrains Mono",monospace;padding:3px 5px;border-radius:5px;background:rgba(37,35,28,.09);color:#5a5648;}
@media (hover:none){ #sitb kbd{display:none;} }
.wl{position:absolute;left:0;top:0;padding:5px 10px;border-radius:9px;background:rgba(22,21,15,.82);color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;}

#log{position:fixed;left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none;max-width:min(320px,60vw);}
#log div{padding:6px 11px;border-radius:12px;font-size:11.5px;color:var(--ink);transition:opacity .8s;}
#log div b{font-weight:600;margin-right:5px;}
#log div.q{color:var(--ink-dim);}
#log div.old{opacity:0;}
body:not(.in) #log, body.making #log{display:none;}

/* ---- the bar, like every room's ---- */
#bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:4px;padding:6px;border-radius:20px;max-width:calc(100% - 20px);}
body.in:not(.making) #bar{display:flex;}
.chip{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:14px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;transition:background .2s,color .2s;}
.chip svg{width:18px;height:18px;flex:none;}
.chip:hover{color:var(--ink);background:rgba(0,0,0,.05);}
.chip[aria-pressed="true"],.chip.hot{background:var(--chip-on);color:var(--chip-on-ink);}
.chip.ic{padding:9px 10px;}
.chip:disabled{opacity:.4;cursor:default;}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--glass-line);}
.ico{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
#snd[aria-pressed="false"] .on, #snd[aria-pressed="true"] .off{display:none;}
.pop{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:14;border-radius:18px;padding:8px;display:none;max-width:calc(100% - 20px);}
.pop.on{display:block;animation:rise .2s ease-out;}
@keyframes rise{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
#pop-emo .grid{display:grid;grid-template-columns:repeat(3,auto);gap:4px;}
#pop-srv .row2{display:flex;gap:6px;}
#pop-srv .chip{border:1px solid var(--glass-line);flex-direction:column;align-items:flex-start;gap:3px;padding:10px 14px;min-width:132px;}
#pop-srv .chip small{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10.5px;letter-spacing:.04em;opacity:.75;}
#pop-srv .note{font-size:11px;color:var(--ink-faint);margin:8px 4px 2px;max-width:280px;line-height:1.5;white-space:normal;}
.field{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;border-radius:14px;border:1px solid var(--glass-line);background:rgba(255,255,255,.55);}
.field span{font-size:12px;color:var(--ink-dim);white-space:nowrap;}
.field input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;outline:0;padding:8px 4px;-webkit-user-select:text;user-select:text;}
.field input::placeholder{color:var(--ink-faint);}
.field:focus-within{border-color:rgba(31,157,179,.55);}
#pop-say{width:min(420px,calc(100% - 20px));}
/* the wish: written first, then thrown */
#pop-wish{width:min(340px,calc(100% - 20px));padding:14px 14px 12px;}
#pop-wish .wt{margin:0 2px 8px;font:600 13px/1.35 inherit;font-family:inherit;color:var(--ink);}
#wish-i{width:100%;box-sizing:border-box;resize:none;border-radius:12px;border:1px solid var(--glass-line);background:rgba(255,255,255,.75);padding:10px 12px;font:14px/1.45 inherit;font-family:inherit;color:var(--ink);outline:none;}
#wish-i:focus{border-color:var(--accent);background:#fff;}
#wish-i.shake{animation:wsh .36s;} @keyframes wsh{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
#pop-wish .wr{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 10px;}
.wsw{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.wsw input{position:absolute;opacity:0;pointer-events:none;}
.wsw i{position:relative;width:34px;height:20px;border-radius:999px;background:rgba(22,21,15,.16);transition:background .2s;}
.wsw i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.3,1.4,.5,1);}
.wsw input:checked + i{background:var(--chip-on);}
.wsw input:checked + i::after{transform:translateX(14px);}
.wsw input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px;}
#pop-wish .wc{font:500 11px/1 "JetBrains Mono",monospace;color:var(--ink-faint);}
#wish-go{width:100%;justify-content:center;}
#pop-wish .note{font-size:11px;color:var(--ink-faint);margin:8px 2px 0;line-height:1.5;}
#pop-wish .note.warn{color:#c2410c;font-weight:600;}
/* the coin toss ranking: top left, under the logo */
#rank{position:fixed;left:20px;top:calc(62px + env(safe-area-inset-top,0px));z-index:8;width:228px;border-radius:16px;padding:4px 6px 6px;display:none;}
body.embedded #rank{top:calc(66px + env(safe-area-inset-top,0px));}
body.in:not(.making) #rank{display:block;}
#rank-h{display:flex;align-items:center;gap:6px;width:100%;padding:7px 6px 6px;border:0;background:none;font:600 12px/1.2 inherit;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left;}
#rank-h .tr{font-size:13px;}
#rank-h #rank-t{flex:none;}
#rank-h #rank-s{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:var(--ink-dim);display:none;}
#rank-h svg{width:14px;height:14px;fill:none;stroke:var(--ink-dim);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s;margin-left:auto;flex:none;}
#rank.min #rank-h svg{transform:rotate(-90deg);}
#rank.min #rank-s{display:block;}
#rank.min #rank-l, #rank.min #rank-me{display:none;}
#rank:not(.more) #rank-l li:nth-child(n+6){display:none;}
#rank.flash{animation:rkFlash 1.4s ease;}
@keyframes rkFlash{20%{box-shadow:0 0 0 3px rgba(240,190,60,.75), 0 10px 30px -10px rgba(0,0,0,.35);}}
#rank-me{margin:5px 6px 2px;font-size:11px;color:var(--ink-dim);display:flex;justify-content:space-between;gap:8px;}
#rank-me button{border:0;background:none;padding:0;font:600 11px/1 inherit;font-family:inherit;color:var(--accent);cursor:pointer;}
@media (max-width:760px){ #rank{left:10px;top:calc(100px + env(safe-area-inset-top,0px));width:214px;} body.embedded #rank{top:calc(108px + env(safe-area-inset-top,0px));} }
@media (max-width:440px){ #bar{gap:1px;padding:5px;} #bar .chip{padding:8px 8px;} #bar .sep{margin:0 1px;} }
#rank-l{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto;}
#rank-l li{display:grid;grid-template-columns:22px 1fr auto auto;gap:8px;align-items:center;padding:5px 6px;border-radius:9px;font-size:12px;color:var(--ink);}
#rank-l li:nth-child(odd){background:rgba(255,255,255,.4);}
#rank-l li.me{background:rgba(240,190,60,.3);}
#rank-l .rn{font:700 11px/1 "JetBrains Mono",monospace;color:var(--ink-dim);text-align:center;}
#rank-l li:nth-child(-n+3) .rn{color:#b7861a;}
#rank-l .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#rank-l .sk{font-size:10.5px;color:#2f8fb0;}
#rank-l .sc{font:600 12px/1 "JetBrains Mono",monospace;}
#rank-l .empty{grid-template-columns:1fr;color:var(--ink-faint);font-size:11.5px;background:none;}
/* the throw, scored */
#coinScore{position:fixed;left:50%;top:calc(var(--hint-y,64px) + 46px);transform:translate(-50%,-8px) scale(.96);z-index:11;padding:12px 18px 11px;border-radius:18px;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .3s, transform .35s cubic-bezier(.3,1.4,.5,1);background:rgba(255,253,247,.95);min-width:200px;}
#coinScore.on{opacity:1;transform:translate(-50%,0) scale(1);}
#coinScore .cs1{margin:0;font-size:12px;color:var(--ink-dim);}
#coinScore .cs2{margin:2px 0 0;font:700 28px/1.1 var(--serif);color:var(--ink);}
#coinScore .cs2 small{font:600 13px/1 inherit;font-family:inherit;margin-left:3px;color:var(--ink-dim);}
#coinScore .cs3{margin:4px 0 0;font-size:11.5px;color:#a0700f;font-weight:600;}
/* a wish, read off a coin in the water */
#wishCard{position:fixed;left:0;top:0;z-index:5;max-width:min(260px,70vw);padding:10px 13px 9px;border-radius:16px;pointer-events:none;opacity:0;transition:opacity .25s;will-change:transform;
  background:rgba(255,253,247,.94);box-shadow:0 10px 26px -12px rgba(0,0,0,.45);}
#wishCard.far::after{display:none;}
#wishCard.on{opacity:1;}
#wishCard::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:inherit;border-right:1px solid var(--glass-line);border-bottom:1px solid var(--glass-line);}
#wishCard .wq{margin:0;font:15px/1.45 var(--serif);color:var(--ink);word-break:keep-all;overflow-wrap:anywhere;}
#wishCard .wq.lock{font:13px/1.45 inherit;font-family:inherit;color:var(--ink-dim);}
#wishCard .wm{margin:5px 0 0;font-size:11px;color:var(--ink-faint);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;}
#wishCard .wm b{font-weight:600;color:var(--ink);background:rgba(240,190,60,.28);border-radius:6px;padding:1px 6px;}
#pop-say .field{background:rgba(255,255,255,.7);}

/* ---- the joystick (touch) ---- */
#joy{position:fixed;left:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;z-index:9;display:none;touch-action:none;}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--chip-on);opacity:.85;}
#jump{position:fixed;right:16px;bottom:calc(98px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;z-index:9;display:none;place-items:center;color:var(--ink);}
#jump svg{width:22px;height:22px;}
@media (pointer:coarse){ body.in:not(.making) #joy{display:block;} body.in:not(.making) #jump{display:grid;} }
body.popped #joy, body.popped #jump{display:none !important;}

/* ---- making your character, in the same panel as "about" ---- */
#make{position:fixed;right:20px;top:calc(18px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:350px;z-index:20;border-radius:22px;
  display:none;flex-direction:column;overflow:hidden;}
body.making #make{display:flex;}
body.embedded #make{top:calc(70px + env(safe-area-inset-top,0px));}
#make .sc{flex:1;overflow-y:auto;padding:20px 20px 10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;}
.tag{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
html[lang="ko"] .tag{letter-spacing:.04em;}
#make h2,#about h2{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25;margin-top:8px;padding-right:24px;}
#make p.lead{font-size:12.5px;line-height:1.65;color:var(--ink-dim);margin-top:9px;}
#make h3,#about h3{font-size:12px;font-weight:600;margin-top:14px;padding-top:12px;border-top:1px solid var(--glass-line);}
#make .field{margin-top:12px;}
#make .field button{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;color:var(--ink-dim);}
#make .field button:hover{background:rgba(0,0,0,.05);color:var(--ink);}
#make .field button svg{width:18px;height:18px;}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.opts .chip{padding:7px 11px;font-size:12px;border:1px solid var(--glass-line);}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(0,0,0,.12);transition:box-shadow .2s;}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--chip-on);}
#make .srvs{display:flex;gap:6px;margin-top:9px;}
#make .srvs .chip{flex:1;border:1px solid var(--glass-line);flex-direction:column;align-items:flex-start;gap:3px;padding:10px 13px;}
#make .srvs .chip small{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10.5px;letter-spacing:.04em;opacity:.75;}
#make .note{font-size:11px;color:var(--ink-faint);margin-top:8px;line-height:1.5;}
#make .ft{display:flex;gap:6px;padding:12px 16px 14px;border-top:1px solid var(--glass-line);}
#make .ft .chip{justify-content:center;border:1px solid var(--glass-line);}
#make .ft .hot{flex:1;border-color:transparent;font-weight:600;}

#about{position:fixed;right:20px;top:calc(76px + env(safe-area-inset-top,0px));width:350px;max-height:calc(100% - 170px);overflow:auto;z-index:21;border-radius:22px;padding:20px 20px 18px;display:none;}
body.about #about{display:block;}
#about p{font-size:12.5px;line-height:1.65;color:var(--ink-dim);margin-top:9px;}
#about ol{margin:8px 0 0 18px;font-size:12.5px;line-height:1.6;color:var(--ink-dim);}
#about .mv{margin-top:14px;padding:12px;border-radius:14px;background:rgba(255,255,255,.5);border:1px solid var(--glass-line);}
#about .mvt{margin:0 0 8px !important;font-size:12px !important;font-weight:600;color:var(--ink) !important;}
#about .seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border-radius:11px;background:rgba(22,21,15,.07);}
#about .seg button{padding:8px 6px;border:0;border-radius:9px;background:none;font:600 12px/1.25 inherit;font-family:inherit;color:var(--ink-dim);cursor:pointer;transition:background .2s,color .2s,box-shadow .2s;}
#about .calm{justify-content:space-between;flex-direction:row-reverse;margin-top:12px;padding-top:11px;border-top:1px solid var(--glass-line);font-weight:600;font-size:12px;}
#about .mvn{margin:5px 0 0 !important;font-size:11px !important;line-height:1.5 !important;color:var(--ink-faint) !important;}
#about .seg button[aria-checked="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14);}
body.move-click #joy{display:none !important;}
#about .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim);}
#about .x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;}

@media (max-width:760px){
  .chip{padding:8px 10px;font-size:11.5px;gap:5px;} #bar .chip .lb{display:none;}
  #hint{white-space:normal;text-align:center;border-radius:18px;width:max-content;line-height:1.45;}
  #about{left:10px;right:10px;width:auto;top:calc(64px + env(safe-area-inset-top,0px));}
  .title p{display:none;} .title h1{font-size:13px;}
  #count{top:calc(58px + env(safe-area-inset-top,0px));}
  body.embedded #count{top:calc(64px + env(safe-area-inset-top,0px));}
  #hint{--hint-y:100px;} body.embedded #hint{--hint-y:104px;}
  #make{left:10px;right:10px;width:auto;top:auto;height:min(56%,520px);bottom:calc(10px + env(safe-area-inset-bottom,0px));}
  body.embedded #make{top:auto;}
  #make .sc{padding:16px 16px 8px;}
  #make p.lead{display:none;}
  #pop-emo .grid{grid-template-columns:repeat(3,1fr);}
  #pop-srv .chip{min-width:0;flex:1;}
  #log{display:none;}
  .tg{font-size:11px;} .bb{font-size:11.5px;max-width:170px;}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important;} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="tags"></div>

<header class="top">
  <a class="logo" href="#" onclick="return false">Living Art Museum</a>
  <div class="title"><h1 id="t-h"></h1><p id="t-p"></p></div>
</header>

<aside id="rank" class="glass" aria-live="polite"><button type="button" id="rank-h"><span class="tr">🏆</span><span id="rank-t"></span><span id="rank-s"></span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <ol id="rank-l"></ol><p id="rank-me"></p></aside>
<div id="count" class="glass"><i></i><span id="c-t"></span><span id="c-dn"></span></div>
<div id="goal" aria-hidden="true"></div>
<div id="tipsy" aria-hidden="true"></div>
<div id="hint" class="glass off"></div>
<button id="throwb" class="glass" type="button"><i class="orb"></i><span class="tl"></span></button>
<button id="throwx" class="glass" type="button"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div id="log"></div>

<section id="make" class="glass" aria-labelledby="mk-h">
  <div class="sc">
    <div class="tag" id="mk-tag"></div>
    <h2 id="mk-h"></h2>
    <p class="lead" id="mk-lead"></p>
    <label class="field"><span id="lb-name"></span><input id="nm" maxlength="12" autocomplete="off" spellcheck="false"><button type="button" id="nm-r"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M8.5 8.5h.01M15.5 15.5h.01M12 12h.01M15.5 8.5h.01M8.5 15.5h.01"/></svg></button></label>
    <div id="looks"></div>
    <h3 id="lb-srv"></h3>
    <div class="srvs" id="srvs"></div>
    <p class="note" id="net"></p>
  </div>
  <div class="ft"><button class="chip" id="rnd"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h3l10 10h3M4 17h3l3-3M14 10l3-3h3M17 4l3 3-3 3M17 14l3 3-3 3"/></svg><span class="lb"></span></button><button class="chip hot" id="go"></button></div>
</section>

<div id="pop-say" class="pop glass"><form id="say" class="field" autocomplete="off"><input id="say-i" maxlength="40" enterkeyhint="send"><button type="submit" class="chip hot ic" id="say-b"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button></form></div>
<div id="pop-wish" class="pop glass">
  <p class="wt" id="wish-t"></p>
  <textarea id="wish-i" maxlength="60" rows="2" enterkeyhint="done"></textarea>
  <div class="wr"><label class="wsw"><input type="checkbox" id="wish-p"><i></i><span id="wish-pl"></span></label><span class="wc" id="wish-c">0/60</span></div>
  <button type="button" class="chip hot" id="wish-go"></button>
  <p class="note" id="wish-n"></p>
</div>
<div id="coinScore" class="glass" aria-live="polite"><p class="cs1"></p><p class="cs2"></p><p class="cs3"></p></div>
<div id="drinkfx" class="glass" aria-live="polite"><i class="dc"><b id="dfx-i"></b><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16.5"/></svg></i><span class="dt"><b id="dfx-n"></b><small id="dfx-s"></small></span><button type="button" id="dfx-x"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
<div id="pop-vend" class="pop glass" role="dialog" aria-labelledby="vend-t"><div class="vh"><i></i><b id="vend-t"></b><button type="button" id="vend-x"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
  <p class="vs" id="vend-s"></p><div id="vend-l"></div><p class="note" id="vend-n"></p></div>
<div id="wishCard" class="glass" aria-live="polite"><p class="wq"></p><p class="wm"></p></div>
<div id="pop-emo" class="pop glass"><div class="grid">
  <button class="chip" data-e="wave"><svg class="ico" viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 013 0V11M11 10.5V5a1.5 1.5 0 013 0v6M14 10.5V6.5a1.5 1.5 0 013 0V14a6 6 0 01-6 6h-.5a6 6 0 01-5-2.7l-2-3.1a1.5 1.5 0 012.4-1.7L8 14"/></svg><span class="lb"></span></button>
  <button class="chip" data-e="bow"><svg class="ico" viewBox="0 0 24 24"><circle cx="15.5" cy="6.5" r="2.5"/><path d="M13.5 9.5L8 12.5l2 2.5M8 12.5V20M11 15.5l1.5 4.5"/></svg><span class="lb"></span></button>
  <button class="chip" data-e="jump"><svg class="ico" viewBox="0 0 24 24"><path d="M12 17V5M7 10l5-5 5 5M5 20h14"/></svg><span class="lb"></span></button>
  <button class="chip" data-e="dance"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/></svg><span class="lb"></span></button>
  <button class="chip" data-e="sit"><svg class="ico" viewBox="0 0 24 24"><path d="M7 4v9h10M7 13v7M17 13v7M7 9h9"/></svg><span class="lb"></span></button>
  <button class="chip" data-e="heart"><svg class="ico" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg><span class="lb"></span></button>
</div></div>
<div id="pop-srv" class="pop glass"><div class="row2" id="psrvs"></div><p class="note" id="pnet"></p></div>

<nav id="bar" class="glass">
  <button class="chip hot" id="b-say"><svg class="ico" viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 012 2v8a2 2 0 01-2 2h-7l-5 4v-4H5a2 2 0 01-2-2V7a2 2 0 012-2z"/></svg><span class="lb"></span></button>
  <button class="chip" id="b-emo"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 007 0M9 9.5v.5M15 9.5v.5"/></svg><span class="lb"></span></button>
  <button class="chip" id="b-bal" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3a6 6 0 016 6.2c0 3.9-3.2 7.3-6 7.3s-6-3.4-6-7.3A6 6 0 0112 3z"/><path d="M11 16.5h2l-1 1.6zM12 18.1c-.6 1.2.8 1.8.2 2.9"/><path d="M9.3 7.6a3 3 0 012-1.9"/></svg><span class="lb"></span></button>
  <button class="chip" id="b-wish" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.6"/><path d="M12 9.6l.8 1.6 1.7.2-1.2 1.2.3 1.7-1.6-.8-1.6.8.3-1.7-1.2-1.2 1.7-.2z"/></svg><span class="lb"></span></button>
  <span class="sep"></span>
  <button class="chip" id="b-me"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-7 8-7s7 2.5 8 7"/></svg><span class="lb"></span></button>
  <button class="chip" id="b-srv"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/><path d="M8 7h.01M8 17h.01"/></svg><span class="lb"></span></button>
  <span class="sep"></span>
  <button class="chip ic" id="snd" aria-pressed="true"><svg class="ico on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg><svg class="ico off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
  <button class="chip ic" id="info"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>

function maker(){

   { en:"Day and night take turns every three minutes, the same for everyone here. At night the lamps and strings of bulbs along the walls and the vending machines light up, and the water glows softly — the count at the top shows how long till it turns", ko:"3분마다 낮과 밤이 바뀌어요(모든 방문자가 같은 시간). 밤에는 벽을 따라 벽등과 줄 전구, 자판기 불빛이 켜지고 수영장 물빛이 은은하게 빛나요 — 위쪽 표시에서 바뀔 때까지 남은 시간을 볼 수 있어요" },
   { en:"Talk (Enter), wave, bow, jump, dance or sit — near a bench every free seat shows a ring: click it, or press E, to sit", ko:"말하기(Enter), 손 흔들기·인사·점프·춤·앉기로 만나요 — 벤치 가까이 가면 빈자리에 동그라미가 떠요. 누르거나 E 키로 앉아요" }]
    .forEach(s => { const li = document.createElement("li"); li.textContent = T(s); ol.appendChild(li); });
  const lab = { wave:{ en:"Wave", ko:"손 흔들기" }, bow:{ en:"Bow", ko:"인사" }, jump:{ en:"Jump", ko:"점프" }, dance:{ en:"Dance", ko:"춤" }, sit:{ en:"Sit", ko:"앉기" }, heart:{ en:"Heart", ko:"하트" } };
  document.querySelectorAll("#pop-emo [data-e]").forEach(b => { b.querySelector(".lb").textContent = T(lab[b.dataset.e]); });
  $("b-say").querySelector(".lb").textContent = T({ en:"Say", ko:"말하기" }); $("b-emo").querySelector(".lb").textContent = T({ en:"Moves", ko:"표현" });
  $("b-me").querySelector(".lb").textContent = T({ en:"Character", ko:"캐릭터" });
  $("b-bal").querySelector(".lb").textContent = T({ en:"Balloon", ko:"물풍선" });
  $("throwb").querySelector(".tl").textContent = T({ en:"Throw", ko:"던지기" }); $("throwx").setAttribute("aria-label", T({ en:"Put the balloon away", ko:"물풍선 끄기" }));
  $("b-wish").querySelector(".lb").textContent = T({ en:"Wish coin", ko:"소원 동전" });
  $("wish-t").textContent = T({ en:"Write a wish, then throw the coin into the pool", ko:"소원을 적고, 동전을 수영장에 던져요" });
  $("wish-i").placeholder = T({ en:"My wish is…", ko:"나의 소원은…" });
  $("wish-pl").textContent = T({ en:"Only me (private)", ko:"나만 보기 (비공개)" });
  $("wish-go").textContent = T({ en:"Throw the coin", ko:"동전 던지기" });
  $("rank-t").textContent = T(innerWidth < 760 ? { en:"Ranking", ko:"랭킹" } : { en:"Coin toss ranking", ko:"동전 던지기 랭킹" }); renderRank();
  $("wish-n").textContent = T(WISH_NOTE);
  $("say-i").placeholder = T({ en:"Say something…", ko:"말하기…" }); $("say-b").setAttribute("aria-label", T({ en:"Send", ko:"보내기" }));
  $("snd").title = T({ en:"Sound", ko:"소리" }); $("info").title = T({ en:"About the work", ko:"작품 설명" }); $("jump").setAttribute("aria-label", T({ en:"Jump", ko:"점프" }));
}
document.body.classList.add("making");
layout();
if (!initGL()){
  document.body.innerHTML = `<p style="padding:40px;font:14px Inter,sans-serif">${T({ en:"This room needs WebGL.", ko:"이 공간은 WebGL이 필요해요." })}</p>`;
} else {
  about(); siteLight(true);
  me.mesh = meshFor(me.look);
  me.x = 0; me.z = PZ + .62; me.y = 0; me.r = 0; camPos = [0, 1.3, PZ + 4]; camTgt = [0, .8, PZ];
  makeNpcs(); buildPanel();
  requestAnimationFrame(frame);
  netInit();
}
["pointerdown", "keydown", "touchstart"].forEach(ev => window.addEventListener(ev, () => AUD.unlock(), { capture:true, passive:true }));
window.__pool = { night(k){ NIGHT.force = k; }, faceOf, AUD, buyDrink, openVend, endDrink, setCalm, DRINKS, VENDS, handAt, pose, walk(ix, iz, secs){ joy.on = true; joy.x = ix; joy.y = -iz; for (let i = 0; i < secs * 60; i++) moveMe(1 / 60); joy.on = false; joy.x = joy.y = 0; }, me, PEERS, NET, NPCS, enter, onPeerList, myState, emote, say, view, cam:() => ({ camPos, camTgt }), floorAt, zoneOf, look(k){ me.look = lookFrom(k); applyLook(); } };
