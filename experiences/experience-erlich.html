<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Swimming Pool — Living Art Museum</title>
<meta name="description" content="After Leandro Erlich's Swimming Pool (1999): make a little character, pick a server and meet other visitors around the pool — or take the stairs down and look up at them through the water.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--serif:Fraunces,"Noto Serif KR",Georgia,serif;}
html[lang="ko"]{--serif:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;}
/* ==========================================================================
   SWIMMING POOL — after Leandro Erlich (1999).
   From above it is a pool full of water; in fact a sheet of glass carries a
   few centimetres of water, and under it is an empty sky-blue room you can
   walk into. The people above and the people below become each other's
   picture. Here it is a shared space: each visitor is a small character,
   two servers of up to twenty people each.
   ========================================================================== */
:root{
  --ink:#16150f; --ink-dim:rgba(22,21,15,.62); --ink-faint:rgba(22,21,15,.4);
  --glass-a:rgba(255,255,255,.8); --glass-b:rgba(255,255,255,.6); --glass-line:rgba(0,0,0,.08);
  --chip-on:#16150f; --chip-on-ink:#fff; --accent:#1f9db3;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{background:#f1ede4;color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none;}
html[lang="ko"] body{word-break:keep-all;}
button,input{font:inherit;color:inherit;background:none;border:0;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}
.glass{background:linear-gradient(180deg,var(--glass-a),var(--glass-b));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-line);box-shadow:0 18px 50px -24px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.7);}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
body.drag #gl{cursor:grabbing;}

.top{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:20px;z-index:10;display:flex;align-items:center;gap:14px;pointer-events:none;}
.top > *{pointer-events:auto;}
.logo{font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1;white-space:nowrap;text-decoration:none;color:var(--ink);}
.title{margin-left:auto;text-align:right;max-width:46vw;}
.title h1{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25;}
.title p{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
body.embedded .top{display:none;}
body.night .logo, body.night .title h1{color:#f4f1ea;} body.night .title p{color:rgba(244,241,234,.66);}

/* ---- the count, like every room's ---- */
#count{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:11;display:none;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-dim);white-space:nowrap;}
body.in:not(.making) #count{display:flex;}
body.embedded #count{top:calc(70px + env(safe-area-inset-top,0px));}
#count b{color:var(--ink);font-weight:500;}
#c-dn{display:flex;align-items:center;gap:5px;margin:-5px -8px -5px 0;padding:5px 9px 5px 9px;border:0;border-left:1px solid var(--glass-line);border-radius:0 999px 999px 0;font:inherit;letter-spacing:inherit;font-variant-numeric:tabular-nums;color:var(--ink-dim);cursor:pointer;transition:background .2s;}
#c-dn:hover, body.popped #c-dn.open{background:rgba(255,255,255,.6);color:var(--ink);}
#c-dn::after{content:"";width:5px;height:5px;margin-left:2px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.7;}
#pop-season{top:calc(60px + env(safe-area-inset-top,0px));bottom:auto;padding:12px 10px 10px;width:min(400px,calc(100% - 20px));}
body.embedded #pop-season{top:calc(112px + env(safe-area-inset-top,0px));}
#pop-season .st{margin:0 4px 8px;font:600 13px/1.3 inherit;font-family:inherit;color:var(--ink);}
#pop-season .sg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
#pop-season .sb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;border-radius:13px;border:1px solid var(--glass-line);background:rgba(255,255,255,.45);transition:background .15s,transform .15s;}
#pop-season .sb:hover{background:rgba(255,255,255,.85);} #pop-season .sb:active{transform:scale(.97);}
#pop-season .sb i{font-size:22px;font-style:normal;line-height:1.1;} #pop-season .sb b{font-size:12.5px;font-weight:600;color:var(--ink);} #pop-season .sb small{font-size:10.5px;color:var(--ink-dim);text-align:center;line-height:1.3;}
#pop-season .sb[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);} #pop-season .sb[aria-pressed="true"] b{color:#fff;} #pop-season .sb[aria-pressed="true"] small{color:rgba(255,255,255,.72);}
#pop-season .note{font-size:11px;color:var(--ink-faint);margin:9px 4px 0;line-height:1.5;}
#count i{width:6px;height:6px;border-radius:50%;background:#2fb47c;flex:none;}
#count.solo i{background:#c9a24a;}
#goal{position:fixed;left:0;top:0;width:46px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.95);box-shadow:0 0 14px rgba(255,255,255,.55);pointer-events:none;z-index:5;opacity:0;transition:opacity .25s;}
#goal.on{opacity:1;}
#goal::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(255,255,255,.8);opacity:0;}
#goal.go::after{animation:goal .6s ease-out;}
@keyframes goal{from{opacity:1;transform:scale(.4);}to{opacity:0;transform:scale(1.7);}}
#hint{position:fixed;left:50%;top:var(--hint-y,64px);transform:translate(-50%,0);z-index:11;padding:9px 15px;border-radius:999px;font-size:12.5px;color:var(--ink);white-space:nowrap;
  pointer-events:none;transition:opacity .5s;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;}
body.embedded #hint{--hint-y:116px;}
/* the round button that throws (phones) */
#throwb{position:fixed;right:12px;bottom:calc(166px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;z-index:9;display:none;padding:0;border:0;
  color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .16s cubic-bezier(.3,1.5,.5,1);}
#throwb.on{display:block;}
#throwb .orb{position:absolute;left:50%;top:9px;width:38px;height:38px;margin-left:-19px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.85) 0 9%, transparent 10%), radial-gradient(circle at 50% 45%, var(--bc,#f9708f), color-mix(in srgb, var(--bc,#f9708f) 70%, #000));
  box-shadow:0 4px 10px -3px color-mix(in srgb, var(--bc,#f9708f) 70%, transparent), inset 0 -3px 6px rgba(0,0,0,.12);transition:background .25s, transform .3s cubic-bezier(.3,1.5,.5,1);}
#throwb.ball .orb{background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.7) 0 8%, transparent 9%), conic-gradient(#ee434d 0 60deg,#fbf8f0 0 120deg,#3f7fe8 0 180deg,#fbf8f0 0 240deg,#fcc534 0 300deg,#fbf8f0 0);box-shadow:0 4px 10px -3px rgba(0,0,0,.35);}
#throwb .tl{position:absolute;left:0;right:0;bottom:11px;text-align:center;font:700 10.5px/1 inherit;font-family:inherit;letter-spacing:.02em;}
#throwb::after{content:"";position:absolute;inset:-3px;border-radius:50%;pointer-events:none;opacity:0;
  background:conic-gradient(var(--accent) var(--cd,0%), transparent 0);-webkit-mask:radial-gradient(circle, transparent 36px, #000 37px);mask:radial-gradient(circle, transparent 36px, #000 37px);}
#throwb.cool::after{opacity:1;animation:thCool .45s linear forwards;}
@keyframes thCool{from{--cd:0%;}to{--cd:100%;}}
@property --cd{syntax:"<percentage>";inherits:false;initial-value:0%;}
#throwb:active{transform:scale(.92);}
#throwb:active .orb{transform:translateY(-3px) scale(1.06);}
#throwb.go .orb{animation:thGo .38s cubic-bezier(.2,.9,.3,1);}
@keyframes thGo{0%{transform:none;}35%{transform:translate(10px,-16px) scale(.6);opacity:0;}36%{transform:translateY(8px) scale(.6);opacity:0;}100%{transform:none;opacity:1;}}
#throwx{position:fixed;right:76px;bottom:calc(222px + env(safe-area-inset-bottom,0px));width:30px;height:30px;border-radius:50%;z-index:9;display:none;place-items:center;padding:0;border:0;color:var(--ink-dim);
  -webkit-tap-highlight-color:transparent;}
#throwx svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;}
#throwx.on{display:grid;}
body.popped #throwb, body.popped #throwx{display:none !important;}

#b-bal[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);}
body.aimon canvas{cursor:crosshair;}
#hint.off{opacity:0;}
body.making #hint{display:none;}

/* ---- name tags and speech, laid over the 3D ---- */
#tags{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden;}
.av{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;transform-origin:50% 100%;will-change:transform;}
.av.dim{opacity:.5;}
.tg{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.9);font-size:12px;font-weight:600;color:#25231c;white-space:nowrap;
  box-shadow:0 6px 16px -8px rgba(0,0,0,.4);}
.tg .me{display:none;width:19px;height:19px;margin-left:-6px;border-radius:50%;background:var(--chip-on);color:#fff;font-size:10px;font-weight:600;place-items:center;}
.av.mine .tg .me{display:grid;}
.tg .kg{font-size:10px;font-weight:700;line-height:1;padding:3px 7px 3px 6px;border-radius:999px;background:linear-gradient(135deg,#ffe98a,#f3b23a);color:#5b3a00;box-shadow:inset 0 0 0 1px rgba(150,95,0,.25);white-space:nowrap;} .tg .kg:empty{display:none;}
.av.mine .tg .kg{margin-left:-2px;}
.tg .pz{font-size:13px;line-height:1;margin:0 -4px 0 -2px;} .tg .pz:empty{display:none;}
.bb{max-width:210px;padding:8px 12px;border-radius:14px;background:#fff;color:#1d1c17;font-size:12.5px;font-weight:500;line-height:1.4;text-align:center;white-space:normal;
  box-shadow:0 10px 24px -12px rgba(0,0,0,.45);position:relative;opacity:0;transform:translateY(6px) scale(.96);transition:opacity .25s, transform .25s;}
.bb.on{opacity:1;transform:none;}
.bb::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0;}
.emo{position:absolute;bottom:100%;font-size:24px;opacity:0;}
.emo.go{animation:emo 1.8s ease-out forwards;}
@keyframes emo{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}
.seat{position:absolute;left:0;top:0;width:52px;height:30px;padding:0;border:0;background:none;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;will-change:transform;}
.seat::before{content:"";position:absolute;left:9px;top:8px;width:30px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.96);background:rgba(255,255,255,.3);
  box-shadow:0 0 12px rgba(255,255,255,.75);animation:seatP 1.7s ease-in-out infinite;}
.seat:hover::before{background:rgba(255,255,255,.6);}
@keyframes seatP{50%{transform:scale(1.14);opacity:.7;}}
#sitb{position:absolute;left:0;top:0;display:none;align-items:center;gap:7px;padding:8px 14px 8px 12px;border:0;border-radius:999px;background:rgba(255,255,255,.94);color:#25231c;
  font:600 12.5px/1 inherit;font-family:inherit;white-space:nowrap;box-shadow:0 8px 20px -8px rgba(0,0,0,.45);pointer-events:auto;cursor:pointer;will-change:transform;}
#sitb.on{display:flex;}
#vendb, #snowb, #treeb, #fireb{position:absolute;left:0;top:0;display:none;align-items:center;gap:7px;padding:8px 14px 8px 11px;border:0;border-radius:999px;background:rgba(255,255,255,.94);color:#25231c;
  font:600 12.5px/1 inherit;font-family:inherit;white-space:nowrap;box-shadow:0 8px 20px -8px rgba(0,0,0,.45);pointer-events:auto;cursor:pointer;will-change:transform;}
#vendb.on, #snowb.on, #treeb.on, #fireb.on{display:flex;} #vendb:hover, #snowb:hover, #treeb:hover, #fireb:hover{background:#fff;} #vendb .vi, #snowb .vi, #treeb .vi, #fireb .vi{font-size:14px;line-height:1;}
#vendb kbd, #snowb kbd, #treeb kbd, #fireb kbd{font:600 10px/1 "JetBrains Mono",monospace;padding:3px 5px;border-radius:5px;background:rgba(37,35,28,.09);color:#5a5648;}
@media (hover:none){ #vendb kbd, #snowb kbd, #treeb kbd, #fireb kbd{display:none;} }
.av.ghost .tg{opacity:.42;}
/* the beer: a warm blush round the picture's edge (opacity set from the script, only while it lasts) */
#tipsy{position:fixed;inset:0;z-index:3;pointer-events:none;display:none;opacity:0;background:radial-gradient(ellipse 72% 68% at 50% 48%, transparent 48%, rgba(255,160,118,.5) 100%);}
#petalc, #nutc{position:fixed;right:20px;top:calc(112px + env(safe-area-inset-top,0px));z-index:9;display:none;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
#petalc.on, #nutc.on{display:block;} @media (max-width:760px){ #petalc, #nutc{right:auto;left:10px;top:calc(100px + env(safe-area-inset-top,0px));} body.embedded #petalc, body.embedded #nutc{top:calc(108px + env(safe-area-inset-top,0px));} }
body.rk-on #petalc, body.rk-on #nutc{display:none !important;}
/* the drink you are on: top right, a ring that runs down, × to stop */
#drinkfx{position:fixed;right:20px;top:calc(62px + env(safe-area-inset-top,0px));z-index:9;display:none;align-items:center;gap:10px;padding:6px 6px 6px 7px;border-radius:999px;max-width:min(300px,calc(100% - 20px));}
body.in:not(.making) #drinkfx.on{display:flex;animation:dfxIn .35s cubic-bezier(.2,.9,.3,1.25);}
@keyframes dfxIn{from{opacity:0;transform:translateY(-6px) scale(.94);}to{opacity:1;transform:none;}}
#drinkfx .dc{position:relative;width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--dc,#ffd34d);font-style:normal;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
#drinkfx .dc b{font-size:17px;line-height:1;}
#drinkfx .dc svg{position:absolute;left:-3px;top:-3px;width:42px;height:42px;transform:rotate(-90deg);fill:none;stroke:#16150f;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:103.7;stroke-dashoffset:0;opacity:0;}
#drinkfx.run .dc svg{opacity:.7;animation:dfxT var(--dur,15s) linear forwards;}
@keyframes dfxT{to{stroke-dashoffset:103.7;}}
#drinkfx .dt{display:flex;flex-direction:column;gap:2px;min-width:0;}
#drinkfx .dt b{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;}
#drinkfx .dt small{font-size:11px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
#dfx-x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(22,21,15,.07);transition:background .2s;}
#dfx-x:hover{background:rgba(22,21,15,.14);}
#dfx-x svg, #vend-x svg{width:14px;height:14px;fill:none;stroke:var(--ink-dim);stroke-width:2;stroke-linecap:round;}
@media (max-width:760px){ #drinkfx{right:10px;top:calc(100px + env(safe-area-inset-top,0px));gap:6px;} #drinkfx .dt{display:none;} }
body.embedded #drinkfx{top:calc(66px + env(safe-area-inset-top,0px));}
@media (max-width:760px){ body.embedded #drinkfx{top:calc(108px + env(safe-area-inset-top,0px));} }
/* what you hold, in summer: the sparkler's seconds or the net's catch */
#itemfx{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:9;display:none;align-items:center;gap:9px;padding:6px 6px 6px 7px;border-radius:999px;max-width:min(360px,calc(100% - 20px));}
body.in:not(.making) #itemfx.on{display:flex;animation:dfxIn .35s cubic-bezier(.2,.9,.3,1.25);}
#itemfx .ic{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--ic,#ffd34d);font-style:normal;font-size:16px;line-height:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
#itemfx .dt{display:flex;flex-direction:column;gap:2px;min-width:0;}
#itemfx .dt b{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;}
#itemfx .dt small{font-size:11px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
#it-sw{display:none;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--chip-on);color:var(--chip-on-ink);font-size:12.5px;font-weight:600;flex:none;transition:transform .12s;}
#it-sw:active{transform:scale(.94);} #itemfx.net #it-sw{display:flex;}
#itemfx.ready #it-sw{animation:swRdy 1s ease-in-out infinite;}
/* phones: the swing (or let-go) as a big round button under the right thumb */
#actb{position:fixed;right:14px;bottom:calc(168px + env(safe-area-inset-bottom,0px));width:80px;height:80px;border-radius:50%;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;padding:0;
  background:rgba(255,255,255,.94);box-shadow:0 10px 26px -10px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.06);-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .1s;}
body.in:not(.making):not(.popped) #actb.on{display:flex;} #actb:active, #actb.hit{transform:scale(.9);}
#actb .ai{font-size:28px;line-height:1;} #actb .al{font-size:11.5px;font-weight:700;color:#25231c;letter-spacing:-.01em;}
#actb.ready{animation:swRdy 1s ease-in-out infinite;} body.night #actb{background:rgba(250,248,240,.92);}
@media (pointer:fine){ #actb{display:none !important;} }
#throwb.on ~ #actb{right:104px;}                                                                       /* side by side with the throw button */
@media (pointer:coarse){ #itemfx.net #it-sw{display:none;} } @keyframes swRdy{50%{box-shadow:0 0 0 5px rgba(255,196,80,.45);}}
#it-sw kbd{font:600 10px/1 "JetBrains Mono",monospace;padding:3px 5px;border-radius:5px;background:rgba(255,255,255,.2);}
#it-x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(22,21,15,.07);transition:background .2s;} #it-x:hover{background:rgba(22,21,15,.14);}
#it-x svg{width:14px;height:14px;fill:none;stroke:var(--ink-dim);stroke-width:2;stroke-linecap:round;}
@media (hover:none){ #it-sw kbd{display:none;} }
@media (max-width:760px){ #itemfx{right:10px;bottom:auto;top:calc(160px + env(safe-area-inset-top,0px));} body.embedded #itemfx{top:calc(166px + env(safe-area-inset-top,0px));} #it-sw{height:38px;padding:0 16px;} }
#pop-dex{width:min(380px,calc(100% - 20px));padding:12px 10px 10px;}
#pop-dex .vh{display:flex;align-items:center;gap:8px;margin:0 4px 3px;} #pop-dex .vh b{flex:1;font:600 14.5px/1.3 var(--serif);color:var(--ink);}
#dex-x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(22,21,15,.07);} #dex-x svg{width:13px;height:13px;fill:none;stroke:var(--ink-dim);stroke-width:2;stroke-linecap:round;}
#pop-dex .vs{margin:0 4px 8px;font-size:11.5px;line-height:1.45;color:var(--ink-dim);}
#dex-g{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.dx{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:12px;background:rgba(22,21,15,.04);min-width:0;}
.dx i{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:50%;background:rgba(22,21,15,.07);font-style:normal;font-size:15px;font-weight:700;color:var(--ink-faint);}
.dx.got i{background:#ffe9a8;color:inherit;} .dx span{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.dx b{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .dx:not(.got) b{color:var(--ink-faint);}
.dx small{font-size:10.5px;line-height:1.3;color:var(--ink-dim);} .dx em{font:500 10px/1 "JetBrains Mono",monospace;font-style:normal;color:var(--ink-dim);}

<script>
"use strict";
/* ==========================================================================
   0. BASICS

const LANG = (() => {

})();
document.documentElement.lang = LANG;
if (LANG === "ko") document.title = "수영장 — Living Art Museum";
const T = (o) => (o && (o[LANG] ?? o.en)) || "";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const rand = (a, b) => a + Math.random() * (b - a), pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const PHONE = () => matchMedia("(max-width:760px)").matches;
const TOUCH = matchMedia("(pointer:coarse)").matches;

/* ==========================================================================
   1. THE PLACE — a courtyard, the pool in the middle, stairs down to the room
      under the water (metres; y up; the water is at y = 0)
   ========================================================================== */
const FLOOR = -2.8, CXW = 19, CZW = 15;               /* the room's floor, the courtyard's half-size */
const PX = 8, PZ = 5.5;                               /* the pool's half-size: 16 × 11 m */
const HOLE = { x0:PX + 1.6, x1:PX + 4.6, z0:-4.0, z1:3.0 };   /* the stairwell, east of the pool: 3 m wide */
const SZ0 = -1.5, RUN = 4.5, NSTEP = 16;              /* sixteen steps from the landing up to the deck */
const RAD = .27;                                      /* how close a body may come to a wall */
const stairY = (z) => clamp(-2.8 + (z - SZ0) / RUN * 2.8 + .085, -2.8, 0);
const inR = (x, z, x0, x1, z0, z1) => x > x0 && x < x1 && z > z0 && z < z1;
const onStairs = (x, z) => inR(x, z, HOLE.x0 + RAD, HOLE.x1 - RAD, SZ0, HOLE.z1);
const inPoolRoom = (x, z) => inR(x, z, -PX, PX, -PZ, PZ);
/* where a body at (x, z), now at height y, would stand — or null where it cannot go */
function floorAt(x, z, y){
  if (onStairs(x, z)){ const f = stairY(z); return Math.abs(f - y) < .62 ? f : null; }
  const low = Math.abs(y - FLOOR) < .62;
  if (low && inR(x, z, HOLE.x0 + RAD, HOLE.x1 - RAD, HOLE.z0 + RAD, SZ0 + .01)) return FLOOR;                /* the landing */
  if (low && inR(x, z, PX - .45, HOLE.x0 + RAD + .02, HOLE.z0 + RAD, SZ0 - RAD)) return FLOOR;               /* the corridor, through the door */
  if (low && inR(x, z, -PX + RAD, PX - RAD, -PZ + RAD, PZ - RAD)) return FLOOR;                               /* the room under the water */
  if (Math.abs(y) < .62 && inR(x, z, -CXW + RAD, CXW - RAD, -CZW + RAD, CZW - RAD)
      && !inR(x, z, -PX - .08, PX + .08, -PZ - .08, PZ + .08)                                                 /* not on the water */
      && !inR(x, z, HOLE.x0 - RAD, HOLE.x1 + RAD, HOLE.z0 - RAD, HOLE.z1)) return 0;                          /* not in the stairwell */
  return null;
}
const zoneOf = (x, y, z) => onStairs(x, z) && y > FLOOR + .15 && y < -.05 ? "stairs" : y < -1.4 ? (inPoolRoom(x, z) ? "below" : "hall") : "above";
const TREES = [[-CXW + 1.8, -CZW + 1.8], [CXW - 1.8, -CZW + 1.8], [-CXW + 1.8, CZW - 1.8], [CXW - 1.6, CZW - 1.6], [-CXW + 1.8, 0], [CXW - 1.8, -6], [-7.5, -CZW + 1.8], [7.5, CZW - 1.8]];
const BENCHES = [[-4.5, PZ + 4.6, true], [4.5, PZ + 4.6, true], [-3, -PZ - 4.4, true], [4, -PZ - 4.4, true], [-PX - 4.6, 2.5, false], [HOLE.x1 + 3.4, -6, false]];
const SEATS = BENCHES.flatMap(([x, z, ax], b) => [-.6, 0, .6].map(o => ({ b, x:ax ? x + o : x, z:ax ? z : z + o, r:ax ? (z > 0 ? Math.PI : 0) : (x < 0 ? Math.PI / 2 : -Math.PI / 2) })));
/* three vending machines: two against the far glass wall, across the pool from where you come in, with a
   little bin between them; one more on the east wall, by the stairs — in the sun (the near wall lies in the
   roof's shadow all day). Each stands with its back to a wall (x, z) and faces F */
const VW = 1.2, VH = 2.15, VD = .8, VZN = -CZW + .1, VBIN = [0, VZN + .3];
const VENDS = [
  { x:-1.95, z:VZN, F:[0, 1], style:"sport", kinds:["energy", "cider", "lemon", "water"], body:[.95, .96, .97], acc:[.14, .42, .87], sign:[.8, .9, 1], win:[.86, .93, 1], poster:[1, .87, .4], posterB:[.2, .5, .92],
    name:{ en:"Pop & Go", ko:"톡톡 자판기" } },
  { x:1.95, z:VZN, F:[0, 1], style:"classic", kinds:["beer", "milk", "kid", "ghost"], body:[.85, .17, .2], acc:[.88, .15, .2], sign:[1, 1, 1], win:[1, .98, .94], poster:[.99, .98, .96], posterB:[.97, .74, .3],
    name:{ en:"Strange Sips", ko:"요상한 자판기" } },
  { x:CXW - .1, z:6.5, F:[-1, 0], style:"fresh", kinds:["glass", "spicy", "slush", "water"], body:[.99, .9, .68], acc:[.96, .58, .5], sign:[1, .98, .93], win:[1, .98, .93], poster:[.99, .98, .95], posterB:[.42, .64, .78],
    name:{ en:"Wonder Drinks", ko:"신기한 자판기" } }];
VENDS.forEach(v => { const [fx, fz] = v.F; v.R = [fz, -fx]; v.fx = v.x + fx * VD; v.fz = v.z + fz * VD;          /* R: to your right as you face it */
  const xs = [v.x + v.R[0] * VW / 2, v.x - v.R[0] * VW / 2, v.fx + v.R[0] * VW / 2, v.fx - v.R[0] * VW / 2], zs = [v.z + v.R[1] * VW / 2, v.z - v.R[1] * VW / 2, v.fz + v.R[1] * VW / 2, v.fz - v.R[1] * VW / 2];
  v.x0 = Math.min(...xs); v.x1 = Math.max(...xs); v.z0 = Math.min(...zs); v.z1 = Math.max(...zs); });
/* the night lights keep to the walls, well away from the pool, so the work stays as it is: a lamp on each
   glass wall, two to a wall [x, z on the wall, the way into the courtyard], a string of bulbs between them */
const LAMPS = [[-10.5, -CZW, 0, 1], [10.5, -CZW, 0, 1], [-10.5, CZW, 0, -1], [10.5, CZW, 0, -1], [-CXW, -7, 1, 0], [-CXW, 7, 1, 0], [CXW, -10.5, -1, 0], [CXW, -1.5, -1, 0]];
const GARLANDS = [[0, 1], [2, 3], [4, 5], [6, 7]];
const lampAt = (l, out, y) => [l[0] + l[2] * out, y, l[1] + l[3] * out];
const onVend = (x, z, pad) => VENDS.findIndex(v => x > v.x0 - pad && x < v.x1 + pad && z > v.z0 - pad && z < v.z1 + pad);
var FIRE = null, MOON = { k:0 };
const fireOn = () => !!FIRE && SEASON.cur === "autumn";
const vendBlock = (x, z, pad) => (!!FIRE && SEASON.cur === "autumn" && Math.hypot(x - FIRE.x, z - FIRE.z) < .5 + pad) || onVend(x, z, pad) >= 0 || Math.hypot(x - VBIN[0], z - VBIN[1]) < .22 + pad || snowBlock(x, z, pad);
const onBench = (x, z, pad) => BENCHES.findIndex(([bx, bz, ax]) => Math.abs(x - bx) < (ax ? .95 : .24) + pad && Math.abs(z - bz) < (ax ? .24 : .95) + pad);
/* may the camera stand here? it keeps to the same side of the water as you, and out of the trees */
function camOK(x, y, z, below){
  if (y > .3) for (const [tx, tz] of TREES) if (Math.hypot(x - tx, z - tz) < (y > 1.6 ? 1.5 : .8)) return false;
  if (y < 2.15 && onVend(x, z, .15) >= 0) return false;                                                      /* not inside a vending machine */
  if (y < 1.9 && snowBlock(x, z, .25)) return false;                                                           /* nor inside a snowman */
  if (inR(x, z, HOLE.x0 + .06, HOLE.x1 - .06, HOLE.z0 + .06, HOLE.z1 - .02) && y > FLOOR + .15) return true;   /* the open stairwell */
  if (!below) return y > .2 && y < 14 && inR(x, z, -CXW + .2, CXW - .2, -CZW + .2, CZW - .2) && (y < 3.5 || inR(x, z, -CXW + .75, CXW - .75, -CZW + .75, CZW - .75));   /* not in the roof edge */
  if (y > FLOOR + .12 && y < -.1 && inR(x, z, -PX + .1, PX - .1, -PZ + .1, PZ - .1)) return true;
  if (y > FLOOR + .12 && y < -.35 && inR(x, z, PX - .2, HOLE.x1 - .05, HOLE.z0 + .05, SZ0 - .05)) return true;

}

   { en:"Day and night take turns every three minutes, the same for everyone here. At night the lamps and strings of bulbs along the walls and the vending machines light up, and the water glows softly — the count at the top shows how long till it turns", ko:"3분마다 낮과 밤이 바뀌어요(모든 방문자가 같은 시간). 밤에는 벽을 따라 벽등과 줄 전구, 자판기 불빛이 켜지고 수영장 물빛이 은은하게 빛나요 — 위쪽 표시에서 바뀔 때까지 남은 시간을 볼 수 있어요" },
   { en:"Seasons: tap the sun or moon at the top to pick spring, summer, autumn or winter — it changes for everyone on the server. Spring brings cherry petals, summer cicadas (and fireflies at night), autumn falling leaves; walk up to a tree and it lets go of a handful. In winter it snows, footprints stay in it, and the pool freezes: walk onto the ice and ski", ko:"계절: 위쪽 해·달 표시를 누르면 봄·여름·가을·겨울을 고를 수 있어요 — 바꾸면 서버의 모두에게 함께 바뀌어요. 봄엔 벚꽃잎, 여름엔 매미 소리(밤엔 반딧불), 가을엔 낙엽이 날리고, 나무에 다가가면 우수수 떨어져요. 겨울엔 눈이 내려 발자국이 남고, 수영장이 얼어 얼음 위에서 스키를 탈 수 있어요" },
   { en:"Spring rain: now and then a shower passes over — the sky greys and rings spread across the pool; pick an umbrella or a raincoat from a vending machine (free in spring) or get soaked; afterwards, by day, a rainbow stands over the far wall and in the water. Everyone shares the same shower", ko:"봄비: 가끔 소나기가 지나가요 — 하늘이 흐려지고 수영장에 빗방울 동그라미가 퍼져요. 봄엔 자판기에서 우산이나 우비를 무료로 고를 수 있어요 — 없으면 비를 맞아요. 비가 그치면 낮에는 건너편 하늘과 물 위에 무지개가 떠요. 모두에게 같은 비가 내려요" },
   { en:"Spring: walk through fallen petals and they come to you — thirty make a crown of blossom that everyone sees; by day butterflies drift about and settle on the head of anyone who keeps still", ko:"봄: 바닥에 떨어진 꽃잎 위를 걸으면 꽃잎이 모여요 — 30장을 모으면 벚꽃 화관이 생기고 다른 사람에게도 보여요. 낮에는 나비가 날아다니다 가만히 있는 사람 머리에 앉아요" },
   { en:"Autumn nights: a bonfire burns on the deck — bring chestnuts and roast them (E) until they pop. Five roasted chestnuts and five acorns trade for a sky lantern at a vending machine: make a wish and let it float up (everyone sees it). The moon is full and gold; a wish coin thrown by its light draws a moonbeam down onto it. And once a night a moon rabbit comes down on a moonbeam and hops round the pool's edge — meet it for the moon's blessing. Everyone sees the same rabbit", ko:"가을 밤: 데크에 모닥불이 타요 — 밤을 가져와 구우면(E) 탁! 하고 군밤이 돼요. 군밤 5개와 도토리 5개를 모으면 자판기에서 풍등으로 바꿔, 소원을 빌며 하늘로 날려 보낼 수 있어요(모두에게 보여요). 밤하늘엔 커다란 금빛 보름달이 뜨고, 달빛에 소원 동전을 던지면 달빛 기둥이 내려와요. 그리고 밤마다 한 번, 달토끼가 달빛을 타고 내려와 수영장 가장자리를 뛰어다녀요 — 만나면 달님의 축복이 반짝여요. 모두에게 같은 달토끼가 보여요" },
   { en:"The seasons on you: in summer running wears you out — you sweat and pant and can only walk until you rest (quicker in a tree's shade, at once with water or a slush); in winter your breath shows as you talk", ko:"계절이 몸으로: 여름에 계속 뛰면 더워서 땀을 흘리고 헥헥거리며 걷기만 할 수 있어요 — 쉬면 회복(나무 그늘이면 더 빨리, 생수·슬러시는 바로). 겨울엔 말할 때 입김이 나와요" },
   { en:"Autumn: fallen leaves crunch underfoot and fly up as you walk, gusts of wind sweep them across the deck; jump (Space) into a pile of leaves and it bursts all over — anyone's jump does it. Walk up to a tree and shake it (E, or the button): leaves pour down and acorns and chestnuts drop; walk over them to pick them up", ko:"가을: 바닥의 낙엽을 밟으면 바스락 소리와 함께 흩날리고, 가끔 바람이 불어 낙엽을 쓸고 가요. 낙엽 더미에 점프(Space)하면 와사삭 흩날려요 — 다른 사람이 뛰어들어도 함께 보여요. 나무 앞에서 흔들면(E 또는 버튼) 낙엽이 쏟아지고 도토리와 밤이 떨어져요 — 위로 걸어가면 주워요" },
   { en:"Summer: the vending machines give out a sparkler and a bug net, free. The sparkler sparks for forty seconds and harder beside a friend's; swing the net (F) at eight kinds of insect — on the trees, in the air, on the benches, by the planters, on the water — each is counted, then let go; catch every kind for a 🐛 Bug King badge before your name. At night, now and then, fireworks open over the far wall, the same for everyone", ko:"여름: 자판기에서 스파클라와 잠자리채를 무료로 받아요. 스파클라는 40초 동안 반짝이고, 친구 스파클라 곁에서는 더 화려해져요. 잠자리채를 휘둘러(F) 나무·공중·벤치·화단·물 위의 곤충 8종을 잡으면 세고 놓아줘요 — 모두 모으면 이름 앞에 🐛 벌레왕 배지가 붙어요. 밤이면 가끔 건너편 하늘에 불꽃놀이가 터져요 — 모두에게 똑같이 보여요" },
   { en:"Talk (Enter), wave, bow, jump, dance or sit — near a bench every free seat shows a ring: click it, or press E, to sit", ko:"말하기(Enter), 손 흔들기·인사·점프·춤·앉기로 만나요 — 벤치 가까이 가면 빈자리에 동그라미가 떠요. 누르거나 E 키로 앉아요" }]
    .forEach(s => { const li = document.createElement("li"); li.textContent = T(s); ol.appendChild(li); });
  const lab = { wave:{ en:"Wave", ko:"손 흔들기" }, bow:{ en:"Bow", ko:"인사" }, jump:{ en:"Jump", ko:"점프" }, dance:{ en:"Dance", ko:"춤" }, sit:{ en:"Sit", ko:"앉기" }, heart:{ en:"Heart", ko:"하트" } };
  document.querySelectorAll("#pop-emo [data-e]").forEach(b => { b.querySelector(".lb").textContent = T(lab[b.dataset.e]); });
  document.querySelectorAll("#pop-emo [data-p]").forEach(b => { b.querySelector(".lb").textContent = T(POSES[b.dataset.p].n); });
  $("pz-t").textContent = T({ en:"Poses — held until you move, sitting too", ko:"포즈 — 움직이기 전까지 유지, 앉아서도 돼요" });
  $("b-say").querySelector(".lb").textContent = T({ en:"Say", ko:"말하기" }); $("b-emo").querySelector(".lb").textContent = T({ en:"Moves", ko:"표현" });
  $("b-me").querySelector(".lb").textContent = T({ en:"Character", ko:"캐릭터" });
  $("b-bal").querySelector(".lb").textContent = T({ en:"Balloon", ko:"물풍선" });
  $("throwb").querySelector(".tl").textContent = T({ en:"Throw", ko:"던지기" }); $("throwx").setAttribute("aria-label", T({ en:"Put the balloon away", ko:"물풍선 끄기" }));
  $("b-wish").querySelector(".lb").textContent = T({ en:"Wish coin", ko:"소원 동전" });
  $("wish-t").textContent = T({ en:"Write a wish, then throw the coin into the pool", ko:"소원을 적고, 동전을 수영장에 던져요" });
  $("wish-i").placeholder = T({ en:"My wish is…", ko:"나의 소원은…" });
  $("wish-pl").textContent = T({ en:"Only me (private)", ko:"나만 보기 (비공개)" });
  $("wish-go").textContent = T({ en:"Throw the coin", ko:"동전 던지기" });
  $("rank-t").textContent = T(innerWidth < 760 ? { en:"Ranking", ko:"랭킹" } : { en:"Coin toss ranking", ko:"동전 던지기 랭킹" }); renderRank();
  $("wish-n").textContent = T(WISH_NOTE);
  $("say-i").placeholder = T({ en:"Say something…", ko:"말하기…" }); $("say-b").setAttribute("aria-label", T({ en:"Send", ko:"보내기" }));
  $("snd").title = T({ en:"Sound", ko:"소리" }); $("info").title = T({ en:"About the work", ko:"작품 설명" }); $("jump").setAttribute("aria-label", T({ en:"Jump", ko:"점프" }));
}
document.body.classList.add("making");
layout();
if (!initGL()){
  document.body.innerHTML = `<p style="padding:40px;font:14px Inter,sans-serif">${T({ en:"This room needs WebGL.", ko:"이 공간은 WebGL이 필요해요." })}</p>`;
} else {
  about(); siteLight(true);
  me.mesh = meshFor(me.look);
  me.x = 0; me.z = PZ + .62; me.y = 0; me.r = 0; camPos = [0, 1.3, PZ + 4]; camTgt = [0, .8, PZ];
  makeNpcs(); buildPanel();
  requestAnimationFrame(frame);
  netInit();
}
["pointerdown", "keydown", "touchstart"].forEach(ev => window.addEventListener(ev, () => AUD.unlock(), { capture:true, passive:true }));
window.__pool = { LANS, FIRE:() => FIRE, MOON, RAB, MOONW, moonWish, RAIN, rainWindow, CROWN, BFLY, POSES, SUM, BUG, ITEMS, BUGK, FW, AUT, PILES, NUTS, fw(ty, age){ const k = Math.floor(Date.now() / FWS); fwPlan(k).push({ t:Date.now() - 1200 - (age || 0) * 1000, x:(Math.random() - .5) * 16, z:-CZW - 14, y:17, R:5.5, c:0, c2:2, ty:ty || 0, rot:0, l:1, s:0 }); }, SNB, SNM, makeSnowman, night(k){ NIGHT.force = k; }, season(s){ setSeason(s, Date.now(), null); }, SEASON, faceOf, AUD, buyDrink, openVend, endDrink, setCalm, DRINKS, VENDS, handAt, pose, walk(ix, iz, secs){ joy.on = true; joy.x = ix; joy.y = -iz; for (let i = 0; i < secs * 60; i++) moveMe(1 / 60); joy.on = false; joy.x = joy.y = 0; }, me, PEERS, NET, NPCS, enter, onPeerList, myState, emote, say, view, cam:() => ({ camPos, camTgt }), floorAt, zoneOf, look(k){ me.look = lookFrom(k); applyLook(); } };
</script>
