<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Man Who Flew into Space — Living Art Museum</title>
<meta name="description" content="A dark room in a communal apartment, drawn in dots. Examine the posters, the plans, the bed, the shoes, the straps and the hole in the ceiling until the story comes together — then pull the strap and fly out through the roof. After Ilya Kabakov's installation (1985), from the Living Art Museum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--serif:Fraunces,"Noto Serif KR",Georgia,serif;}
html[lang="ko"]{--serif:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;}
/* ==========================================================================
   THE MAN WHO FLEW INTO SPACE FROM HIS APARTMENT — after Ilya Kabakov (1985).
   One room of a Moscow communal apartment, seen in the dark as a field of
   dots. Six things in it tell what happened here. Examine them one by one
   and the story comes together; then take the strap and follow him.
   ========================================================================== */
:root{
  --ink:#efeae0; --ink-dim:rgba(239,234,224,.68); --ink-faint:rgba(239,234,224,.42);
  --glass-a:rgba(255,255,255,.11); --glass-b:rgba(255,255,255,.045); --glass-line:rgba(255,255,255,.14);
  --chip-on:rgba(255,255,255,.92); --chip-on-ink:#0b0b0d; --accent:#e0533a; --gold:#e8c46a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#050608;color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px;}
.glass{background:linear-gradient(180deg,var(--glass-a),var(--glass-b));backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid var(--glass-line);box-shadow:0 24px 60px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08);}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
body.hover #cv{cursor:pointer;} body.pulling #cv{cursor:grabbing;} body.grab #cv{cursor:grab;}

.top{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:20px;z-index:10;display:flex;align-items:center;gap:14px;pointer-events:none;}
.top > *{pointer-events:auto;}
.logo{font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1;white-space:nowrap;text-decoration:none;color:var(--ink);}
.title{margin-left:auto;text-align:right;max-width:52vw;}
.title h1{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25;}
.title p{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
body.embedded .top{display:none;}

#bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:4px;padding:6px;border-radius:20px;max-width:calc(100% - 20px);transition:opacity .5s;}
body.flying #bar{opacity:0;pointer-events:none;}
.chip{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:14px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;transition:background .2s,color .2s;}
.chip svg{width:18px;height:18px;flex:none;}
.chip:hover{color:var(--ink);background:rgba(255,255,255,.08);}
.chip[aria-pressed="true"],.chip.hot{background:var(--chip-on);color:var(--chip-on-ink);}
.chip.ic{padding:9px 10px;}
.chip .n{font-family:"JetBrains Mono",monospace;font-size:11px;opacity:.75;}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--glass-line);}
#snd[aria-pressed="false"] .on, #snd[aria-pressed="true"] .off{display:none;}
.ico{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
#case.ready{background:var(--gold);color:#1a1408;}
#hint{position:fixed;left:50%;top:var(--hint-y,90px);transform:translate(-50%,-50%);z-index:11;padding:9px 15px;border-radius:999px;font-size:12.5px;color:var(--ink);white-space:nowrap;pointer-events:none;transition:opacity .5s;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;}
#hint.off{opacity:0;}

/* a clue, examined */
#clue{position:fixed;right:20px;top:50%;transform:translateY(-50%);width:360px;z-index:20;border-radius:22px;padding:20px 20px 16px;display:none;}
body.clue #clue{display:block;animation:rise .35s ease-out;}
@keyframes rise{from{opacity:0;transform:translateY(calc(-50% + 12px));}to{opacity:1;transform:translateY(-50%);}}
#clue .k{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);}
#clue h2{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.25;margin-top:8px;}
#clue p{font-size:13px;line-height:1.7;color:var(--ink-dim);margin-top:10px;}
#clue .added{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--glass-line);font-size:11.5px;color:var(--ink-faint);}
#clue .added b{color:var(--ink);font-weight:600;}
#clue .row{display:flex;gap:6px;margin-top:12px;}
#clue .row .chip{flex:1;justify-content:center;border:1px solid var(--glass-line);}
html[lang="ko"] #clue .k{letter-spacing:.04em;}

/* the case file: the story so far */
#file{position:fixed;left:20px;top:calc(76px + env(safe-area-inset-top,0px));width:360px;max-height:calc(100% - 170px);overflow:auto;z-index:19;border-radius:22px;padding:20px;display:none;}
body.file #file{display:block;}
body.embedded #file{top:calc(70px + env(safe-area-inset-top,0px));}
#file .k{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
#file h2{font-family:var(--serif);font-size:19px;font-weight:600;margin-top:6px;padding-right:24px;}
#file ol{list-style:none;margin-top:12px;}
#file li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--glass-line);font-size:12.5px;line-height:1.6;color:var(--ink-dim);}
#file li .no{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:10px;border:1px solid var(--glass-line);color:var(--ink-faint);margin-top:1px;}
#file li.got .no{background:var(--gold);color:#1a1408;border-color:transparent;}
#file li.miss{color:var(--ink-faint);font-style:italic;}
#file li b{color:var(--ink);font-weight:600;font-style:normal;}
#file .end{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(232,196,106,.14);color:var(--ink);font-size:12.5px;line-height:1.6;display:none;}
#file.done .end{display:block;}
html[lang="ko"] #file .k{letter-spacing:.04em;}
.x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim);}
.x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;}

#about{position:fixed;right:20px;top:calc(76px + env(safe-area-inset-top,0px));width:350px;max-height:calc(100% - 170px);overflow:auto;z-index:21;border-radius:22px;padding:20px 20px 18px;display:none;}
body.about #about{display:block;}
#about .tag{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
#about h2{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25;margin-top:8px;padding-right:24px;}
#about p{font-size:12.5px;line-height:1.65;color:var(--ink-dim);margin-top:9px;}
#about h3{font-size:12px;font-weight:600;margin-top:16px;padding-top:14px;border-top:1px solid var(--glass-line);}
#about ol{margin:8px 0 0 18px;font-size:12.5px;line-height:1.6;color:var(--ink-dim);}
html[lang="ko"] #about .tag{letter-spacing:.04em;}

/* after the flight */
#end{position:fixed;inset:0;z-index:25;display:none;place-items:center;pointer-events:none;}
body.ended #end{display:grid;}
#end .box{text-align:center;max-width:min(520px,calc(100% - 40px));pointer-events:auto;animation:fade 1.6s ease-out;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
#end p{font-family:var(--serif);font-size:clamp(18px,2.6vw,26px);line-height:1.45;color:var(--ink);text-shadow:0 2px 20px rgba(0,0,0,.8);}
#end small{display:block;margin-top:12px;font-size:12.5px;color:var(--ink-dim);}
#end button{margin-top:22px;padding:11px 18px;border-radius:14px;font-size:13px;}

@media (max-width:760px){
  .chip{padding:8px 10px;font-size:11.5px;gap:5px;} #bar .chip .lb{display:none;}
  #hint{white-space:normal;text-align:center;border-radius:18px;width:max-content;line-height:1.45;}
  #clue{left:10px;right:10px;width:auto;top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:none;max-height:56vh;overflow:auto;}
  body.clue #clue{animation:none;}
  #file,#about{left:10px;right:10px;width:auto;top:calc(64px + env(safe-area-inset-top,0px));}
  .title p{display:none;} .title h1{font-size:13px;}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important;} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<header class="top">
  <a class="logo" href="#" onclick="return false">Living Art Museum</a>
  <div class="title"><h1 id="t-h"></h1><p id="t-p"></p></div>
</header>
<div id="hint" class="glass off"></div>

<nav id="bar" class="glass">
  <button class="chip" id="case"><svg class="ico" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h5"/></svg><span class="lb"></span><span class="n" id="case-n">0/6</span></button>
  <span class="sep"></span>
  <button class="chip ic" id="snd" aria-pressed="true"><svg class="ico on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg><svg class="ico off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
  <button class="chip ic" id="info"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</nav>

<section id="clue" class="glass" aria-live="polite">
  <div class="k" id="cl-k"></div>
  <h2 id="cl-h"></h2>
  <p id="cl-p"></p>
  <div class="added" id="cl-a"></div>
  <div class="row"><button class="chip" id="cl-file"></button><button class="chip hot" id="cl-go"></button></div>
</section>

<section id="file" class="glass" aria-labelledby="f-h">
  <button class="x" id="file-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="k" id="f-k"></div>
  <h2 id="f-h"></h2>
  <ol id="f-ol"></ol>
  <div class="end" id="f-end"></div>
</section>

<section id="about" class="glass" aria-labelledby="ab-h">
  <button class="x" id="about-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="tag" id="ab-tag"></div>
  <h2 id="ab-h"></h2>
  <p id="ab-p1"></p>
  <p id="ab-p2"></p>
  <h3 id="ab-h3"></h3>
  <ol id="ab-ol"></ol>
</section>

<section id="end"><div class="box"><p id="e-p"></p><small id="e-s"></small><button class="glass" id="e-b"></button></div></section>

<script>
"use strict";
/* ==========================================================================
   0. BASICS
   ========================================================================== */
const LANG = (() => {
  let l = (document.documentElement.lang || "en").slice(0, 2);
  try { const q = new URLSearchParams(location.search).get("lang"); if (q) l = q; } catch (_){}
  return l === "ko" ? "ko" : "en";
})();
document.documentElement.lang = LANG;
if (LANG === "ko") document.title = "자기 아파트에서 우주로 날아간 남자 — Living Art Museum";
const T = (o) => (o && (o[LANG] ?? o.en)) || "";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const ease = (x) => { x = clamp(x, 0, 1); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const mkC = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
let seed = 1985; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ==========================================================================
   1. THE STORY — six things in the room, and what each one tells
   ========================================================================== */
const CLUES = {
  posters:{ order:1, name:{ en:"The posters", ko:"포스터" },
    text:{ en:"Every inch of the walls is covered with posters: rockets, cheering workers, red stars — all of them pointing up. Day after day the man who lived here looked at nothing else. The posters promised a bright future somewhere above, and he took them at their word.",
           ko:"벽 한 뼘 남김없이 포스터가 붙어 있어요. 로켓, 환호하는 노동자, 붉은 별 — 모두 위를 가리켜요. 이 방에 살던 남자는 날마다 이것만 바라봤어요. 포스터는 저 위 어딘가에 빛나는 미래가 있다고 약속했고, 그는 그 말을 그대로 믿었어요." },
    line:{ en:"He lived among posters that all pointed upward, and believed them.", ko:"그는 모두 위를 가리키는 포스터 속에 살았고, 그 약속을 믿었어요." } },
  plans:{ order:2, name:{ en:"The plans", ko:"설계도" },
    text:{ en:"Pinned to the wall: his plans. A cross-section of the building, a curve that leaves the roof and keeps on rising, figures in a careful hand. He believed that streams of energy flowed high above the city, and that a man thrown hard enough could catch one and ride it out into space.",
           ko:"벽에 그의 설계도가 꽂혀 있어요. 건물 단면도, 지붕을 떠나 계속 솟아오르는 곡선, 꼼꼼한 글씨의 숫자들. 그는 도시 높이 에너지의 흐름이 지나간다고 믿었어요. 충분히 세게 던져진 사람이라면 그 흐름을 타고 우주까지 갈 수 있다고요." },
    line:{ en:"He drew the way out: up from the roof, on the streams of energy above the city.", ko:"그는 길을 그렸어요. 지붕 위로, 도시 위를 흐르는 에너지를 타고." } },
  bed:{ order:3, name:{ en:"The bed", ko:"침대" },
    text:{ en:"A narrow cot, the blanket thrown back. This was one room of a communal apartment, shared with strangers all along the corridor. The neighbours remembered him as quiet — and remembered the sounds from his room at night: sawing, hammering, something being stretched.",
           ko:"좁은 간이침대, 이불이 젖혀져 있어요. 이곳은 복도를 따라 낯선 이웃들과 함께 쓰던 공동 아파트의 방 한 칸이었어요. 이웃들은 그를 조용한 사람으로 기억했어요. 그리고 밤마다 그 방에서 들려오던 소리도요 — 톱질, 망치질, 무언가를 팽팽히 당기는 소리." },
    line:{ en:"Night after night, in one shared-apartment room, he worked on it.", ko:"공동 아파트의 방 한 칸에서, 그는 밤마다 그것을 만들었어요." } },
  strap:{ order:4, name:{ en:"The seat and the strap", ko:"발사대와 끈" },
    text:{ en:"In the middle of the room hangs a seat, tied with heavy elastic bands to the corners of the ceiling, and under it a strap to pull it down. It is a catapult. Stretched far enough and let go, the bands would throw whoever sat in it straight up.",
           ko:"방 한가운데 의자가 매달려 있어요. 굵은 고무줄이 천장 모서리마다 묶여 있고, 아래에는 잡아당기는 끈이 달려 있어요. 투석기예요. 충분히 당겼다가 놓으면 고무줄이 앉은 사람을 곧장 위로 쏘아 올려요." },
    line:{ en:"He built a catapult: a seat on elastic bands, and a strap to pull it down.", ko:"그는 투석기를 만들었어요. 고무줄에 매단 의자와, 그것을 당기는 끈." } },
  shoes:{ order:5, name:{ en:"The shoes", ko:"신발" },
    text:{ en:"His shoes, left side by side on the floor, the laces still tied. He did not take them with him. Wherever he was going, he would not need to walk.",
           ko:"그의 신발이 바닥에 나란히 놓여 있어요. 끈은 아직 묶인 채예요. 그는 신발을 두고 갔어요. 그가 가는 곳에서는 걸을 필요가 없었으니까요." },
    line:{ en:"That night he took off his shoes and sat down in the seat.", ko:"그날 밤 그는 신발을 벗고 의자에 앉았어요." } },
  hole:{ order:6, name:{ en:"The hole in the ceiling", ko:"천장의 구멍" },
    text:{ en:"Above the seat the ceiling is torn open — plaster and laths broken outward, and beyond them the roof, and the night sky. In the morning the neighbours found the room empty and this hole. They searched for him. He was never found.",
           ko:"의자 바로 위 천장이 뚫려 있어요. 석고와 나무 졸대가 바깥쪽으로 부서졌고, 그 너머로 지붕과 밤하늘이 보여요. 아침에 이웃들이 텅 빈 방과 이 구멍을 발견했어요. 그를 찾았지만, 끝내 찾지 못했어요." },
    line:{ en:"In the morning: an empty room, and a hole through the ceiling to the sky.", ko:"아침에 남은 것은 텅 빈 방, 그리고 하늘로 뚫린 천장의 구멍." } },
};
const IDS = Object.keys(CLUES).sort((a, b) => CLUES[a].order - CLUES[b].order);
const found = new Set();
const allFound = () => found.size === IDS.length;

/* ==========================================================================
   2. THE ROOM — drawn in plain shapes on a small canvas, which the screen
      then shows as dots: each dot as big as that spot is bright.
      Design space: 800 × 500, one-point perspective.
   ========================================================================== */
const DW = 800, DH = 500;
const Q = { back:[[250, 110], [550, 110], [550, 330], [250, 330]], left:[[0, 0], [250, 110], [250, 330], [0, 500]],
            right:[[550, 110], [800, 0], [800, 500], [550, 330]], ceil:[[0, 0], [800, 0], [550, 110], [250, 110]], floor:[[250, 330], [550, 330], [800, 500], [0, 500]] };
const bil = (q, u, v) => { const t = [lerp(q[0][0], q[1][0], u), lerp(q[0][1], q[1][1], u)], b = [lerp(q[3][0], q[2][0], u), lerp(q[3][1], q[2][1], u)]; return [lerp(t[0], b[0], v), lerp(t[1], b[1], v)]; };
function poly(q, pts){ q.beginPath(); pts.forEach((p, i) => i ? q.lineTo(p[0], p[1]) : q.moveTo(p[0], p[1])); q.closePath(); }
const SEAT = { x:400, y:282 };
const ANCH = [[262, 116], [538, 116], [70, 14], [730, 14]];             /* where the bands are tied: the ceiling's corners */
const HOLE = (() => { const pts = []; let s = 3; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 22; i++){ const a = i / 22 * Math.PI * 2, k = .78 + r() * .34; pts.push([400 + Math.cos(a) * 66 * k, 50 + Math.sin(a) * 24 * k]); } return pts; })();
const STARS = Array.from({ length:420 }, () => [rnd(), rnd(), rnd(), rnd()]);

/* the posters: five kinds, each drawn in its own unit square */
const POSTER = [
  (q) => { q.fillStyle = "#8c2a1f"; q.fillRect(0, 0, 1, 1);                       /* a rocket going up */
    q.fillStyle = "#e9dcc0"; q.beginPath(); q.moveTo(.5, .08); q.quadraticCurveTo(.64, .25, .6, .7); q.lineTo(.4, .7); q.quadraticCurveTo(.36, .25, .5, .08); q.fill();
    q.beginPath(); q.moveTo(.4, .55); q.lineTo(.28, .76); q.lineTo(.4, .7); q.fill(); q.beginPath(); q.moveTo(.6, .55); q.lineTo(.72, .76); q.lineTo(.6, .7); q.fill();
    q.fillStyle = "#e7b54a"; q.beginPath(); q.moveTo(.42, .72); q.lineTo(.5, .95); q.lineTo(.58, .72); q.fill();

      if (wind){ wind.gain.setValueAtTime(0, tt); wind.gain.linearRampToValueAtTime(.05, tt + 1.4); wind.gain.linearRampToValueAtTime(.02, tt + 4); wind.gain.linearRampToValueAtTime(0, tt + 8); }
      [0, 1, 2, 3, 4].forEach(i => tone(tt + 3.4 + i * .9 + Math.random() * .3, 1568 + i * 220, 1568 + i * 220, 1.4, .012, "sine")); },
    end(){ if (!ok()) return; const tt = ctx.currentTime; [1047, 1319, 1568].forEach((f, i) => tone(tt + i * .25, f, f, 2.2, .02, "sine")); },
  };
})();

/* ==========================================================================
   8. LOOP
   ========================================================================== */
let last = performance.now(), t = 0;
st.focus = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  const k = 1 - Math.exp(-dt * 5);
  cam.x = lerp(cam.x, cam.tx, k); cam.y = lerp(cam.y, cam.ty, k); cam.z = lerp(cam.z, cam.tz, k);
  st.focus = lerp(st.focus, st.open ? 1 : 0, k);
  if (st.mode === "room"){
    if (!st.pulling){ st.pullV += (-st.pull * 60 - st.pullV * 6) * dt; st.pull = Math.max(-14, st.pull + st.pullV * dt); }
    st.shake = st.pulling ? Math.max(0, st.pull - 70) / 50 * .8 : 0;
  } else if (st.mode === "fly"){
    st.fly += dt; st.shake = st.fly < 1.25 ? (1 - st.fly / 1.25) * 2.5 : 0;
    if (st.fly > 1.2 && st.fly < 1.3 && st.flash === 0) st.flash = .75;
    st.flash = Math.max(0, st.flash - dt * 2.6);
    if (st.fly > 8.6) land();
  } else if (st.mode === "end"){ st.fly = Math.min(st.fly + dt * .2, 8.6); st.shake = 0; }
  frameScene(t); present();
}
