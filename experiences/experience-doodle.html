<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Doodle Art — Living Art Museum</title>
<meta name="description" content="A white wall packed edge to edge with doodles that are very much alive. An experience from the Living Art Museum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--serif:Fraunces,"Noto Serif KR",Georgia,serif;}
html[lang="ko"]{--serif:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;}   /* in Korean every heading is the same gothic */
/* ==========================================================================
   DOODLE ART — a wall that will not sit still
   Black marker on white, every gap filled. Each creature has a temper: some
   run when you come close, some puff up and shout, a few come to say hello.
   The whole wall chatters while you are here.
   ========================================================================== */
:root{
  --ink:#141414; --ink-dim:rgba(20,20,20,.62); --ink-faint:rgba(20,20,20,.4);
  --line:rgba(0,0,0,.1); --accent:#141414; --ease:cubic-bezier(.22,.68,.24,1);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
html{touch-action:none;}
body{background:#fff;color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,sans-serif;overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px;}
.serif{font-family:var(--serif);}

#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer;background:#fff;}

/* ---------- glass, pale ---------- */
.glass{background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.82));
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(0,0,0,.09);
  box-shadow:0 22px 44px -30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.95);}

.top{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:20px;z-index:20;
  display:flex;align-items:center;gap:14px;pointer-events:none;}
.top > *{pointer-events:auto;}
body.embedded .top{display:none;}
.logo{font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1;white-space:nowrap;text-decoration:none;color:#141414;
  padding:9px 14px;border-radius:999px;}
.views{display:flex;gap:2px;padding:4px;border-radius:999px;}
.views a{padding:8px 15px;border-radius:999px;font-size:12.5px;text-decoration:none;color:rgba(20,20,20,.78);}
.views a:hover{color:#141414;background:rgba(255,255,255,.7);}
.title{margin-left:auto;text-align:right;padding:9px 16px;border-radius:16px;}
.title h1{font-family:var(--serif);font-size:17px;font-weight:600;}
.title p{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}

.bar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:6px;padding:6px 6px 6px 18px;border-radius:999px;max-width:calc(100% - 24px);}
.bar .hint{font-size:12.5px;color:var(--ink-dim);margin-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar .hint b{color:#141414;font-weight:600;}
.bar button{flex:none;padding:9px 15px;border-radius:999px;font-size:12.5px;color:rgba(20,20,20,.78);
  border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.6);transition:background .2s,color .2s;}
.bar button:hover{background:#fff;color:#141414;}
.bar button[aria-pressed="false"]{color:rgba(20,20,20,.45);}
.bar .short{display:none;}
.pill{display:none;position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;
  padding:7px 13px;border-radius:999px;font-size:11.5px;color:var(--ink-dim);white-space:nowrap;}

[hidden]{display:none !important;}
.namebox{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:22;
  display:flex;align-items:center;gap:8px;width:min(440px,calc(100% - 24px));padding:6px 6px 6px 18px;border-radius:999px;}
.namebox input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:inherit;outline:none;}
.namebox input::placeholder{color:currentColor;opacity:.45;}
.namebox .ncount{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:11px;opacity:.55;}
.namebox button{flex:none;padding:9px 16px;border-radius:999px;font-size:12.5px;font-weight:600;background:#141414;color:#fff;}
body.night .namebox button{background:#f4f4f7;color:#141414;}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:21;
  padding:11px 17px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;}
.toast.in{opacity:1;transform:translate(-50%,0);}

@media (max-width:900px){ .title p{display:none;} .views a{padding:7px 11px;font-size:11.5px;} }
@media (max-width:600px){
  .top{left:12px;right:12px;gap:8px;} .top .title{display:none;}
  .logo{font-size:15.5px;padding:8px 12px;} .views{margin-left:auto;padding:3px;} .views a{padding:6px 10px;font-size:10.5px;}
  .bar{bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:5px 5px 5px 13px;gap:4px;}
  .bar{padding:5px;} .bar .hint{display:none;} .pill{display:block;}
  .bar button{padding:6px 8px;font-size:10.5px;}
  .bar{gap:2px;max-width:calc(100% - 16px);}
  .toast{bottom:calc(104px + env(safe-area-inset-bottom,0px));font-size:12px;}
  .namebox{bottom:calc(100px + env(safe-area-inset-bottom,0px));}
}
body.night .glass{background:linear-gradient(180deg, rgba(22,24,40,.9), rgba(14,16,28,.84));border-color:rgba(255,255,255,.14);color:#f1f1f4;
  box-shadow:0 22px 44px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08);}
body.night .logo, body.night .title h1{color:#f4f4f7;} body.night .title p{color:rgba(255,255,255,.6);}
body.night .views a{color:rgba(255,255,255,.75);} body.night .views a:hover{background:rgba(255,255,255,.1);color:#fff;}
body.night .bar .hint{color:rgba(255,255,255,.7);} body.night .bar .hint b{color:#fff;}
body.night .bar button{color:rgba(255,255,255,.85);background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);}
body.night .bar button:hover{background:rgba(255,255,255,.16);color:#fff;}
body.night .pill{color:rgba(255,255,255,.75);}
body.night #cv{cursor:crosshair;}
html[lang="ko"] body{word-break:keep-all;}
</style>
</head>
<body>

<canvas id="cv" aria-label="A white wall covered in living doodles"></canvas>

<header class="top">
  <a class="logo glass" href="https://claude.ai/artifact/VKnXjTpP7PtFE1dUEE9tcz">Living Art Museum</a>
  <nav class="views glass" aria-label="Main view">
    <a href="https://claude.ai/artifact/VKnXjTpP7PtFE1dUEE9tcz?view=space">3D</a>
    <a href="https://claude.ai/artifact/VKnXjTpP7PtFE1dUEE9tcz?view=card">Card</a>
    <a href="https://claude.ai/artifact/VKnXjTpP7PtFE1dUEE9tcz?view=display">Display</a>
  </nav>
  <div class="title glass">
    <h1 class="serif">Doodle Art</h1>
    <p>after Mr Doodle · marker on a white wall</p>
  </div>
</header>

<nav class="bar glass" aria-label="Doodle controls">
  <span class="hint" id="hint" data-ko="<b>클릭</b>하면 저마다 제 소리를 내고, 주변이 다 같이 와글와글 떠들어요."><b>Click</b> one — each has its own sound, and the crowd starts talking.</span>
  <button id="b-name">Write a name</button>
  <button id="b-new">New drawing</button>
  <button id="b-sound" aria-pressed="true">Sound on</button>
</nav>

<div class="pill glass" id="pill" data-ko="톡 누르면 저마다 제 소리 · 와글와글">Tap one — each has its own sound</div>
<form class="namebox glass" id="namebox" hidden autocomplete="off">
  <input id="name-in" placeholder="A name — up to 10 letters" aria-label="Name" enterkeyhint="go" spellcheck="false">
  <span class="ncount" id="name-n">0/10</span>
  <button type="submit" id="name-go">Make it</button>
</form>
<div class="toast glass" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---- language: English unless the museum (or ?lang=ko) asks for Korean ---- */
const LANG = (() => {
  let l = (document.documentElement.lang || "en").slice(0, 2);
  try { const q = new URLSearchParams(location.search).get("lang"); if (q) l = q; } catch (_){}
  return l === "ko" ? "ko" : "en";
})();
const KO = {
 "@title": "두들 아트 — Living Art Museum",
 "Card": "카드", "Display": "전시", "Main view": "메인 보기",
 "Doodle Art": "두들 아트",
 "after Mr Doodle · marker on a white wall": "미스터 두들 풍 · 흰 벽에 마커",
 "Some run, some get cross.": "도망가는 녀석, 화내는 녀석.",
 "and they all talk at once.": "하면 다 같이 와글와글 떠들어요.",
 "Click": "클릭",
 "Get close · tap and they all talk": "가까이 가 보기 · 톡 누르면 와글와글",
 "New drawing": "새로 그리기",
 "Sound on": "소리 켜짐", "Sound off": "소리 꺼짐",
 "Doodle controls": "두들 조작",
 "A white wall covered in living doodles": "살아 있는 낙서로 가득한 흰 벽",
 "Torch on — press and drag to shine it.": "손전등 켜짐 — 누른 채 드래그해 비춰 보세요.",
 "Torch off.": "손전등 꺼짐.",
 "Night falls. Find the torch.": "밤이 되었어요. 손전등을 찾아보세요.",
 "Good morning.": "좋은 아침이에요.",
 "Write a name": "이름 쓰기",
 "A name — up to 10 letters": "이름 — 10자까지",
 "Make it": "만들기",
 "Type a name first.": "이름을 먼저 적어 주세요.",
 "Up to 10 letters.": "10자까지만 쓸 수 있어요.",
 "Tap anywhere to let them go.": "아무 곳이나 누르면 다시 흩어져요.",
 "Those letters cannot be drawn — try another name.": "그 글자는 그릴 수 없어요 — 다른 이름을 적어 주세요.",
 "A whole new crowd.": "완전히 새로운 녀석들이 나타났어요.",
 "Quiet now.": "조용해졌어요.",
 "The chatter is back.": "다시 시끌벅적해요."
};
const L = (s) => (LANG === "ko" && KO[s] !== undefined) ? KO[s] : s;
(function localise(){
  if (LANG !== "ko") return;
  document.documentElement.lang = "ko";
  const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT,
    { acceptNode:n => /^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const hits = [];
  while (walk.nextNode()){
    const n = walk.currentNode, k = n.nodeValue.replace(/\s+/g, " ").trim();
    if (k && KO[k] !== undefined) hits.push([n, KO[k]]);
  }
  hits.forEach(([n, v]) => { const m = n.nodeValue.match(/^(\s*)[\s\S]*?(\s*)$/); n.nodeValue = m[1] + v + m[2]; });
  document.querySelectorAll("[title],[aria-label],[placeholder]").forEach(el => ["title", "aria-label", "placeholder"].forEach(a => {
    const v = el.getAttribute(a); if (v && KO[v] !== undefined) el.setAttribute(a, KO[v]);
  }));
  document.querySelectorAll("[data-ko]").forEach(el => { el.innerHTML = el.dataset.ko; });
  if (KO["@title"]) document.title = KO["@title"];
})();
let tt; function toast(m){ const t = $("toast"); t.textContent = L(m); t.classList.add("in"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("in"), 2200); }

/* ==========================================================================
   1. drawing helpers — every line is a hand-drawn polyline, smoothed, and
      redrawn in three slightly different wobbles so the wall "boils"
   ========================================================================== */
let R = Math.random;
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rr = (a, b) => a + R() * (b - a);
const pick = (a) => a[Math.floor(R() * a.length)];
const chance = (p) => R() < p;
const TAU = Math.PI * 2;

const S = (p, c = false, f = null, sh = false) => ({ p, c, f, sh });       /* a stroke: points, closed?, fill, sharp corners? */
const circ = (cx, cy, rx, ry = rx, n = 18, rot = 0) =>
  Array.from({ length:n }, (_, i) => { const a = rot + i / n * TAU; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]; });
const blobPts = (cx, cy, r, n = 16, irr = 0.1) => {
  const ph = R() * 6, k = 2 + Math.floor(R() * 3);
  return Array.from({ length:n }, (_, i) => { const a = i / n * TAU;
    const rad = r * (1 + irr * Math.sin(a * k + ph) + irr * 0.6 * (R() - 0.5));
    return [cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]; });
};
function rrect(x0, y0, x1, y1, rad){
  const p = [], c = [[x1 - rad, y0 + rad, -Math.PI / 2], [x1 - rad, y1 - rad, 0], [x0 + rad, y1 - rad, Math.PI / 2], [x0 + rad, y0 + rad, Math.PI]];
  c.forEach(([cx, cy, a0]) => { for (let k = 0; k <= 3; k++){ const a = a0 + k / 3 * Math.PI / 2; p.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]); } });
  return p;
}
const star = (cx, cy, ro, ri, n = 5, rot = -Math.PI / 2) =>
  Array.from({ length:n * 2 }, (_, i) => { const a = rot + i / (n * 2) * TAU, r = i % 2 ? ri : ro; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; });
const heart = (cx, cy, s) => Array.from({ length:22 }, (_, i) => { const t = i / 22 * TAU;
  return [cx + s * 0.06 * 16 * Math.pow(Math.sin(t), 3), cy - s * 0.06 * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]; });
const arc = (cx, cy, r, a0, a1, n = 10) => Array.from({ length:n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; });

/* polyline → smooth Path2D, with a wobble of size j */
function toPath(st, j){
  const path = new Path2D();
  const p = st.p.map(([x, y]) => [x + (R() - 0.5) * 2 * j, y + (R() - 0.5) * 2 * j]);
  const n = p.length;
  if (n < 2) return path;
  if (st.sh){
    path.moveTo(p[0][0], p[0][1]); for (let i = 1; i < n; i++) path.lineTo(p[i][0], p[i][1]);
    if (st.c) path.closePath();
    return path;
  }
  if (st.c){
    const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    let s0 = m(p[n - 1], p[0]); path.moveTo(s0[0], s0[1]);
    for (let i = 0; i < n; i++){ const q = p[i], e = m(q, p[(i + 1) % n]); path.quadraticCurveTo(q[0], q[1], e[0], e[1]); }
    path.closePath();
  } else {
    path.moveTo(p[0][0], p[0][1]);
    if (n === 2){ path.lineTo(p[1][0], p[1][1]); return path; }
    for (let i = 1; i < n - 1; i++){ const e = [(p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2]; path.quadraticCurveTo(p[i][0], p[i][1], e[0], e[1]); }
    path.lineTo(p[n - 1][0], p[n - 1][1]);
  }
  return path;
}

/* ==========================================================================
   2. the cast — original doodle creatures, each built inside a unit circle.
      A face is drawn live on top, so it can look, blink, talk and shout.
   ========================================================================== */
const MOUTHS = ["smile", "teeth", "open", "grin", "tongue", "flat", "fangs", "zig", "wide"];
function face(cx, cy, s, o = {}){
  const n = o.n || (o.one ? 1 : 2), er = (o.er ? o.er * 1.3 : 0.27) * s * rr(0.92, 1.1), gap = (o.gap || 0.34) * s, ey = cy - s * 0.14;
  let eyes;
  if (n === 1) eyes = [{ x:cx, y:ey, r:Math.min(er * 1.45, s * 0.42) }];
  else if (n === 2) eyes = [{ x:cx - gap, y:ey, r:er }, { x:cx + gap, y:ey, r:er * (o.odd ? 0.72 : 1) }];
  else if (n === 3) eyes = [{ x:cx - gap * 1.2, y:ey + s * 0.05, r:er * 0.78 }, { x:cx, y:ey - s * 0.16, r:er * 0.9 }, { x:cx + gap * 1.2, y:ey + s * 0.05, r:er * 0.78 }];
  else eyes = [-1, 1].flatMap(sx => [-1, 1].map(sy => ({ x:cx + sx * gap * 0.82, y:ey + sy * s * 0.17 - s * 0.04, r:er * 0.6 })));
  if (o.eyes) eyes = o.eyes;
  const mouth = o.noMouth ? null : { x:cx + (o.mx || 0) * s, y:cy + (o.my || 0.38) * s, w:(o.mw || 0.56) * s, kind:o.kind || pick(MOUTHS) };
  return { eyes, mouth };
}
const feet = (st, y = 0.82, x = 0.34) => { st.push(S([[-x, y - 0.06], [-x - 0.04, y + 0.12], [-x + 0.18, y + 0.12]])); st.push(S([[x, y - 0.06], [x + 0.04, y + 0.12], [x - 0.18, y + 0.12]])); };
const arms = (st, y = 0.1, x = 0.8, up = chance(0.5)) => {
  st.push(S([[-x, y], [-x - 0.16, y + (up ? -0.12 : 0.1)], [-x - 0.2, y + (up ? -0.32 : 0.26)]]));
  st.push(S([[x, y], [x + 0.16, y + (up ? -0.12 : 0.1)], [x + 0.2, y + (up ? -0.32 : 0.26)]]));
};
const antenna = (st, y = -0.78) => { const bend = rr(-0.12, 0.12); st.push(S([[0, y], [bend, y - 0.14], [bend * 1.4, y - 0.24]])); st.push(S(circ(bend * 1.4, y - 0.29, 0.07, 0.07, 8), true, "k")); };
const hair = (st, cx, top, w) => { const p = []; const n = 5 + Math.floor(R() * 3); for (let i = 0; i <= n; i++) p.push([cx - w + 2 * w * i / n, top - (i % 2 ? 0.16 : 0)]); st.push(S(p)); };

const KINDS = {
  blob(){ const st = []; const b = blobPts(0, 0.04, 0.78, 16, 0.09);
    if (chance(0.5)) arms(st, 0.12, 0.74);
    st.push(S(b, true, "w"));
    if (chance(0.5)) antenna(st, -0.72); else if (chance(0.5)) hair(st, 0, -0.68, 0.36);
    if (chance(0.7)) feet(st, 0.8, 0.3);
    if (chance(0.35)) for (let i = 0; i < 3; i++) st.push(S(circ(rr(-0.4, 0.4), rr(0.5, 0.62), 0.05, 0.05, 6), true, "k"));
    return { st, face:face(0, -0.02, 0.76) }; },
  robot(){ const st = [];
    st.push(S([[-0.62, 0.12], [-0.86, 0.16], [-0.9, 0.34]])); st.push(S([[0.62, 0.12], [0.86, 0.16], [0.9, 0.34]]));
    st.push(S(rrect(-0.62, -0.52, 0.62, 0.66, 0.14), true, "w"));
    st.push(S([[0, -0.52], [0, -0.74]])); st.push(S(circ(0, -0.8, 0.08, 0.08, 8), true, "k"));
    st.push(S(circ(-0.5, 0.48, 0.05, 0.05, 6), true, "k")); st.push(S(circ(0.5, 0.48, 0.05, 0.05, 6), true, "k"));
    st.push(S(rrect(-0.4, 0.66, -0.18, 0.92, 0.04), true, "w")); st.push(S(rrect(0.18, 0.66, 0.4, 0.92, 0.04), true, "w"));
    return { st, face:face(0, -0.02, 0.62, { kind:pick(["teeth", "flat", "grin"]), er:0.24 }) }; },
  ghost(){ const st = []; const p = [];
    for (let i = 0; i <= 12; i++){ const a = Math.PI + i / 12 * Math.PI; p.push([Math.cos(a) * 0.66, -0.12 + Math.sin(a) * 0.7]); }
    p.push([0.66, 0.66]);
    for (let i = 1; i <= 6; i++){ const x = 0.66 - i * 0.22; p.push([x + 0.11, i % 2 ? 0.86 : 0.7]); p.push([x, 0.72 + (i % 2 ? 0.06 : 0)]); }

    armK = hw > 0.72 ? pick(["none", "stub"]) : pick(["none", "down", "up", "wave", "tentacle", "claws", "stub"]);
    legK = bot > 0.78 ? "none" : pick(["feet", "feet", "three", "tentacles", "wheels", "none", "zigfeet", "hop"]);
    patK = pick(["none", "none", "patch", "stripes", "belly", "zig", "heart", "stitch", "bolt"]);
    eyesN = topK === "stalks" ? 2 : rel < 1.7 ? pick([1, 2, 2, 2]) : pick([1, 1, 2, 2, 2, 3]); mouthK = pick(MOUTHS);
    if (rel < 1.3){ patK = pick(["none", "none", "heart", "zig"]); if (mouthK === "teeth") mouthK = "grin"; }
    sig = [shape, topK, armK, legK, patK, eyesN, mouthK].join("|");
    if (!used.has(sig)) break;
  }
  used.add(sig);
  st = [];
  const mid = (top + bot) / 2 + 0.06, L = Math.min(0.26, 0.97 - bot);
  /* behind the body: arms, legs, horns, ears, spikes */
  const ax = hw * 0.94, side = [-1, 1];
  if (armK === "down") side.forEach(s => { st.push(S([[s * ax, mid], [s * (ax + 0.14), mid + 0.12], [s * (ax + 0.16), mid + 0.3]])); st.push(S([[s * (ax + 0.1), mid + 0.32], [s * (ax + 0.22), mid + 0.32]])); });
  if (armK === "up") side.forEach(s => { st.push(S([[s * ax, mid], [s * (ax + 0.14), mid - 0.14], [s * (ax + 0.18), mid - 0.36]])); st.push(S([[s * (ax + 0.1), mid - 0.4], [s * (ax + 0.18), mid - 0.36], [s * (ax + 0.27), mid - 0.42]], false, null, true)); });
  if (armK === "wave"){ st.push(S([[-ax, mid], [-ax - 0.16, mid - 0.16], [-ax - 0.2, mid - 0.38]])); st.push(S([[ax, mid], [ax + 0.15, mid + 0.12], [ax + 0.18, mid + 0.32]])); }
  if (armK === "tentacle") side.forEach(s => { const q = []; for (let k = 0; k <= 8; k++){ const t = k / 8; q.push([s * (ax + t * 0.24), mid + Math.sin(t * 7) * 0.08 + t * 0.12]); } st.push(S(q)); });
  if (armK === "claws") side.forEach(s => { const ex = s * (ax + 0.2), ey = mid - 0.04; st.push(S([[s * ax, mid + 0.06], [ex, ey]]));
    [-0.12, 0, 0.12].forEach(d => st.push(S([[ex, ey], [ex + s * 0.08, ey + d]]))); });
  if (armK === "stub") side.forEach(s => st.push(S([[s * hw * 0.9, mid + 0.06], [s * Math.min(0.97, hw + 0.14), mid + 0.12]])));
  if (L > 0.1){
    if (legK === "feet") side.forEach(s => { st.push(S([[s * hw * 0.38, bot - 0.06], [s * hw * 0.4, bot + L * 0.8]])); st.push(S([[s * hw * 0.4, bot + L * 0.8], [s * (hw * 0.4 + 0.16), bot + L * 0.8]])); });
    if (legK === "three") [-1, 0, 1].forEach(s => st.push(S([[s * hw * 0.45, bot - 0.06], [s * hw * 0.55, bot + L * 0.85], [s * hw * 0.55 + 0.1, bot + L * 0.85]])));
    if (legK === "tentacles") for (let i = 0; i < 4; i++){ const x0 = -hw * 0.6 + i * hw * 0.4, q = []; for (let k = 0; k <= 6; k++){ const t = k / 6; q.push([x0 + Math.sin(t * 6 + i) * 0.06, bot - 0.06 + t * (L + 0.04)]); } st.push(S(q)); }
    if (legK === "zigfeet") side.forEach(s => { const q = []; for (let k = 0; k <= 4; k++) q.push([s * hw * 0.38 + (k % 2 ? 0.06 : -0.06), bot - 0.04 + k * L * 0.22]); st.push(S(q, false, null, true)); });
    if (legK === "hop"){ st.push(S([[0, bot - 0.06], [0, bot + L * 0.7]])); const q = []; for (let k = 0; k <= 4; k++) q.push([-0.16 + k * 0.08, bot + L * 0.7 + (k % 2 ? 0.06 : 0)]); st.push(S(q)); }
  }
  if (topK === "horns") side.forEach(s => st.push(S([[s * hw * 0.32, top + 0.12], [s * hw * 0.62, top - 0.24], [s * hw * 0.62, top + 0.14]], true, "w", true)));
  if (topK === "ears") side.forEach(s => st.push(S([[s * hw * 0.8, top + 0.22], [s * hw * 0.78, top - 0.22], [s * hw * 0.28, top + 0.08]], true, "w", true)));
  if (topK === "spikes"){ const q = [[-hw * 0.7, top + 0.2]]; for (let k = 0; k <= 8; k++) q.push([-hw * 0.7 + k * hw * 0.175, top + (k % 2 ? 0.06 : -0.22)]); q.push([hw * 0.7, top + 0.2]); st.push(S(q, true, "w", true)); }
  if (topK === "mohawk"){ const q = [[-0.2, top + 0.1]]; for (let k = 0; k <= 4; k++) q.push([-0.2 + k * 0.1, top - (k % 2 ? 0.1 : 0.22)]); q.push([0.2, top + 0.1]); st.push(S(q, true, "k", true)); }

  st.push(S(body, true, "w", shape === "starry"));
  /* on top of it */

    if (patK === "stripes") for (let i = 0; i < 2; i++){ const y = by0 + (by1 - by0) * (0.3 + i * 0.5); st.push(S(arc(0, y - 0.5, 0.5, Math.PI / 2 - bw * 1.1, Math.PI / 2 + bw * 1.1, 8))); }
    if (patK === "belly") st.push(S(circ(0, (by0 + by1) / 2, bw * 0.75, (by1 - by0) * 0.5, 14)));
    if (patK === "zig"){ const q = []; for (let k = 0; k <= 8; k++) q.push([-bw + k * bw / 4, (by0 + by1) / 2 + (k % 2 ? 0.05 : -0.05)]); st.push(S(q, false, null, true)); }
    if (patK === "heart") st.push(S(heart(0, (by0 + by1) / 2, Math.min(0.2, (by1 - by0) * 0.7)), true, "k"));
    if (patK === "stitch"){ const y = (by0 + by1) / 2; st.push(S([[-bw * 0.8, y], [bw * 0.8, y]])); for (let k = 0; k < 4; k++){ const x = -bw * 0.6 + k * bw * 0.4; st.push(S([[x, y - 0.06], [x, y + 0.06]])); } }
    if (patK === "bolt"){ const y = (by0 + by1) / 2, h = (by1 - by0) * 0.45; st.push(S([[-0.04, y - h], [0.08, y - h], [0.02, y], [0.1, y], [-0.06, y + h], [-0.02, y + 0.01], [-0.1, y + 0.01]], true, "k", true)); }
  }
  if (topK === "antenna" || topK === "antenna2") (topK === "antenna" ? [0] : [-0.22, 0.22]).forEach(x0 => {
    const b = rr(-0.1, 0.1), tx = x0 + b * 1.4, ty = top - 0.2; st.push(S([[x0, top + 0.02], [x0 + b, top - 0.1], [tx, ty]]));
    st.push(S(star(tx, ty - 0.06, 0.09, 0.04, 4, 0), true, "k", true)); });
  if (topK === "hair"){ const n = 5 + Math.floor(R() * 4); for (let k = 0; k < n; k++){ const x = -hw * 0.4 + k * hw * 0.8 / (n - 1); st.push(S([[x, top + 0.03], [x + rr(-0.05, 0.05), top - 0.14]])); } }
  if (topK === "crown"){ st.push(S([[-0.32, top + 0.06], [-0.36, top - 0.28], [-0.16, top - 0.1], [0, top - 0.32], [0.16, top - 0.1], [0.36, top - 0.28], [0.32, top + 0.06]], true, "w", true)); }
  if (topK === "hat"){ st.push(S(rrect(-0.24, top - 0.32, 0.24, top + 0.02, 0.02), true, "k", true)); st.push(S([[-0.4, top + 0.02], [0.4, top + 0.02]])); }
  if (topK === "horn"){ st.push(S([[-0.1, top + 0.05], [0, top - 0.32], [0.1, top + 0.05]], true, "w", true)); st.push(S([[-0.05, top - 0.06], [0.06, top - 0.12]])); }
  if (topK === "curl"){ const q = []; for (let k = 0; k <= 16; k++){ const t = k / 16, a = t * 1.6 * TAU; q.push([Math.cos(a) * 0.1 * (1 - t * 0.6) + 0.02, top - 0.12 + Math.sin(a) * 0.1 * (1 - t * 0.6)]); } q.unshift([0, top + 0.02]); st.push(S(q)); }
  if (topK === "bow") side.forEach(s => st.push(S([[0, top + 0.02], [s * 0.2, top - 0.12], [s * 0.2, top + 0.1]], true, "k", true)));
  let fc;
  if (topK === "stalks"){
    const ey = top - 0.26, eyes = side.map(s => ({ x:s * 0.24, y:ey, r:0.13 }));
    side.forEach(s => st.push(S([[s * 0.14, top + 0.04], [s * 0.24, ey + 0.1]])));

  } else fc = face(0, fy, fs, { n:eyesN, kind:mouthK });
  /* how it sounds when you click it: big ones roar, small ones squeak, the rest gibber */
  return { st, face:fc, voice:{ kind:pick(mouthK === "fangs" || mouthK === "teeth" || mouthK === "zig" ? ["roar", "growl"] : ["blorp", "gibber", "squeak", "hum", "giggle"]), f:rr(0.8, 1.25) } };
}

    unlock(){ if (!ensure()) return; if (ac.state === "suspended") ac.resume(); unlocked = true; },
    setOn(v){ on = v; },
    pause(p){ if (!ac) return; if (p) ac.suspend(); else if (unlocked) ac.resume(); },
    /* the element's own sound */
    play(o, delay = 0, v = 1){
      if (!ok()) return;
      const name = o.kind === "monster" ? o.voice.kind : SFX[o.kind] ? o.kind : (ALIAS[o.kind] || "boing");
      const fn = SFX[name] || SFX.blorp;
      const k = Math.max(0.6, Math.min(1.7, (o.voice ? o.voice.f : 1) * Math.sqrt(unit * 1.6 / o.r)));
      fn(ac.currentTime + delay, (o.hx / Math.max(1, W)) * 1.6 - 0.8, k, v);
    },
    sfx(name, x, delay = 0, v = 1){ if (!ok() || !SFX[name]) return; SFX[name](ac.currentTime + delay, (x / Math.max(1, W)) * 1.6 - 0.8, 1, v); },
    /* one creature babbles a few syllables: "wa-gle-wa-gle" — returns how long it talks */
    chatter(pan, size, loud = 1, n = 2, delay = 0){
      if (!ok()) return 0;
      const t = ac.currentTime + delay;
      const f0 = Math.max(150, Math.min(760, 2600 / Math.sqrt(size))) * rr(0.85, 1.25);
      let at = t;
      for (let i = 0; i < n; i++){ const dur = rr(0.06, 0.13); syllable(at, pan, f0 * rr(0.85, 1.18), dur, 0.1 * loud, pick(VOW), pick(VOW)); at += dur + rr(0.008, 0.035); }
      return at - t;
    },
  };
})();



/* ==========================================================================
   5. what each thing does when you click it
   ========================================================================== */
const EV = [], PT = [];
let stare = null, flashA = 0, freezeK = 0;
const NOW = () => performance.now() / 1000;
const rn = (a, b) => a + Math.random() * (b - a);
const bell = (p) => Math.sin(Math.PI * Math.max(0, Math.min(1, p)));
const easeIO = (p) => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const posX = (o) => o.hx + o.ox + o.ex, posY = (o) => o.hy + o.oy + o.ey;
function anim(o, type, dur, data = {}){ o.an = { type, t0:NOW(), dur, ...data }; }
function event(type, dur, data = {}){ const e = { type, t0:NOW(), dur, ...data }; EV.push(e); return e; }
const around = (o, R) => live.filter(q => q !== o && !q.special && Math.hypot(q.hx - o.hx, q.hy - o.hy) < R);
const nearest = (o, test = () => true) => { let b = null, bd = 1e9; for (const q of live){ if (q === o || q.special || !test(q)) continue; const d = Math.hypot(q.hx - o.hx, q.hy - o.hy); if (d < bd){ bd = d; b = q; } } return b; };
const creatures = () => live.filter(q => q.face && !q.special);
function talk(o, dur = 0.6){ const t = NOW(); o.talkA = t; o.talkB = t + dur; o.talkHz = 7; }
function particle(kind, x, y, o = {}){
  if (PT.length > 420) return;
  PT.push({ kind, x, y, vx:o.vx || 0, vy:o.vy || 0, g:o.g || 0, rot:o.rot ?? rn(0, TAU), vr:o.vr ?? rn(-2, 2), s:o.s || unit * 0.38,
    life:o.life || 1.6, age:0, sway:o.sway || 0, glow:o.glow || 0, ph:rn(0, 6) });
}
const burst = (kind, x, y, n, sp = 1, o = {}) => { for (let i = 0; i < n; i++){ const a = rn(0, TAU), v = rn(0.5, 1) * unit * 7 * sp; particle(kind, x, y, { vx:Math.cos(a) * v, vy:Math.sin(a) * v - unit * 3 * sp, g:unit * 14, life:rn(1, 1.6), ...o }); } };
const rise = (kind, x, y, n, o = {}) => { for (let i = 0; i < n; i++) particle(kind, x + rn(-1, 1) * unit, y, { vy:-rn(1.5, 3) * unit, sway:unit * 0.6, life:rn(1.6, 2.6), vr:rn(-1, 1), ...o, }); };
const fall = (kind, x0, x1, n, o = {}) => { for (let i = 0; i < n; i++) particle(kind, rn(x0, x1), -rn(0, H * 0.3), { vy:rn(2, 4) * unit, sway:unit * 0.8, life:rn(3, 4.5), ...o }); };
const across = (kind, y, dir, o = {}) => particle(kind, dir > 0 ? -unit * 2 : W + unit * 2, y, { vx:dir * rn(14, 20) * unit, vy:rn(-1, 1) * unit, life:(W + unit * 4) / (16 * unit), vr:0, rot:dir > 0 ? 0 : Math.PI, ...o });
function kick(q, k = 1){ q.vy -= unit * 12 * k; q.vx += rn(-1, 1) * unit * 4 * k; q.fearKick = Math.max(q.fearKick, 0.6 * k); }
function shove(x, y, R, k = 1){ for (const q of live){ if (q.special) continue; const dx = q.hx - x, dy = q.hy - y, d = Math.hypot(dx, dy) || 1; if (d < R){ const f = (1 - d / R) * unit * 30 * k; q.vx += dx / d * f; q.vy += dy / d * f; } } }

/* item motions that play out once */
const ANIM = {
  drive(o, p, t, a){ const span = W + o.r * 4; let x = o.hx + a.dir * p * span; if (x > W + o.r * 2) x -= span; if (x < -o.r * 2) x += span;
    o.ex = x - o.hx; o.ey = -Math.abs(Math.sin(t * 22)) * o.r * 0.07; o.er = a.dir * 0.05 * Math.sin(t * 9); a.bump = 1; },
  sail(o, p, t, a){ ANIM.drive(o, p, t, a); o.ey = Math.sin(t * 3) * o.r * 0.1; o.er = Math.sin(t * 2.4) * 0.18; },
  fly(o, p, t, a){ const span = W + o.r * 4; let x = o.hx + a.dir * p * span; if (x > W + o.r * 2) x -= span; if (x < -o.r * 2) x += span;
    o.ex = x - o.hx; o.ey = Math.sin(p * TAU * 2) * o.r * 1.6; o.er = Math.cos(p * TAU * 2) * 0.3 * a.dir; a.bump = 1; },
  launch(o, p, t, a){ const span = H + o.r * 4; let y = o.hy - easeIO(p) * span; if (y < -o.r * 2) y += span; o.ey = y - o.hy; o.ex = Math.sin(t * 50) * o.r * 0.04; a.bump = 1; },
  float(o, p, t, a){ const span = H + o.r * 4; let y = o.hy - easeIO(p) * span; if (y < -o.r * 2) y += span; o.ey = y - o.hy; o.ex = Math.sin(t * 2 + o.ph) * o.r * 0.8; o.er = Math.sin(t * 1.6) * 0.2; },
  loop(o, p, t, a){ const ang = easeIO(p) * TAU * 1.5, R2 = o.r * 3; o.ex = Math.sin(ang) * R2 * a.dir; o.ey = -(1 - Math.cos(ang)) * R2; o.er = ang * a.dir; },
  crawl(o, p, t, a){ o.ex = a.dir * bell(p) * o.r * (a.dist || 3); o.er = Math.sin(t * 14) * 0.12; o.esx = 1 + Math.sin(t * 14) * 0.08; },
  melt(o, p, t, a){ const m = bell(p); o.esy = 1 - m * 0.5; o.esx = 1 + m * 0.35; o.ey = m * o.r * 0.45; },
  grow(o, p, t, a){ const m = bell(p); o.esx = o.esy = 1 + m * (a.k || 0.9); },
  shrink(o, p, t, a){ const m = p < 0.12 ? p / 0.12 : p > 0.85 ? (1 - p) / 0.15 : 1; o.esx = o.esy = 1 - m * 0.62; },
  spin(o, p, t, a){ o.er = (1 - Math.pow(1 - p, 3)) * TAU * (a.turns || 2) * (a.dir || 1); },
  flip(o, p, t, a){ o.esx = Math.cos(p * TAU * (a.turns || 1)); },
  hop(o, p, t, a){ o.ey = -Math.abs(Math.sin(p * Math.PI * (a.n || 3))) * o.r * (a.h || 1.2) * (1 - p * 0.5); },
  haunt(o, p, t, a){ const ang = p * TAU; o.ex = Math.sin(ang) * o.r * 3; o.ey = -Math.sin(ang * 2) * o.r * 1.2; o.ea = 0.3 + 0.7 * (1 - bell(p)); },
  shake(o, p, t, a){ const m = 1 - p; o.ex = Math.sin(t * 70) * o.r * 0.09 * m; o.er = Math.sin(t * 50) * 0.14 * m; },
  pounce(o, p, t, a){ const m = bell(p); o.ex = (a.tx - o.hx) * m * 0.8; o.ey = (a.ty - o.hy) * m * 0.8 - m * o.r * 1.2; },
  rise(o, p, t, a){ const m = p < 0.6 ? easeIO(p / 0.6) : 1 - easeIO((p - 0.6) / 0.4); o.ex = (a.tx - o.hx) * m; o.ey = (a.ty - o.hy) * m; o.esx = o.esy = 1 - m * 0.6; o.er = m * TAU; },
  vanish(o, p, t, a){ o.ea = p < 0.85 ? 0 : (p - 0.85) / 0.15; },
  headspin(o, p, t, a){ o.er = Math.sin(p * Math.PI) * Math.PI * 0.9; },
  dangle(o, p, t, a){ o.ey = bell(p) * o.r * 3.2; o.er = Math.sin(t * 3) * 0.1; },
  swing(o, p, t, a){ o.er = Math.sin(p * TAU * 3) * 0.7 * (1 - p); },
  toss(o, p, t, a){ const m = bell(p); o.ex = a.dx * m; o.ey = -m * o.r * 3; o.er = p * TAU * 2; },
  drop(o, p, t, a){ const yb = Math.max(0, H - o.r - o.hy); let d; if (p < 0.4) d = yb * Math.pow(p / 0.4, 2); else if (p < 0.55) d = yb * (1 - Math.sin((p - 0.4) / 0.15 * Math.PI) * 0.25); else d = yb * (1 - easeIO((p - 0.55) / 0.45)); o.ey = d; o.er = p * 3; },
  swap(o, p, t, a){ const m = easeIO(p); o.ex = a.dx * m; o.ey = a.dy * m - bell(p) * o.r; },
  pulse(o, p, t, a){ o.esx = o.esy = 1 + Math.abs(Math.sin(p * Math.PI * 6)) * 0.28 * (1 - p); },
  open(o, p, t, a){ const m = bell(p); o.esx = 1 + m * 0.45; o.esy = 1 - m * 0.15; },
  sneak(o, p, t, a){ ANIM.drive(o, p, t, a); o.ey = -Math.abs(Math.sin(t * 9)) * o.r * 0.15; a.bump = 2; },
  wake(o, p, t, a){ o.ey = -bell(Math.min(1, p * 3)) * o.r * 0.8; o.ex = Math.sin(t * 60) * o.r * 0.05 * (1 - p); },
};

/* things that happen to the whole wall */
const EVT = {
  wave:   { apply(e, p, t){ const front = H * (1 - 0.92 * bell(p)); e.front = front;
              for (const o of live){ if (o.special) continue; const w = Math.max(0, Math.min(1, (o.hy - front) / (unit * 3)));
                if (!w) continue; const sw = Math.sin(Math.min(1, p * 1.25) * Math.PI);
                o.ex += w * sw * unit * 6 * e.dir + Math.sin(t * 2 + o.ph) * w * unit * 0.6; o.ey -= w * bell(p) * unit * 1.6; o.er += w * Math.sin(t * 2.2 + o.ph) * 0.25; } },
            draw(e, p, t){ const f = e.front; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
              ctx.beginPath(); ctx.moveTo(0, H + 10);
              for (let x = 0; x <= W + 20; x += 18) ctx.lineTo(x, f + Math.sin(x / (unit * 2) + t * 4) * unit * 0.7);
              ctx.lineTo(W + 20, H + 10); ctx.closePath();
              ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fill(); ctx.lineWidth = LW; ctx.stroke();
              ctx.lineWidth = LW * 0.6;
              for (let k = 1; k < 4; k++){ ctx.beginPath(); for (let x = 0; x <= W + 20; x += 18){ const y = f + k * unit * 2.2 + Math.sin(x / (unit * 2.4) + t * 3 + k) * unit * 0.5; if (x) ctx.lineTo(x, y); else ctx.moveTo(x, y); } ctx.stroke(); }
              for (let x = unit; x < W; x += unit * 5){ const y = f + Math.sin(x / (unit * 2) + t * 4) * unit * 0.7; ctx.beginPath(); ctx.arc(x, y - unit * 0.4, unit * 0.4, Math.PI * 0.2, Math.PI * 1.4); ctx.stroke(); } } },
  flash:  { draw(e, p){ ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255,255,255,${(1 - p) * 0.85})`; ctx.fillRect(0, 0, cv.width, cv.height); } },
  wind:   { apply(e, p, t){ for (const o of live){ if (o.special) continue; o.ex += e.dir * bell(p) * unit * (o.fx ? 3 : 1.8); o.er += e.dir * bell(p) * 0.3 * (o.fx ? 1.4 : 1); } } },
  bow:    { apply(e, p){ for (const o of live) if (o.face && !o.special && o !== e.o){ o.er += Math.sign(e.x - o.hx) * 0.4 * bell(p); o.esy *= 1 - 0.14 * bell(p); } } },
  dance:  { apply(e, p, t){ const k = bell(p); for (const o of live){ if (o.special) continue; o.er += Math.sin(t * 9 + o.ph) * 0.24 * k; o.ey -= Math.abs(Math.sin(t * 9 + o.ph)) * unit * 0.5 * k; } } },
  beat:   { apply(e, p, t){ const b = Math.pow(Math.max(0, Math.sin(t * 13)), 6) * bell(p); for (const o of live) if (!o.special){ o.esx *= 1 + 0.14 * b; o.esy *= 1 + 0.14 * b; } } },
  spinall:{ apply(e, p){ const a = easeIO(p) * TAU; for (const o of live) if (!o.special) o.er += a; } },

  scan:   { apply(e, p, t){ const y = p * (H + 60) - 30; e.y = y; for (const o of live){ if (o.special) continue; if (Math.abs(o.hy - y) < o.r && o.scanT !== e.t0){ o.scanT = e.t0; kick(o, 0.6); } } },
            draw(e){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineWidth = LW * 0.6; ctx.setLineDash([unit * 0.6, unit * 0.5]); ctx.beginPath(); ctx.moveTo(0, e.y); ctx.lineTo(W, e.y); ctx.stroke(); ctx.setLineDash([]); } },
  pull:   { apply(e, p){ for (const o of live){ if (o.special || o === e.o) continue; const dx = e.x - o.hx, dy = e.y - o.hy, d = Math.hypot(dx, dy); if (d < e.R){ const k = bell(p) * (1 - d / e.R) * 0.6; o.ex += dx * k; o.ey += dy * k; } } } },
  jitter: { apply(e, p, t){ for (const o of live){ if (o.special) continue; const d = Math.hypot(o.hx - e.x, o.hy - e.y); if (d < e.R){ const k = (1 - p) * (1 - d / e.R); o.ex += Math.sin(t * 80 + o.ph * 9) * unit * 0.25 * k; o.er += Math.sin(t * 60 + o.ph) * 0.2 * k; } } } },
  hypno:  { apply(e, p){ for (const o of live){ if (o.special || o === e.o) continue; const d = Math.hypot(o.hx - e.x, o.hy - e.y); if (d < e.R) o.er += easeIO(p) * TAU * 1.5 * (1 - d / e.R); } } },
  domino: { apply(e, p){ for (const o of live){ if (o.special) continue; const d = Math.hypot(o.hx - e.x, o.hy - e.y); if (d < e.R){ const q = p * 1.6 - d / e.R; if (q > 0 && q < 0.3) o.ey -= Math.sin(q / 0.3 * Math.PI) * unit * 1.4; } } } },
  march:  { apply(e, p, t){ for (const o of live) if (o.face && !o.special) o.ey -= Math.abs(Math.sin(t * 8 + o.hx / W * 3)) * unit * 0.7 * bell(p); } },
  rain:   { apply(e, p){ for (const o of live) if (Math.abs(o.hx - e.x) < e.w && o.hy > e.y && o.face) o.fearKick = Math.max(o.fearKick, 0.5); },
            draw(e, p, t){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineWidth = LW * 0.5; ctx.beginPath();
              for (let i = 0; i < 40; i++){ const x = e.x - e.w + ((i * 37.3) % 1) * 0 + (i / 40) * e.w * 2, y = e.y + ((t * unit * 14 + i * 53) % (H - e.y)); ctx.moveTo(x, y); ctx.lineTo(x - unit * 0.15, y + unit * 0.7); }
              ctx.stroke(); } },
  ink:    { draw(e, p){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); const r = e.R * Math.min(1, p * 3); ctx.fillStyle = `rgba(17,17,17,${0.8 * (1 - Math.max(0, p - 0.4) / 0.6)})`;
              ctx.beginPath(); for (let i = 0; i <= 24; i++){ const a = i / 24 * TAU, rr2 = r * (0.8 + 0.2 * Math.sin(a * 5 + e.t0)); i ? ctx.lineTo(e.x + Math.cos(a) * rr2, e.y + Math.sin(a) * rr2) : ctx.moveTo(e.x + Math.cos(a) * rr2, e.y + Math.sin(a) * rr2); } ctx.fill(); } },
  beam:   { draw(e, p){ const o = e.o, tx = e.tx, ty = e.ty, x = posX(o), y = posY(o) + o.r * 0.3; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineWidth = LW * 0.6;
              ctx.setLineDash([unit * 0.4, unit * 0.35]); ctx.beginPath(); ctx.moveTo(x - o.r * 0.3, y); ctx.lineTo(tx - unit * 1.2, ty + unit); ctx.moveTo(x + o.r * 0.3, y); ctx.lineTo(tx + unit * 1.2, ty + unit); ctx.stroke(); ctx.setLineDash([]); } },
  scribble:{ draw(e, p){ const n = Math.floor(e.pts.length * Math.min(1, p * 2.2)); if (n < 2) return; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = p > 0.7 ? (1 - p) / 0.3 : 1;
              ctx.lineWidth = LW; ctx.beginPath(); ctx.moveTo(e.pts[0][0], e.pts[0][1]); for (let i = 1; i < n; i++) ctx.lineTo(e.pts[i][0], e.pts[i][1]); ctx.stroke(); ctx.globalAlpha = 1; } },
  ripple: { draw(e, p){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineWidth = LW * 0.6; for (let k = 0; k < 3; k++){ const q = p * 1.5 - k * 0.2; if (q <= 0 || q >= 1) continue;

/* the night lights: anything listed here punches a hole in the dark */
function lightsNow(t){
  const L = [];
  if (torch.a > 0.01) L.push({ x:torch.x, y:torch.y, r:torchR(), a:torch.a });
  for (const e of EV){
    const p = (t - e.t0) / e.dur; if (p < 0 || p > 1) continue;
    const env = Math.min(1, p * 6) * (p > 0.75 ? (1 - p) / 0.25 : 1);
    if (e.type === "light"){ const o = e.o, fl = e.flicker ? 0.85 + 0.15 * Math.sin(t * 23 + Math.sin(t * 7) * 3) : 1;
      L.push({ x:o ? posX(o) + (e.dx || 0) * o.r : e.x, y:o ? posY(o) + (e.dy || 0) * o.r : e.y, r:e.R * fl, a:env }); }
    if (e.type === "cone"){ const o = e.o; L.push({ cone:true, x:posX(o), y:posY(o) + o.r * (e.dy || 0), ang:e.ang, spread:e.spread, len:e.len, a:env }); }
    if (e.type === "siren"){ const o = e.o, on = Math.floor(t * 5) % 2; L.push({ x:posX(o) + (on ? -1 : 1) * o.r * 1.2, y:posY(o) - o.r * 0.6, r:unit * 4, a:env }); }
    if (e.type === "sweep"){ const o = e.o; L.push({ cone:true, x:posX(o), y:posY(o) - o.r * 0.5, ang:t * 1.6, spread:0.35, len:Math.max(W, H), a:env }); }
    if (e.type === "beam" && scene === "night"){ L.push({ cone:true, x:posX(e.o), y:posY(e.o), ang:Math.atan2(e.ty - posY(e.o), e.tx - posX(e.o)), spread:0.4, len:Math.hypot(e.tx - posX(e.o), e.ty - posY(e.o)) + unit * 2, a:env }); }
  }
  if (NM){ const b = NM.box, k = NM.release ? Math.max(0, 1 - (t - NM.release) / 1.2) : Math.min(1, (t - NM.t0) / 1.5);
    L.push({ x:(b.x0 + b.x1) / 2, y:(b.y0 + b.y1) / 2, rx:(b.x1 - b.x0) / 2 + NM.sp * 3, ry:(b.y1 - b.y0) / 2 + NM.sp * 3, r:1, a:k }); }
  for (const q of PT) if (q.glow) L.push({ x:q.x, y:q.y, r:unit * 1.8 * q.glow, a:Math.min(1, (q.life - q.age) / 0.5) });
  return L;
}

const scribblePath = (x, y) => { const pts = []; let a = rn(0, TAU); for (let i = 0; i < 120; i++){ a += rn(-0.6, 0.6); x += Math.cos(a) * unit * 0.7; y += Math.sin(a) * unit * 0.7;
  if (x < 0 || x > W) a = Math.PI - a; if (y < 0 || y > H) a = -a; pts.push([x, y]); } return pts; };

const ptr = { x:-1e4, y:-1e4, on:false };

function poke(x, y){
  if (trans) return;
  if (NM){ if (NOW() > NM.formedAt - 0.4) releaseName(); return; }
  const t = NOW();
  let hit = null, best = 1e9;
  for (const o of live){
    const cx = posX(o), cy = posY(o), d = Math.hypot(cx - x, cy - y);
    const reach = o.r * (o.special ? 1.0 : 1.05);
    if (d < reach && d / o.r < best && o.ea > 0.3){ best = d / o.r; hit = o; }
  }
  /* the sun, the moon and the torch do their one job and nothing else */
  if (hit && hit.special){ AUD.play(hit, 0, 1.3); hit.pop = 1; EFFECT[hit.kind](hit); return; }
  for (const o of live){
    if (o.special) continue;
    const cx = o.hx + o.ox, cy = o.hy + o.oy, d = Math.hypot(cx - x, cy - y), reach = o.r + unit * 5;
    if (d < reach && d > 0.1){

      o.vx += (cx - x) / d * kk * push; o.vy += (cy - y) / d * kk * push;
      if (o.temper === "shy" || o.temper === "skit") o.fearKick = Math.max(o.fearKick, 1 - d / reach);
      if (o.temper === "grump") o.angKick = Math.max(o.angKick, (1 - d / reach) * 0.8);
    }
  }
  /* what you clicked makes its own noise and does its own trick */
  if (hit){
    hit.pop = 1; hit.sq = 0.3;
    AUD.play(hit, 0, 1.25);
    (EFFECT[hit.kind] || EFFECT.mark)(hit);
    if (hit.face && hit.face.mouth) talk(hit, 0.5);
  }

  const span = unit * 12, night = scene === "night";
  const talkers = live.filter(o => o !== hit && o.face && o.face.mouth && !o.special)
    .map(o => [o, Math.hypot(o.hx + o.ox - x, o.hy + o.oy - y)]).filter(([, d]) => d < span)
    .sort((a, b) => a[1] - b[1]).slice(0, night ? 6 : 10);
  talkers.forEach(([o, d], i) => {
    const delay = 0.22 + (d / span) * 0.4 + Math.random() * 0.1, syl = 2 + Math.floor(Math.random() * 4);
    const dur = AUD.chatter(panOf(o), o.r, (1 - i * 0.04) * (night ? 0.4 : 0.7), syl, delay) || syl * 0.12;
    o.talkA = t + delay; o.talkB = t + delay + dur; o.talkHz = syl / dur;
  });
}

function update(dt, t){
  /* scene change: fade to black, swap the wall, fade into the new light */
  if (trans){
    const p = (t - trans.t0) / 1.6;
    veil = p < 0.5 ? p / 0.5 : Math.max(0, 1 - (p - 0.5) / 0.5);
    if (p >= 0.5 && !trans.swapped){ trans.swapped = true; scene = trans.to; torch.on = false; layout(seeds[scene]); darkA = scene === "night" ? 0.95 : 0; setHint();

    ANIM[a.type](o, p, t, a);
    if (a.bump){                                                    /* whatever it races past gets bumped (or pinched) */
      const x = posX(o), y = posY(o);
      for (const q of live){ if (q === o || q.special || t - q.bumpT < 0.8) continue;
        if (Math.abs(q.hx - x) < (o.r + q.r) * 0.7 && Math.abs(q.hy - y) < (o.r + q.r) * 0.7){ q.bumpT = t;
          if (a.bump === 2 && !q.an && !q.face) anim(q, "vanish", 2.4); else kick(q, 0.9); } }
    }
  }

Object.assign(PDEF, {
  slice:()=>[S([[-0.7, -0.6], [0.7, -0.6], [0, 0.8]], true, "w", true), S([[-0.76, -0.76], [0.76, -0.76]])],
  flake:()=>[S([[-0.8, 0], [0.8, 0]]), S([[-0.4, -0.7], [0.4, 0.7]]), S([[0.4, -0.7], [-0.4, 0.7]])],

let NM = null;
const FONT = '"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Inter",system-ui,sans-serif';
function nameTargets(text){
  const c = document.createElement("canvas"), g = c.getContext("2d");
  /* on a narrow screen a longer name goes on two lines, so the letters stay big */
  const ch = Array.from(text);
  let lines = [text];
  if (W < H && ch.length > 4){ const sp0 = text.indexOf(" ", Math.floor(text.length / 2) - 2); const cut = sp0 > 0 && sp0 < text.length - 1 ? sp0 : Math.ceil(ch.length / 2);
    lines = sp0 > 0 && sp0 < text.length - 1 ? [text.slice(0, cut).trim(), text.slice(cut).trim()] : [ch.slice(0, cut).join(""), ch.slice(cut).join("")]; }
  g.font = `900 100px ${FONT}`;
  const wid = Math.max(1, ...lines.map(l => g.measureText(l).width));
  const top = 70, bottom = 90, room = H - top - bottom;
  const fs = Math.min(room * 0.62 / lines.length, 100 * W * 0.88 / wid);
  c.width = Math.ceil(W); c.height = Math.ceil(H);
  g.font = `900 ${fs}px ${FONT}`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "#000";
  const cy = top + room * 0.5;
  lines.forEach((l, i) => g.fillText(l, W / 2, cy + (i - (lines.length - 1) / 2) * fs * 1.05));
  const px = g.getImageData(0, 0, c.width, c.height).data;
  const pool = live.filter(o => !o.special).length;
  let sp = Math.max(unit * 0.6, fs / 9), pts = [];
  for (let tries = 0; tries < 6; tries++){
    pts = [];
    const dy = sp * 0.87;
    for (let y = sp / 2, row = 0; y < c.height; y += dy, row++) for (let x = (row % 2 ? sp / 2 : 0) + sp / 4; x < c.width; x += sp){
      const i = (Math.round(y) * c.width + Math.round(x)) * 4 + 3; if (px[i] > 120) pts.push([x, y]);
    }
    if (pts.length <= pool * 0.75) break;

  }

  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of pts){ x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  return { pts, sp, box:{ x0:x0 - sp, y0:y0 - sp, x1:x1 + sp, y1:y1 + sp } };
}
function makeName(text){
  if (NM) return;
  const T = nameTargets(text);
  if (!T){ toast("Those letters cannot be drawn — try another name."); return; }
  const t = NOW(), { pts, sp, box } = T;
  const free = live.filter(o => !o.special);
  free.forEach(o => { o.an = null; });
  /* the nearest ones to each spot are fetched; the smallest are preferred, so the letters stay fine */
  const order = pts.slice().sort(() => Math.random() - 0.5), taken = new Set(), carriers = [];
  for (const [x, y] of order){
    let best = null, bd = 1e12;
    for (const o of free){ if (taken.has(o)) continue; const d = Math.hypot(o.hx - x, o.hy - y) + (o.kind === "mark" ? unit * 8 : 0) + Math.abs(o.r - sp * 0.6) * 0.8; if (d < bd){ bd = d; best = o; } }

    best.nmS = { tx:x, ty:y, f, delay:0.5 + Math.random() * 1.6 + dist / Math.max(W, H) * 0.6, dur:0.9 + dist / Math.max(W, H) * 1.1, m:0, carry:true };

  for (const o of live){
    if (taken.has(o)) continue;
    if (o.hx > box.x0 - o.r * 0.5 && o.hx < box.x1 + o.r * 0.5 && o.hy > box.y0 - o.r * 0.5 && o.hy < box.y1 + o.r * 0.5){
      const up = o.hy < cy, ty = up ? Math.max(o.r * 0.6, box.y0 - o.r * rn(0.6, 1.6)) : Math.min(H - o.r * 0.6, box.y1 + o.r * rn(0.6, 1.6));
      o.an = null;
      o.nmS = { tx:o.hx + rn(-1, 1) * unit * 2, ty, f:o.special ? 1 : 0.7, delay:Math.random() * 0.5, dur:0.7, m:0, carry:false };
    }
  }

  AUD.sfx("bustle", W / 2, 0, 1);
  creatures().forEach((q, i) => { if (i % 3 === 0){ const d = rn(0, 2.2); setTimeout(() => talk(q, 0.6), d * 1000); } });
  setTimeout(() => { if (!NM) return; AUD.sfx("tada", W / 2, 0, 1); burst("confetti", cx, box.y0, 24, 1.3); toast("Tap anywhere to let them go."); }, 3600);
}
function releaseName(){

function applyName(t){
  let busy = false;
  for (const o of live){
    const s = o.nmS; if (!s) continue;
    let m;

    else { const p = (t - NM.release - s.rd) / (s.dur * 0.9); m = p <= 0 ? 1 : p >= 1 ? 0 : 1 - easeIO(p); }

const paint = document.createElement("canvas"), pg2 = paint.getContext("2d");
function clearPaint(){ paint.width = cv.width; paint.height = cv.height; pg2.clearRect(0, 0, paint.width, paint.height); }
const crayonOf = () => live.find(o => o.special === "crayon");
let crayonDrag = null, lastTip = null, scribbleT = 0;
const CRAY_NAMES = { en:["red", "orange", "yellow", "green", "blue", "purple", "pink", "brown"], ko:["빨강", "주황", "노랑", "초록", "파랑", "보라", "분홍", "갈색"] };
const tipOf = (o) => { const P = pose(o, NOW()), a = P.rot; return [P.x + Math.cos(a) * o.r * 0.95 * (P.sx / o.r), P.y + Math.sin(a) * o.r * 0.95 * (P.sx / o.r)]; };
function nextColour(o){
  o.ci = (o.ci + 1) % CRAYON.length; o.color = CRAYON[o.ci]; o.spr = null; o.pop = 1;
  AUD.sfx("pop", o.hx, 0, 1); AUD.sfx("ting", o.hx, 0.06, 0.6);
  toast(LANG === "ko" ? `크레용: ${CRAY_NAMES.ko[o.ci]}` : `Crayon: ${CRAY_NAMES.en[o.ci]}`);
}
/* wax on paper: lots of little specks, thicker in the middle, with gaps where the paper shows */
function waxLine(x0, y0, x1, y1, col){
  const w = Math.max(8, unit * 0.62), d = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(d / (w * 0.14)));
  pg2.setTransform(dpr, 0, 0, dpr, 0, 0); pg2.fillStyle = col;
  for (let i = 0; i <= n; i++){
    const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
    for (let k = 0; k < 16; k++){
      const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * w * 0.5;
      pg2.globalAlpha = 0.3 + Math.random() * 0.5;
      const s = 0.8 + Math.random() * 2.2;
      pg2.fillRect(x + Math.cos(a) * r, y + Math.sin(a) * r, s, s * (0.6 + Math.random()));
    }
  }
  pg2.globalAlpha = 1;
}
/* some doodles have their own ideas about being coloured in */
const SOAKS = ["ghost", "wisp", "cloud", "cloudlet", "mist", "blossom", "flower", "balloon", "egg", "snowman", "sun_", "pillow", "bubble"];
function crayonTouches(x, y, col, t){
  for (const o of live){
    if (o.special || o.nmS || t - (o.crT || 0) < 1.3) continue;
    if (Math.hypot(posX(o) - x, posY(o) - y) > o.r * 0.85) continue;
    o.crT = t;
    if (SOAKS.includes(o.kind)){ o.tint = col; o.spr = null; o.pop = 0.8; AUD.sfx("bubble", o.hx, 0, 0.5); continue; }        /* soaks the colour up */
    if (o.kind === "cat" || o.kind === "blackcat" || o.kind === "dog"){ anim(o, "pounce", 0.9, { tx:x, ty:y }); AUD.play(o, 0, 0.7); continue; }   /* chases the tip */
    if (["fish", "fishy", "duck", "waves", "drop"].includes(o.kind)){ event("ripple", 1.4, { x:o.hx, y:o.hy, R:unit * 3 }); AUD.sfx("waves", o.hx, 0, 0.5); continue; }
    if (["cactus", "spiky", "saw"].includes(o.kind)){ anim(o, "shake", 0.6); if (crayonDrag){ crayonDrag.snag = t; } AUD.sfx("snip", o.hx, 0, 0.6); continue; }
    if (o.temper === "grump" && o.face){                        /* will not have it: shakes the colour off */
      o.angKick = 1.3; anim(o, "shake", 0.9);
      setTimeout(() => { pg2.setTransform(dpr, 0, 0, dpr, 0, 0); pg2.globalCompositeOperation = "destination-out"; pg2.beginPath(); pg2.arc(o.hx, o.hy, o.r * 1.15, 0, TAU); pg2.fill(); pg2.globalCompositeOperation = "source-over";
        burst("puff", o.hx, o.hy, 5, 0.6, { s:unit * 0.35 }); }, 500);
      AUD.play(o, 0, 0.8); continue; }
    if (o.temper === "bold" && o.face){ o.joy = 1; anim(o, "hop", 0.9, { n:3, h:0.5 }); talk(o, 0.6); AUD.sfx("giggle", o.hx, 0, 0.7); continue; }   /* ticklish */
    if (o.fx && (o.motion === "spin" || o.motion === "twinkle")){ o.spinV += 18; AUD.play(o, 0, 0.5); continue; }    /* gets spun round */
    if (o.temper === "shy" || o.temper === "skit"){ o.fearKick = 1; const dx = o.hx - x, dy = o.hy - y, d = Math.hypot(dx, dy) || 1; o.vx += dx / d * unit * 30; o.vy += dy / d * unit * 30; continue; }
  }
}
function crayonDown(e){
  const o = crayonOf(); if (!o || trans || NM) return false;
  if (Math.hypot(e.clientX - posX(o), e.clientY - posY(o)) > o.r * 1.05) return false;
  crayonDrag = { o, x:e.clientX, y:e.clientY, moved:false, t:performance.now() };
  lastTip = null; return true;
}
function crayonMove(e){
  const c = crayonDrag; if (!c) return;
  if (!c.moved && Math.hypot(e.clientX - c.x, e.clientY - c.y) > 6) c.moved = true;
  if (!c.moved) return;
  const o = c.o, t = NOW();
  /* the tip sits under your finger; the crayon leans as you draw */
  const ang = -0.7 + Math.max(-0.4, Math.min(0.4, (e.movementX || 0) * 0.02));
  o.drawRot = ang;
  const tx = e.clientX, ty = e.clientY;
  o.ox = tx - Math.cos(ang) * o.r * 0.95 - o.hx; o.oy = ty - Math.sin(ang) * o.r * 0.95 - o.hy; o.vx = o.vy = 0;
  if (paint.width !== cv.width || paint.height !== cv.height) clearPaint();
  if (lastTip) waxLine(lastTip[0], lastTip[1], tx, ty, o.color);
  lastTip = [tx, ty];
  if (performance.now() - scribbleT > 70){ scribbleT = performance.now(); AUD.sfx("scribble", tx, 0, 0.7); }
  crayonTouches(tx, ty, o.color, t);
}
function crayonUp(){
  const c = crayonDrag; if (!c) return false;
  crayonDrag = null; lastTip = null;
  if (!c.moved) nextColour(c.o);
  c.o.drawRot = null;                                           /* and it springs back home */
  return true;
}

let last = performance.now(), visible = true;
function frame(now){
  requestAnimationFrame(frame);
  if (!visible) return;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  update(dt, t);
  const boil = Math.floor(now / (reduce ? 600 : 130)) % BOILS;
  ctx.globalAlpha = 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111";
  const night = scene === "night";
  const order = live.filter(o => !(o.special && (night || o.special === "crayon"))).sort((a, b) => (a.fear + a.ang + a.pop + a.joy + (a.an ? 2 : 0) + (a.nmS && a.nmS.carry ? 5 : 0)) - (b.fear + b.ang + b.pop + b.joy + (b.an ? 2 : 0) + (b.nmS && b.nmS.carry ? 5 : 0)));
  for (const o of order) drawItem(o, t, boil);
  for (const e of EV){ const p = (t - e.t0) / e.dur; if (p >= 0 && p <= 1 && EVT[e.type] && EVT[e.type].draw){ ctx.strokeStyle = "#111"; EVT[e.type].draw(e, p, t); } }
  /* the wax goes over the marker like a colouring book */
  if (!night && paint.width === cv.width && paint.height === cv.height){ ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "multiply"; ctx.drawImage(paint, 0, 0); ctx.globalCompositeOperation = "source-over"; }
  if (!night){ const c = crayonOf(); if (c){ ctx.strokeStyle = "#111"; drawItem(c, t, boil); } }
  drawParticles(t);
  if (night){
    drawDark(t);
    if (paint.width === cv.width && paint.height === cv.height){ ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 0.92; ctx.drawImage(paint, 0, 0); ctx.globalAlpha = 1; }
    /* what can always be seen at night: the moon, the torch, and a few pairs of eyes */
    for (const o of live){ if (o.special){
      const P = pose(o, t);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const gl = ctx.createRadialGradient(P.x, P.y, o.r * 0.4, P.x, P.y, o.r * (o.special === "moon" ? 2.4 : o.special === "crayon" ? 1.2 : torch.on ? 1.9 : 1.4));
      gl.addColorStop(0, o.special === "moon" ? "rgba(255,232,150,.32)" : o.special === "crayon" ? "rgba(255,255,255,.16)" : torch.on ? "rgba(255,224,102,.4)" : "rgba(255,120,100,.18)"); gl.addColorStop(1, "rgba(255,232,150,0)");
      ctx.fillStyle = gl; ctx.fillRect(P.x - o.r * 2.4, P.y - o.r * 2.4, o.r * 4.8, o.r * 4.8);
      ctx.strokeStyle = "#111"; drawItem(o, t, boil);
    } }
    for (const o of live) if ((o.glow || o.kind === "glare") && o.ea > 0.3 && (o.kind === "glare" || o.glowT > 0 || Math.sin(t * 0.7 + o.ph) > 0.2)) drawGlowEyes(o, t);
  }
  if (veil > 0){ ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(6,8,18,${veil})`; ctx.fillRect(0, 0, cv.width, cv.height); }
}

resize(); layout(seeds.day); setHint();
let rT = 0, lastSize = [W, H];
addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => {
  resize();
  if (Math.abs(W - lastSize[0]) > 40 || Math.abs(H - lastSize[1]) > 40){ lastSize = [W, H]; layout(seeds[scene]); }
}, 160); });
requestAnimationFrame(frame);

document.addEventListener("visibilitychange", () => { visible = !document.hidden; AUD.pause(document.hidden); last = performance.now(); });

/* ---------- controls ---------- */
$("b-new").onclick = () => {
  AUD.unlock();
  seeds[scene] = (Date.now() % 1e9) | 0; torch.on = false; layout(seeds[scene]); setHint();
  for (const o of live){ o.pop = 0.6 + Math.random() * 0.4; o.sq = 0.3; }
  for (let i = 0; i < 6; i++) setTimeout(() => { const o = live[Math.floor(Math.random() * live.length)]; if (o) AUD.chatter(panOf(o), o.r, scene === "night" ? 0.6 : 1.2); }, i * 60);
  toast("A whole new crowd.");
};
let soundOn = true;
$("b-sound").onclick = (e) => {
  AUD.unlock();
  soundOn = !soundOn; AUD.setOn(soundOn);
  e.currentTarget.setAttribute("aria-pressed", String(soundOn));
  e.currentTarget.textContent = L(soundOn ? "Sound on" : "Sound off");
  toast(soundOn ? "The chatter is back." : "Quiet now.");
};
addEventListener("keydown", e => { if (e.key === "Escape") ptr.on = false; });

})();
</script>
</body>
</html>
