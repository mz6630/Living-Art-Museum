<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pulse Room — Living Art Museum</title>
<meta name="description" content="A dark room of hanging light bulbs, each one flashing with the heartbeat of a visitor. Give your pulse — a fingertip on your phone's camera, or tap along with your heart — and it lights the first bulb, pushing everyone else's one bulb along. After Rafael Lozano-Hemmer's Pulse Room (2006), from the Living Art Museum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--serif:Fraunces,"Noto Serif KR",Georgia,serif;}
html[lang="ko"]{--serif:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;}
/* ==========================================================================
   PULSE ROOM — after Rafael Lozano-Hemmer (2006).
   Rows of bare bulbs hang in the dark. Each one flashes with a heartbeat
   someone left here. Give yours: it goes to the first bulb, and every other
   heartbeat moves one bulb along; the oldest goes out.
   ========================================================================== */
:root{
  --ink:#f3ede2; --ink-dim:rgba(243,237,226,.66); --ink-faint:rgba(243,237,226,.4);
  --glass-a:rgba(255,255,255,.1); --glass-b:rgba(255,255,255,.04); --glass-line:rgba(255,255,255,.13);
  --chip-on:rgba(255,246,230,.94); --chip-on-ink:#120d08; --accent:#ffb45a; --red:#ff5a4a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{background:#050403;color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}
.glass{background:linear-gradient(180deg,var(--glass-a),var(--glass-b));backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid var(--glass-line);box-shadow:0 24px 60px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08);}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}

.top{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:20px;z-index:10;display:flex;align-items:center;gap:14px;pointer-events:none;}
.top > *{pointer-events:auto;}
.logo{font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1;white-space:nowrap;text-decoration:none;color:var(--ink);}
.title{margin-left:auto;text-align:right;max-width:46vw;}
.title h1{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25;}
.title p{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
body.embedded .top{display:none;}

#count{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:11;padding:8px 14px;border-radius:999px;font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-dim);white-space:nowrap;}
body.embedded #count{top:calc(70px + env(safe-area-inset-top,0px));}
#count b{color:var(--ink);font-weight:500;}

#bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:4px;padding:6px;border-radius:20px;max-width:calc(100% - 20px);}
.chip{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:14px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;transition:background .2s,color .2s;}
.chip svg{width:18px;height:18px;flex:none;}
.chip:hover{color:var(--ink);background:rgba(255,255,255,.08);}
.chip[aria-pressed="true"],.chip.hot{background:var(--chip-on);color:var(--chip-on-ink);}
.chip.ic{padding:9px 10px;}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--glass-line);}
.ico{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
#snd[aria-pressed="false"] .on, #snd[aria-pressed="true"] .off{display:none;}
#hint{position:fixed;left:50%;top:var(--hint-y,90px);transform:translate(-50%,-50%);z-index:11;padding:9px 15px;border-radius:999px;font-size:12.5px;color:var(--ink);white-space:nowrap;pointer-events:none;transition:opacity .5s;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;}
#hint.off{opacity:0;}
#tip{position:fixed;z-index:9;padding:6px 10px;border-radius:10px;font-size:11.5px;pointer-events:none;white-space:nowrap;display:none;transform:translate(-50%,-130%);}
#tip b{font-family:"JetBrains Mono",monospace;font-weight:500;}
#tip .nm{display:block;font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px;}

/* giving a pulse */
#give{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(0,0,0,.55);}
body.giving #give{display:grid;}
#give .box{width:min(420px,calc(100% - 24px));border-radius:24px;padding:18px;text-align:center;}
#give h2{font-family:var(--serif);font-size:19px;font-weight:600;}
#give .sub{font-size:12.5px;color:var(--ink-dim);margin-top:6px;line-height:1.55;}
#give .name{display:flex;align-items:center;gap:10px;margin-top:14px;padding:4px 4px 4px 14px;border-radius:14px;border:1px solid var(--glass-line);background:rgba(255,255,255,.04);text-align:left;}
#give .name span{font-size:12px;color:var(--ink-dim);white-space:nowrap;}
#give .name input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;outline:0;padding:8px 6px;-webkit-user-select:text;user-select:text;}
#give .name input::placeholder{color:var(--ink-faint);}
#give .name:focus-within{border-color:rgba(255,180,90,.6);}
#give .ways{display:flex;gap:6px;margin-top:10px;}
#give .ways .chip{flex:1;justify-content:center;border:1px solid var(--glass-line);}
#sensor{position:relative;margin:16px auto 0;width:200px;height:200px;border-radius:50%;display:grid;place-items:center;touch-action:none;cursor:pointer;}
#sensor canvas{position:absolute;inset:0;width:100%;height:100%;}
#sensor .bpm{position:relative;font-family:var(--serif);font-size:44px;font-weight:600;line-height:1;}
#sensor .u{position:relative;display:block;font-size:11px;color:var(--ink-dim);margin-top:6px;font-family:"JetBrains Mono",monospace;letter-spacing:.1em;}
#sensor video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
#wave{display:block;width:100%;height:46px;margin-top:12px;}
#give .state{font-size:12.5px;color:var(--ink);margin-top:10px;min-height:20px;line-height:1.5;}
#give .row{display:flex;gap:6px;margin-top:12px;}
#give .row .chip{flex:1;justify-content:center;border:1px solid var(--glass-line);}
#give .go{background:var(--red);color:#fff;border-color:transparent !important;}
#give .go[disabled]{opacity:.35;pointer-events:none;}
#give .note{font-size:11px;color:var(--ink-faint);margin-top:10px;line-height:1.5;}

#about{position:fixed;right:20px;top:calc(76px + env(safe-area-inset-top,0px));width:350px;max-height:calc(100% - 170px);overflow:auto;z-index:21;border-radius:22px;padding:20px 20px 18px;display:none;}
body.about #about{display:block;}
#about .tag{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
#about h2{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25;margin-top:8px;padding-right:24px;}
#about p{font-size:12.5px;line-height:1.65;color:var(--ink-dim);margin-top:9px;}
#about h3{font-size:12px;font-weight:600;margin-top:16px;padding-top:14px;border-top:1px solid var(--glass-line);}
#about ol{margin:8px 0 0 18px;font-size:12.5px;line-height:1.6;color:var(--ink-dim);}
#about .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim);}
#about .x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;}
html[lang="ko"] #about .tag,html[lang="ko"] #count{letter-spacing:.02em;}
@media (max-width:760px){
  .chip{padding:8px 10px;font-size:11.5px;gap:5px;} #bar .chip:not(.hot) .lb{display:none;}
  #hint{white-space:normal;text-align:center;border-radius:18px;width:max-content;line-height:1.45;}
  #about{left:10px;right:10px;width:auto;top:calc(64px + env(safe-area-inset-top,0px));}
  .title p{display:none;} .title h1{font-size:13px;}
  #count{top:calc(58px + env(safe-area-inset-top,0px));}
  body.embedded #count{top:calc(64px + env(safe-area-inset-top,0px));}
  #sensor{width:170px;height:170px;}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<header class="top">
  <a class="logo" href="#" onclick="return false">Living Art Museum</a>
  <div class="title"><h1 id="t-h"></h1><p id="t-p"></p></div>
</header>
<div id="count" class="glass"></div>
<div id="hint" class="glass off"></div>
<div id="tip" class="glass"></div>

<nav id="bar" class="glass">
  <button class="chip hot" id="givebtn"><svg class="ico" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/><path d="M3 12h4l2-3 3 6 2-3h7"/></svg><span class="lb"></span></button>
  <button class="chip" id="mine" hidden><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="10" r="5"/><path d="M10 15h4v3h-4zM11 21h2"/></svg><span class="lb"></span></button>
  <span class="sep"></span>
  <button class="chip ic" id="snd" aria-pressed="true"><svg class="ico on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg><svg class="ico off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
  <button class="chip ic" id="info"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</nav>

<section id="give" role="dialog" aria-modal="true">
  <div class="box glass">
    <h2 id="g-h"></h2>
    <p class="sub" id="g-sub"></p>
    <label class="name"><span id="n-l"></span><input id="g-name" type="text" maxlength="16" autocomplete="off" spellcheck="false"></label>
    <div class="ways"><button class="chip" id="w-cam" aria-pressed="false"></button><button class="chip" id="w-tap" aria-pressed="true"></button></div>
    <div id="sensor"><canvas id="ring"></canvas><video id="vid" playsinline muted></video><div><span class="bpm" id="g-bpm">—</span><span class="u">BPM</span></div></div>
    <canvas id="wave"></canvas>
    <div class="state" id="g-state"></div>
    <div class="row"><button class="chip go" id="g-go" disabled></button><button class="chip" id="g-x"></button></div>
    <p class="note" id="g-note"></p>
  </div>
</section>

<section id="about" class="glass" aria-labelledby="ab-h">
  <button class="x" id="about-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="tag" id="ab-tag"></div>
  <h2 id="ab-h"></h2>
  <p id="ab-p1"></p>
  <p id="ab-p2"></p>
  <h3 id="ab-h3"></h3>
  <ol id="ab-ol"></ol>
</section>

<script>
"use strict";
/* ==========================================================================
   0. BASICS
   ========================================================================== */
const LANG = (() => {
  let l = (document.documentElement.lang || "en").slice(0, 2);
  try { const q = new URLSearchParams(location.search).get("lang"); if (q) l = q; } catch (_){}
  return l === "ko" ? "ko" : "en";
})();
document.documentElement.lang = LANG;
if (LANG === "ko") document.title = "펄스 룸 — Living Art Museum";
const T = (o) => (o && (o[LANG] ?? o.en)) || "";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
let seed = 2006; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ==========================================================================
   1. THE ROOM — a grid of bulbs hung at one height under a dark ceiling.
      Bulb 0 is the one nearest the door (front, centre); the line runs on
      from there, row by row, to the back of the room.
   ========================================================================== */
const COLS = 15, ROWS = 10, NB = COLS * ROWS, GAP = 1.15, HANG = 2.9, CEIL = 4.6;
const bulbs = [];
(function build(){
  /* order: the first bulb hangs front and centre, nearest you; the line then spreads outward and back */
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    bulbs.push({ x:(c - (COLS - 1) / 2) * GAP + (rnd() - .5) * .12, z:-(r * GAP + 2.2) + (rnd() - .5) * .12, y:HANG + (rnd() - .5) * .14, sway:rnd() * 6.28, bpm:0, ph:rnd(), id:null, t:0, mine:false, glow:0 });
  const d = (b) => Math.hypot(b.x, (b.z + 2.2) * 1.15) + Math.atan2(b.x, -b.z) * .01;
  bulbs.sort((a, b) => d(a) - d(b));
})();
/* the pulse each bulb carries, newest first */
let PULSES = [], localP = [], sharedP = [], myIds = new Set();
const LKEY = "lam.pulse.v1", COL = "pulseRoom";
function assign(shift){
  const list = mergeP();
  /* when a new pulse arrives, the room goes dark for a moment and everything moves one bulb along */
  if (shift){ dark = 1; wave = 0; }
  for (let i = 0; i < NB; i++){ const p = list[i], b = bulbs[i];
    if (p){ if (b.id !== p.id){ b.bpm = p.b; b.id = p.id; b.t = p.t; b.n = p.n || ""; b.ph = (p.t % 997) / 997; b.mine = myIds.has(p.id); } }
    else { b.bpm = 0; b.id = null; b.mine = false; b.n = ""; } }
  PULSES = list;
  const n = list.length;
  $("count").innerHTML = T({ en:`<b>${n}</b> heartbeat${n === 1 ? "" : "s"} in the room · <b>${NB}</b> bulbs`, ko:`방 안의 심장 박동 <b>${n}</b> · 전구 <b>${NB}</b>개` });
  $("mine").hidden = !bulbs.some(b => b.mine);
}
function mergeP(){ const m = new Map(); for (const p of sharedP.concat(localP)) if (!m.has(p.id)) m.set(p.id, p); return [...m.values()].sort((a, b) => b.t - a.t).slice(0, NB); }

/* ==========================================================================
   2. A HEARTBEAT, AS LIGHT — a quick bright rise on the first beat, a
      smaller one on the second, and the filament's slow fade between
   ========================================================================== */
function beat(phase){
  const a = Math.exp(-phase * 11) * (phase < .015 ? phase / .015 : 1);
  const d = phase > .28 ? Math.exp(-(phase - .28) * 13) * .62 * (phase < .295 ? (phase - .28) / .015 : 1) : 0;
  return Math.min(1, a + d);
}

/* ==========================================================================
   3. DRAWING — a perspective view into the room; the bulbs drawn as glass,
      socket and cord, with a filament and a warm halo that grow with the
      light; the floor catches a little of it
   ========================================================================== */
const cv = $("cv"), g = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, F = 600, small = false;
const cam = { x:0, y:1.55, z:4.2, yaw:0, pitch:-.16, ty:0, tp:-.16 };
function layout(){ DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; small = W <= 760; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  F = W / H < 1 ? H * .8 : Math.min(W, H * 1.6) * .78; cam.z = W / H < 1 ? 3.4 : 4.2;
  document.documentElement.style.setProperty("--hint-y", Math.round(($("bar").getBoundingClientRect().top || H - 72) - 26) + "px"); }
function proj(x, y, z){
  let dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw); let X = dx * cy - dz * sy, Z = dx * sy + dz * cy;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch); let Y = dy * cp - Z * sp; Z = dy * sp + Z * cp;
  if (Z > -.1) return null; const k = F / -Z; return [W / 2 + X * k, H * .52 - Y * k, k];
}
const halo = (() => { const c = document.createElement("canvas"), s = 128; c.width = c.height = s; const q = c.getContext("2d"), gr = q.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, "rgba(255,214,150,1)"); gr.addColorStop(.12, "rgba(255,180,100,.55)"); gr.addColorStop(.4, "rgba(255,140,60,.14)"); gr.addColorStop(1, "rgba(255,120,40,0)"); q.fillStyle = gr; q.fillRect(0, 0, s, s); return c; })();
let dark = 0, wave = 1, hovB = -1, t = 0, myBlink = 0;
function lightOf(b, i){
  if (!b.bpm) return .025 + .015 * Math.sin(t * 1.3 + i);                           /* empty: a filament barely warm */
  const P = 60 / b.bpm, ph = ((t / P + b.ph) % 1 + 1) % 1;
  return .05 + .95 * beat(ph);
}
function render(){
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = "#050403"; g.fillRect(0, 0, W, H);
  /* total light in the room, to tint the walls and floor */
  let sum = 0; const L = bulbs.map((b, i) => { let l = lightOf(b, i); if (dark > 0) l *= 1 - dark; if (wave < 1){ const k = clamp((wave * NB * 1.15 - i) / 6, 0, 1); l *= k; } b.glow = l; sum += l; return l; });
  const amb = sum / NB;
  /* the room itself: floor, back wall, side walls and ceiling, lit only by the bulbs */
  const ZB = -(ROWS * GAP + 3.6), ZN = cam.z - .3, XW = COLS * GAP / 2 + 6;
  const quad = (pts, fill) => { const pp = pts.map(q => proj(q[0], q[1], q[2])); if (pp.some(q => !q)) return; g.beginPath(); pp.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); g.fillStyle = fill; g.fill(); };
  const wc = (k) => `rgb(${10 + amb * 70 * k | 0},${7 + amb * 46 * k | 0},${5 + amb * 22 * k | 0})`;
  quad([[-XW, CEIL, ZB], [XW, CEIL, ZB], [XW, CEIL, ZN], [-XW, CEIL, ZN]], wc(.35));
  quad([[-XW, 0, ZB], [XW, 0, ZB], [XW, CEIL, ZB], [-XW, CEIL, ZB]], wc(.6));
  quad([[-XW, 0, ZB], [-XW, 0, ZN], [-XW, CEIL, ZN], [-XW, CEIL, ZB]], wc(.55));
  quad([[XW, 0, ZB], [XW, 0, ZN], [XW, CEIL, ZN], [XW, CEIL, ZB]], wc(.55));
  { const a = proj(0, 0, ZB), b = proj(0, 0, ZN); if (a && b){ const fg = g.createLinearGradient(0, a[1], 0, Math.min(H, b[1]));
    fg.addColorStop(0, wc(1.1)); fg.addColorStop(1, wc(.45)); quad([[-XW, 0, ZB], [XW, 0, ZB], [XW, 0, ZN], [-XW, 0, ZN]], fg); } }
  /* the light on the back wall and ceiling, where the bulbs are */
  g.globalCompositeOperation = "lighter";
  { const c = proj(0, HANG, ZB + .1); if (c){ const r = c[2] * COLS * GAP * .55; g.globalAlpha = amb * .55; g.drawImage(halo, c[0] - r, c[1] - r * .6, r * 2, r * 1.2); g.globalAlpha = 1; } }
  g.globalCompositeOperation = "source-over";
  /* far to near */
  const order = bulbs.map((b, i) => i).sort((a, b) => bulbs[a].z - bulbs[b].z);
  /* pools of light on the floor */
  g.globalCompositeOperation = "lighter";
  for (const i of order){ const b = bulbs[i], p = proj(b.x, 0, b.z); if (!p) continue; const l = L[i]; if (l < .08) continue;
    const r = p[2] * 1.3; g.globalAlpha = l * .35; g.drawImage(halo, p[0] - r * 1.4, p[1] - r * .45, r * 2.8, r * .9); }
  g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
  for (const i of order){
    const b = bulbs[i], sw = Math.sin(t * .6 + b.sway) * .012, x = b.x + sw, l = L[i];
    const top = proj(x - sw, CEIL, b.z), p = proj(x, b.y, b.z); if (!p || !top) continue;
    const k = p[2], r = Math.max(1.6, k * .085);
    /* the cord */
    g.strokeStyle = `rgba(${30 + l * 60 | 0},${24 + l * 40 | 0},${18 + l * 24 | 0},.9)`; g.lineWidth = Math.max(.6, k * .006); g.beginPath(); g.moveTo(top[0], top[1]); g.lineTo(p[0], p[1] - r * 1.9); g.stroke();
    /* the socket */
    g.fillStyle = "#16120e"; g.fillRect(p[0] - r * .42, p[1] - r * 2.05, r * .84, r * .9);
    g.fillStyle = `rgba(${90 + l * 120 | 0},${70 + l * 80 | 0},${50 + l * 40 | 0},.9)`; g.fillRect(p[0] - r * .34, p[1] - r * 1.2, r * .68, r * .3);
