<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The More, the Better — Living Art Museum</title>
<meta name="description" content="A pagoda of television sets. Click one to bring it close, switch it on and off, turn its channel dial — and put yourself on air: take a photo or a short clip with your camera and it plays on one of the screens. After Nam June Paik's Dadaikseon (1988), from the Living Art Museum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--serif:Fraunces,"Noto Serif KR",Georgia,serif;}
html[lang="ko"]{--serif:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;}
/* ==========================================================================
   THE MORE, THE BETTER — after Nam June Paik's Dadaikseon (1988).
   A tower of television sets stacked in tiers like a pagoda. Every set can be
   brought close, switched on and off, and its channel turned. And you can go
   on air: a photo or a short clip from your camera takes over one of the
   screens — for everyone, or only on this device, as you choose.
   ========================================================================== */
:root{
  --ink:#f2f1ee; --ink-dim:rgba(242,241,238,.68); --ink-faint:rgba(242,241,238,.42);
  --glass-a:rgba(255,255,255,.12); --glass-b:rgba(255,255,255,.05); --glass-line:rgba(255,255,255,.15);
  --chip-on:rgba(255,255,255,.92); --chip-on-ink:#0b0b0d; --accent:#ff5a3c;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#0c0c0f;color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}
.glass{background:linear-gradient(180deg,var(--glass-a),var(--glass-b));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-line);box-shadow:0 24px 60px -30px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.1);}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}

.top{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:20px;z-index:10;display:flex;align-items:center;gap:14px;pointer-events:none;}
.top > *{pointer-events:auto;}
.logo{font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1;white-space:nowrap;text-decoration:none;color:var(--ink);}
.title{margin-left:auto;text-align:right;max-width:46vw;}
.title h1{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25;}
.title p{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
body.embedded .top{display:none;}

#bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:4px;padding:6px;border-radius:20px;max-width:calc(100% - 20px);}
.chip{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:14px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;transition:background .2s,color .2s;}
.chip svg{width:18px;height:18px;flex:none;}
.chip:hover{color:var(--ink);background:rgba(255,255,255,.08);}
.chip[aria-pressed="true"],.chip.hot{background:var(--chip-on);color:var(--chip-on-ink);}
.chip.ic{padding:9px 10px;}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--glass-line);}
#back{display:none;} body.zoomed #back{display:flex;} body.zoomed .tw{display:none;}
#snd[aria-pressed="false"] .on, #snd[aria-pressed="true"] .off{display:none;}
.ico{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
#hint{position:fixed;left:50%;top:var(--hint-y,90px);transform:translate(-50%,-50%);z-index:11;padding:9px 15px;border-radius:999px;font-size:12.5px;color:var(--ink);white-space:nowrap;pointer-events:none;transition:opacity .5s;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;}
#hint.off{opacity:0;}

/* going on air */
#cam{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(0,0,0,.55);}
body.camopen #cam{display:grid;} body.camopen #hint{opacity:0;}
#cam .box{width:min(440px,calc(100% - 24px));border-radius:24px;padding:16px;}
#cam h2{font-family:var(--serif);font-size:18px;font-weight:600;}
#cam .sub{font-size:12px;color:var(--ink-dim);margin-top:4px;line-height:1.5;}
#cam .view{position:relative;margin-top:12px;max-height:44vh;margin-inline:auto;border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:#000;}
#cam video,#cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
#cam video{transform:scaleX(-1);}
#cam .rec{position:absolute;left:10px;top:10px;padding:4px 9px;border-radius:999px;background:#e5322d;color:#fff;font-size:11px;font-weight:600;display:none;}
#cam.recording .rec{display:block;}
#cam .row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
#cam .row .chip{flex:1;justify-content:center;border:1px solid var(--glass-line);}
#cam .shoot{background:#e5322d;color:#fff;}
#cam .note{font-size:11px;color:var(--ink-faint);margin-top:10px;line-height:1.5;}
#cam .stage-pick,#cam.picked .stage-shoot{display:none;}
#cam.picked .stage-pick{display:flex;}

#about{position:fixed;right:20px;top:calc(76px + env(safe-area-inset-top,0px));width:350px;max-height:calc(100% - 170px);overflow:auto;z-index:20;border-radius:22px;padding:20px 20px 18px;display:none;}
body.about #about{display:block;}
#about .tag{font-family:"JetBrains Mono","Noto Sans KR",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
#about h2{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25;margin-top:8px;padding-right:24px;}
#about p{font-size:12.5px;line-height:1.65;color:var(--ink-dim);margin-top:9px;}
#about h3{font-size:12px;font-weight:600;margin-top:16px;padding-top:14px;border-top:1px solid var(--glass-line);}
#about ol{margin:8px 0 0 18px;font-size:12.5px;line-height:1.6;color:var(--ink-dim);}
#about .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim);}
#about .x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;}
html[lang="ko"] #about .tag{letter-spacing:.04em;}
@media (max-width:760px){
  .chip{padding:8px 10px;font-size:11.5px;gap:5px;} #bar .chip .lb{display:none;}
  #hint{white-space:normal;text-align:center;border-radius:18px;width:max-content;line-height:1.45;}
  #about{left:10px;right:10px;width:auto;top:calc(64px + env(safe-area-inset-top,0px));}
  .title p{display:none;} .title h1{font-size:13px;}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<header class="top">
  <a class="logo" href="#" onclick="return false">Living Art Museum</a>
  <div class="title"><h1 id="t-h"></h1><p id="t-p"></p></div>
</header>
<div id="hint" class="glass off"></div>

<nav id="bar" class="glass">
  <button class="chip" id="back"><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span class="lb"></span></button>
  <button class="chip hot" id="onair"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 10.5l5-3v9l-5-3z"/></svg><span class="lb"></span></button>
  <button class="chip tw" id="allpow"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 7.2a8 8 0 1011.4 0"/></svg><span class="lb"></span></button>
  <button class="chip tw" id="sync"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="6" rx="1"/><rect x="14" y="4" width="7" height="6" rx="1"/><rect x="3" y="14" width="7" height="6" rx="1"/><rect x="14" y="14" width="7" height="6" rx="1"/></svg><span class="lb"></span></button>
  <span class="sep"></span>
  <button class="chip ic" id="snd" aria-pressed="true"><svg class="ico on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg><svg class="ico off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
  <button class="chip ic" id="info"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</nav>

<section id="cam" aria-modal="true" role="dialog">
  <div class="box glass">
    <h2 id="cam-h"></h2>
    <p class="sub" id="cam-sub"></p>
    <div class="view"><video id="vid" playsinline muted></video><canvas id="prev"></canvas><span class="rec" id="rec">REC</span></div>
    <div class="row stage-shoot">
      <button class="chip" id="m-photo" aria-pressed="true"></button>
      <button class="chip" id="m-clip" aria-pressed="false"></button>
      <button class="chip shoot" id="shoot"></button>
    </div>
    <div class="row stage-pick">
      <button class="chip shoot" id="put-all"></button>
      <button class="chip" id="put-me"></button>
      <button class="chip" id="again"></button>
    </div>
    <div class="row"><button class="chip" id="cam-tab" hidden></button><button class="chip" id="cam-x"></button></div>
    <p class="note" id="cam-note"></p>
  </div>
</section>

<section id="about" class="glass" aria-labelledby="ab-h">
  <button class="x" id="about-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="tag" id="ab-tag"></div>
  <h2 id="ab-h"></h2>
  <p id="ab-p1"></p>
  <p id="ab-p2"></p>
  <h3 id="ab-h3"></h3>
  <ol id="ab-ol"></ol>
</section>

<script>
"use strict";
/* ==========================================================================
   0. BASICS
   ========================================================================== */
const LANG = (() => {
  let l = (document.documentElement.lang || "en").slice(0, 2);
  try { const q = new URLSearchParams(location.search).get("lang"); if (q) l = q; } catch (_){}
  return l === "ko" ? "ko" : "en";
})();
document.documentElement.lang = LANG;
if (LANG === "ko") document.title = "다다익선 — Living Art Museum";
const T = (o) => (o && (o[LANG] ?? o.en)) || "";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const ease = (x) => { x = clamp(x, 0, 1); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let seed = 1988; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const hashS = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; };

/* ==========================================================================
   1. CHANNELS — eleven little broadcasts, each painted once a frame onto its
      own small screen and shared by every set tuned to it
   ========================================================================== */
const CW = 96, CH = 72;
const CHN = [
  { en:"Snow", ko:"지직" }, { en:"Colour bars", ko:"컬러바" }, { en:"Magnet", ko:"자석 TV" }, { en:"Fish", ko:"물고기" },
  { en:"Candle", ko:"촛불" }, { en:"Dancers", ko:"춤" }, { en:"Countdown", ko:"카운트다운" }, { en:"Moon", ko:"달" },
  { en:"Zen", ko:"선(禪)" }, { en:"Feedback", ko:"되먹임" }, { en:"Weather", ko:"날씨" },
];
const NCH = CHN.length, VIS = NCH;                        /* channel NCH: a visitor's clip, only on the sets that hold one */
const chans = CHN.map(() => { const c = document.createElement("canvas"); c.width = CW; c.height = CH; return c; });
const fish = Array.from({ length:5 }, () => ({ x:rnd() * CW, y:12 + rnd() * (CH - 24), v:(rnd() < .5 ? -1 : 1) * (6 + rnd() * 10), s:5 + rnd() * 6, c:`hsl(${20 + rnd() * 40},90%,55%)` }));
const snowImg = (() => { const q = chans[0].getContext("2d"); return q.createImageData(CW, CH); })();
function paintChannels(t){
  /* 0 · snow */
  { const q = chans[0].getContext("2d"), d = snowImg.data; for (let i = 0; i < d.length; i += 4){ const v = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; } q.putImageData(snowImg, 0, 0); }
  /* 1 · colour bars, with a bar of tone */
  { const q = chans[1].getContext("2d"), cols = ["#c0c0c0", "#c0c000", "#00c0c0", "#00c000", "#c000c0", "#c00000", "#0000c0"];
    cols.forEach((c, i) => { q.fillStyle = c; q.fillRect(i * CW / 7, 0, CW / 7 + 1, CH * .68); });
    ["#0000c0", "#131313", "#c000c0", "#131313", "#00c0c0", "#131313", "#c0c0c0"].forEach((c, i) => { q.fillStyle = c; q.fillRect(i * CW / 7, CH * .68, CW / 7 + 1, CH * .08); });
    q.fillStyle = "#0a0a0a"; q.fillRect(0, CH * .76, CW, CH); q.fillStyle = "#fff"; q.fillRect(CW * .14, CH * .78, CW * .14, CH * .2); q.fillStyle = "#2a0f6a"; q.fillRect(CW * .32, CH * .78, CW * .14, CH * .2); }
  /* 2 · a magnet on the tube: the picture pulled into loops */
  { const q = chans[2].getContext("2d"); q.fillStyle = "rgba(4,6,14,.35)"; q.fillRect(0, 0, CW, CH);
    q.lineWidth = 1.6; q.strokeStyle = `hsl(${(t * 40) % 360},90%,65%)`; q.beginPath();
    for (let k = 0; k <= 220; k++){ const a = k / 220 * Math.PI * 2, r = 22 + 8 * Math.sin(a * 3 + t * 1.7);
      const x = CW / 2 + Math.sin(a * 2 + t) * r * 1.3, y = CH / 2 + Math.sin(a * 3 + t * .7) * r * .8; k ? q.lineTo(x, y) : q.moveTo(x, y); } q.stroke(); }
  /* 3 · fish */
  { const q = chans[3].getContext("2d"), g = q.createLinearGradient(0, 0, 0, CH); g.addColorStop(0, "#0b4f7a"); g.addColorStop(1, "#05253a"); q.fillStyle = g; q.fillRect(0, 0, CW, CH);
    for (const f of fish){ f.x += f.v / 60; if (f.x < -12) f.x = CW + 12; if (f.x > CW + 12) f.x = -12; const y = f.y + Math.sin(t * 2 + f.s) * 3, d = Math.sign(f.v);
      q.fillStyle = f.c; q.beginPath(); q.ellipse(f.x, y, f.s, f.s * .5, 0, 0, 7); q.fill(); q.beginPath(); q.moveTo(f.x - d * f.s * .8, y); q.lineTo(f.x - d * f.s * 1.7, y - f.s * .5); q.lineTo(f.x - d * f.s * 1.7, y + f.s * .5); q.fill();
      q.fillStyle = "#fff"; q.beginPath(); q.arc(f.x + d * f.s * .5, y - 1, 1.1, 0, 7); q.fill(); }
    q.fillStyle = "rgba(255,255,255,.25)"; for (let k = 0; k < 5; k++){ const bx = (k * 23 + t * 3) % CW, by = CH - ((t * 12 + k * 17) % CH); q.beginPath(); q.arc(bx, by, 1.2, 0, 7); q.fill(); } }
  /* 4 · a candle */
  { const q = chans[4].getContext("2d"); q.fillStyle = "#050505"; q.fillRect(0, 0, CW, CH);
    const fl = 1 + Math.sin(t * 13) * .08 + Math.sin(t * 7.3) * .06, sway = Math.sin(t * 2.1) * 2;
    const glow = q.createRadialGradient(CW / 2, CH * .42, 1, CW / 2, CH * .42, 40); glow.addColorStop(0, "rgba(255,170,60,.45)"); glow.addColorStop(1, "rgba(255,120,30,0)"); q.fillStyle = glow; q.fillRect(0, 0, CW, CH);
    q.fillStyle = "#e8dcc4"; q.fillRect(CW / 2 - 6, CH * .55, 12, CH * .45);
    const fg = q.createLinearGradient(0, CH * .25, 0, CH * .56); fg.addColorStop(0, "#fff6c8"); fg.addColorStop(.6, "#ffb030"); fg.addColorStop(1, "#c04010");
    q.fillStyle = fg; q.beginPath(); q.moveTo(CW / 2 + sway, CH * (.55 - .3 * fl)); q.quadraticCurveTo(CW / 2 + 6, CH * .5, CW / 2, CH * .56); q.quadraticCurveTo(CW / 2 - 6, CH * .5, CW / 2 + sway, CH * (.55 - .3 * fl)); q.fill(); }
  /* 5 · dancers: figures jumping in colour */
  { const q = chans[5].getContext("2d"); q.fillStyle = `hsl(${(t * 30) % 360},70%,22%)`; q.fillRect(0, 0, CW, CH);
    for (let k = 0; k < 3; k++){ const x = 20 + k * 28, j = Math.abs(Math.sin(t * 4 + k)) * 10, y = CH - 14 - j, a = Math.sin(t * 6 + k * 2);
      q.strokeStyle = `hsl(${(k * 120 + t * 60) % 360},95%,65%)`; q.lineWidth = 3; q.lineCap = "round"; q.beginPath();
      q.moveTo(x, y - 22); q.lineTo(x, y - 6); q.moveTo(x, y - 6); q.lineTo(x - 6 - a * 3, y + 6); q.moveTo(x, y - 6); q.lineTo(x + 6 + a * 3, y + 6);
      q.moveTo(x, y - 18); q.lineTo(x - 10, y - 26 - a * 6); q.moveTo(x, y - 18); q.lineTo(x + 10, y - 26 + a * 6); q.stroke();
      q.fillStyle = q.strokeStyle; q.beginPath(); q.arc(x, y - 27, 4.5, 0, 7); q.fill(); } }
  /* 6 · countdown leader */
  { const q = chans[6].getContext("2d"), n = 9 - Math.floor(t % 9), f = t % 1; q.fillStyle = "#c9c4b6"; q.fillRect(0, 0, CW, CH);
    q.fillStyle = "#8a8578"; q.beginPath(); q.moveTo(CW / 2, CH / 2); q.arc(CW / 2, CH / 2, 60, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2); q.closePath(); q.fill();
    q.strokeStyle = "#222"; q.lineWidth = 1.5; q.beginPath(); q.arc(CW / 2, CH / 2, 26, 0, 7); q.arc(CW / 2, CH / 2, 21, 0, 7); q.moveTo(0, CH / 2); q.lineTo(CW, CH / 2); q.moveTo(CW / 2, 0); q.lineTo(CW / 2, CH); q.stroke();
    q.fillStyle = "#111"; q.font = "bold 30px Inter, sans-serif"; q.textAlign = "center"; q.textBaseline = "middle"; q.fillText(String(n), CW / 2, CH / 2 + 2); }
  /* 7 · the moon, through its phases */
  { const q = chans[7].getContext("2d"); q.fillStyle = "#04050a"; q.fillRect(0, 0, CW, CH);
    const ph = (t * .15) % 1, r = 20, cx = CW / 2, cy = CH / 2;
    q.fillStyle = "#f2efe2"; q.beginPath(); q.arc(cx, cy, r, 0, 7); q.fill();
    q.fillStyle = "rgba(4,5,10,.94)"; q.beginPath(); q.arc(cx + lerp(-2.1, 2.1, ph) * r, cy - 1, r * 1.02, 0, 7); q.fill();
    q.fillStyle = "rgba(255,255,255,.6)"; for (let i = 0; i < 9; i++) q.fillRect((i * 37) % CW, (i * 23) % CH, 1, 1); }
  /* 8 · zen: one white line through the dark */
  { const q = chans[8].getContext("2d"); q.fillStyle = "#020202"; q.fillRect(0, 0, CW, CH); q.fillStyle = "#f4f4ee"; q.fillRect(CW / 2 - .8 + Math.sin(t * 9) * .3, 4, 1.6, CH - 8); }
  /* 9 · feedback: the screen filmed by itself, spinning into colour */
  { const q = chans[9].getContext("2d"); q.save(); q.globalAlpha = .9; q.translate(CW / 2, CH / 2); q.rotate(.06); q.scale(.94, .94); q.drawImage(chans[9], -CW / 2, -CH / 2); q.restore();
    q.fillStyle = `hsl(${(t * 90) % 360},100%,60%)`; q.fillRect(CW / 2 - 3 + Math.sin(t * 2) * 20, CH / 2 - 3 + Math.cos(t * 1.7) * 14, 6, 6); }
  /* 10 · the weather map */
  { const q = chans[10].getContext("2d"); q.fillStyle = "#1a4d8f"; q.fillRect(0, 0, CW, CH);
    q.fillStyle = "#3f8d4a"; q.beginPath(); q.moveTo(40, 6); q.quadraticCurveTo(58, 12, 52, 30); q.quadraticCurveTo(60, 48, 46, 66); q.quadraticCurveTo(34, 60, 38, 40); q.quadraticCurveTo(30, 22, 40, 6); q.fill();
    q.font = "bold 11px Inter, sans-serif"; q.textAlign = "center"; const icons = ["☀", "☁", "☂"];
    [[46, 20], [48, 44], [64, 58]].forEach(([x, y], i) => { q.fillStyle = "#fff"; q.fillText(icons[(i + Math.floor(t / 2)) % 3], x, y); q.fillText(String(12 + ((i * 5 + Math.floor(t)) % 9)) + "°", x + 16, y); });
    q.fillStyle = "#e33"; q.fillRect(0, CH - 10, CW, 10); q.fillStyle = "#fff"; q.font = "bold 7px Inter, sans-serif"; q.textAlign = "left"; q.fillText("NEWS · 1988 · SEOUL", CW - ((t * 30) % (CW + 90)), CH - 2.5); }
}

/* ==========================================================================
   2. THE TOWER — tiers of sets, widest at the bottom, like a pagoda. Each
      tier shows its front and, angled back, a side either way.
   ========================================================================== */
const TW_ = 60, TH_ = 46, GAP = 3;                         /* a set: width, height (in tower units) */
const SIDE = 2, SK = .42, SY = -.22;                       /* sets per side face; how far a side is foreshortened and lifted */

      for (const r of docs) if (!tvs.some(v => v.clip && v.clip.id === r.id)) await placeClip(r, false);
    }, () => {}); } catch (_){}
}
(async () => { try { store.local = JSON.parse(localStorage.getItem(LKEY) || "[]").filter(r => r && Array.isArray(r.f)); } catch (_){ store.local = []; } })();

/* ==========================================================================
   7. SOUND — the hiss of many tubes, the thunk of a set, the dial's click
   ========================================================================== */
const AUD = (() => {
  let ctx = null, master = null, white = null, on = true, borrowed = false, amb = null, hissG = null;
  function ensure(){ if (ctx) return ctx; const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    try { const host = window.parent !== window && window.parent.__lamAudio && window.parent.__lamAudio(); if (host && host.state === "running"){ ctx = host; borrowed = true; } } catch (_){}
    if (!ctx){ try { ctx = new AC(); } catch (_){ return null; } }
    master = ctx.createGain(); master.gain.value = on ? .85 : 0; master.connect(ctx.destination);
    const n = ctx.sampleRate * 2; white = ctx.createBuffer(1, n, ctx.sampleRate); const w = white.getChannelData(0); for (let i = 0; i < n; i++) w[i] = Math.random() * 2 - 1;
    return ctx; }
  const ok = () => on && ensure() && ctx.state === "running";
  function start(){ if (amb || !ensure() || ctx.state !== "running") return;
    const s = ctx.createBufferSource(); s.buffer = white; s.loop = true; const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 5200; f.Q.value = .7;
    hissG = ctx.createGain(); hissG.gain.value = 0; s.connect(f); f.connect(hissG); hissG.connect(master); s.start(); amb = { s }; }
  function burst(tt, dur, f, q, gg, type){ const s = ctx.createBufferSource(); s.buffer = white; const fl = ctx.createBiquadFilter(); fl.type = type || "bandpass"; fl.frequency.value = f; fl.Q.value = q;
    const a = ctx.createGain(); a.gain.setValueAtTime(.0001, tt); a.gain.exponentialRampToValueAtTime(gg, tt + Math.min(.005, dur * .2)); a.gain.exponentialRampToValueAtTime(.0001, tt + dur);
    s.connect(fl); fl.connect(a); a.connect(master); s.start(tt, Math.random()); s.stop(tt + dur + .03); }
  function tone(tt, f0, f1, dur, gg, type){ const o = ctx.createOscillator(); o.type = type || "sine"; o.frequency.setValueAtTime(f0, tt); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, tt + dur);
    const a = ctx.createGain(); a.gain.setValueAtTime(.0001, tt); a.gain.exponentialRampToValueAtTime(gg, tt + .01); a.gain.exponentialRampToValueAtTime(.0001, tt + dur); o.connect(a); a.connect(master); o.start(tt); o.stop(tt + dur + .05); }
  return {
    unlock(){ if (ensure()){ if (ctx.state !== "running") ctx.resume().then(start).catch(() => {}); else start(); } },
    get on_(){ return on; }, set on_(v){ on = v; if (master) master.gain.setTargetAtTime(v ? .85 : 0, ctx.currentTime, .05); },
    stop(){ if (!ctx) return; if (amb) try { amb.s.stop(); } catch (_){} amb = null; try { master.disconnect(); } catch (_){} if (!borrowed) try { ctx.close(); } catch (_){} },
    /* how loud the tubes hiss: more sets on, closer in, louder */
    hiss(k){ if (hissG && ctx) hissG.gain.setTargetAtTime(on ? k : 0, ctx.currentTime, .2); },
    on(){ if (!ok()) return; const tt = ctx.currentTime; burst(tt, .03, 2600, 2, .12); tone(tt + .02, 900, 2400, .35, .025, "sine"); burst(tt + .05, .4, 6000, .6, .05); },
    off(){ if (!ok()) return; const tt = ctx.currentTime; burst(tt, .03, 2600, 2, .1); tone(tt, 2200, 700, .25, .02, "sine"); },
    dial(){ if (!ok()) return; const tt = ctx.currentTime; burst(tt, .02, 3200, 3, .12); burst(tt + .015, .015, 1800, 3, .06); burst(tt + .03, .18, 5000, .7, .05); },
    shutter(){ if (!ok()) return; const tt = ctx.currentTime; burst(tt, .03, 3600, 1.2, .18); burst(tt + .07, .03, 2900, 1.2, .12); },
    whoosh(){ if (!ok()) return; const tt = ctx.currentTime, s = ctx.createBufferSource(); s.buffer = white; const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = .8;
      f.frequency.setValueAtTime(700, tt); f.frequency.exponentialRampToValueAtTime(2600, tt + .3); const a = ctx.createGain(); a.gain.setValueAtTime(.0001, tt); a.gain.exponentialRampToValueAtTime(.035, tt + .05); a.gain.exponentialRampToValueAtTime(.0001, tt + .4);
      s.connect(f); f.connect(a); a.connect(master); s.start(tt, Math.random()); s.stop(tt + .45); },
    click(){ if (!ok()) return; burst(ctx.currentTime, .02, 3600, 3, .06); },
  };
})();

/* ==========================================================================
   8. LOOP
   ========================================================================== */
let last = performance.now(), t = 0, chT = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  const k = 1 - Math.exp(-dt * 5.5);
  camv.s = Math.exp(lerp(Math.log(camv.s), Math.log(camv.ts), k)); camv.x = lerp(camv.x, camv.tx, k); camv.y = lerp(camv.y, camv.ty, k);
  chT += dt; if (chT > 1 / 30){ chT = 0; paintChannels(t); }
  let onN = 0;
  for (const v of tvs){ v.pw = lerp(v.pw, v.on ? 1 : 0, Math.min(1, dt * (v.on ? 4 : 9))); v.flash = Math.max(0, v.flash - dt * 3); if (v.osd) v.osd = Math.max(0, v.osd - dt); if (v.on) onN++; }
  AUD.hiss(zoomed ? (zoomed.on && zoomed.ch === 0 ? .05 : .01) : .002 + .012 * onN / tvs.length);
  render(t);
}
